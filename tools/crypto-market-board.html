      return `<span class="ichip" title="${e(T(d.label))}"><b>${e(d.name)}</b>${inputs}<button data-c="rm" data-i="${i}" title="${e(T("Bỏ chỉ báo"))}">✕</button></span>`;
    }).join("");
  }

  return { INTERVALS, RANGES, TYPES, SCALES, DEFAULT, compact, full, chips, need, valid, fix, days };
})();
// Guide illustration: a fixed made-up price path (down → base → rally → top → drop) run through the real Indicators code,
// drawn as candles + the indicator (overlay or own pane) with numbered signal points. Deterministic, no network.
const GuideSvg = (() => {
  const W = 640, PH = 200, OH = 90, PAD = 6;
  let sample = null;

  // Seeded path so every viewer sees the same example.
  function bars() {
    if (sample) return sample;
    let seed = 7, p = 100;
    const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647 - 0.5;
    const legs = [[45, -0.006], [30, 0.0005], [55, 0.007], [20, 0], [25, -0.009]];
    const out = [];
    let t = 0;
    for (const [n, drift] of legs) for (let i = 0; i < n; i++) {
      const o = p, c = p * (1 + drift + rnd() * 0.05), hi = Math.max(o, c) * (1 + Math.abs(rnd()) * 0.02), lo = Math.min(o, c) * (1 - Math.abs(rnd()) * 0.02);
      const breakout = (t > 75 && t < 82) || (t > 150 && t < 156);
      out.push({ time: 1700000000 + t * 86400, open: o, high: hi, low: lo, close: c, volume: 1000 * (1 + Math.abs(rnd())) * (breakout ? 3 : 1) });
      p = c; t++;
    }
    return (sample = out);
  }

  // Signal points per indicator kind → [{ i, up }] (latest 5).
  function signals(id, lines, b) {
    const c = b.map(x => x.close), v = (ln, i) => ln.values[i], out = [];
    const cross = (a, z, i) => a[i - 1] != null && z[i - 1] != null && a[i] != null && z[i] != null && (a[i - 1] - z[i - 1]) * (a[i] - z[i]) < 0;
    for (let i = 1; i < b.length; i++) {
      if (["sma", "ema", "wma"].includes(id) && cross(c, lines[0].values, i)) out.push({ i, up: c[i] > v(lines[0], i) });
      if ((id === "bb" || id === "dc") && v(lines[0], i - 1) != null) {
        const up = id === "dc" ? v(lines[0], i - 1) : v(lines[0], i), lo = id === "dc" ? v(lines[2], i - 1) : v(lines[2], i);
        if (c[i] > up && !(c[i - 1] > (id === "dc" ? v(lines[0], i - 2) : v(lines[0], i - 1)))) out.push({ i, up: true });
        if (c[i] < lo && !(c[i - 1] < (id === "dc" ? v(lines[2], i - 2) : v(lines[2], i - 1)))) out.push({ i, up: false });
      }
      if (id === "psar" && v(lines[0], i) != null && v(lines[0], i - 1) != null && (v(lines[0], i - 1) > c[i - 1]) !== (v(lines[0], i) > c[i])) out.push({ i, up: v(lines[0], i) < c[i] });
      if (["ichi", "stoch"].includes(id) && cross(lines[0].values, lines[1].values, i)) out.push({ i, up: v(lines[0], i) > v(lines[1], i) });
      if (id === "adx" && cross(lines[1].values, lines[2].values, i)) out.push({ i, up: v(lines[1], i) > v(lines[2], i) });
      if (id === "macd" && cross(lines[1].values, lines[2].values, i)) out.push({ i, up: v(lines[1], i) > v(lines[2], i) });
      if (["rsi", "cci", "wr", "mfi", "roc"].includes(id)) {
        const lv = Indicators.DEFS[id].levels || [0], a = v(lines[0], i - 1), z = v(lines[0], i);
        if (a != null && z != null) for (const L of lv) if ((a - L) * (z - L) < 0) out.push({ i, up: z > a, L, lo: Math.min(...lv), hi: Math.max(...lv) });
      }
    }
    return out.slice(-5);
  }

  const path = (vals, x, y) => vals.map((val, i) => val == null ? null : `${x(i).toFixed(1)},${y(val).toFixed(1)}`).reduce((acc, p) => { if (p == null) acc.push([]); else acc[acc.length - 1].push(p); return acc; }, [[]])
    .filter(s => s.length > 1).map(s => `<polyline fill="none" points="${s.join(" ")}"`);

  // → { svg, points: [{ n, up }] }
  function render(id) {
    const def = Indicators.DEFS[id], b = bars(), lines = def.calc(b, Indicators.params(id), "#2563eb"), own = def.pane === "own";
    const H = PH + (own ? OH + 8 : 0), n = b.length, x = i => PAD + i * (W - 2 * PAD) / (n - 1);
    const ov = own ? [] : lines.flatMap(l => l.values).filter(Number.isFinite);
    const lo = Math.min(...b.map(k => k.low), ...ov), hi = Math.max(...b.map(k => k.high), ...ov), y = val => PAD + (hi - val) / (hi - lo) * (PH - 2 * PAD);
    let s = b.map((k, i) => `<line x1="${x(i).toFixed(1)}" x2="${x(i).toFixed(1)}" y1="${y(k.high).toFixed(1)}" y2="${y(k.low).toFixed(1)}" class="gw ${k.close >= k.open ? "u" : "d"}"/>`
      + `<rect x="${(x(i) - 1.3).toFixed(1)}" y="${y(Math.max(k.open, k.close)).toFixed(1)}" width="2.6" height="${Math.max(0.6, Math.abs(y(k.open) - y(k.close))).toFixed(1)}" class="gb ${k.close >= k.open ? "u" : "d"}"/>`).join("");
    let oy = null;
    if (!own) for (const l of lines) s += l.kind === "dots" ? l.values.map((val, i) => val == null ? "" : `<circle cx="${x(i).toFixed(1)}" cy="${y(val).toFixed(1)}" r="1.4" fill="${l.color}"/>`).join("")
      : path(l.values, x, y).map(p => `${p} stroke="${l.color}" stroke-width="1.6"${l.dash ? ' stroke-dasharray="4 3"' : ""}/>`).join("");
    else {
      const top = PH + 8, vals = lines.flatMap(l => l.values).concat(def.levels || []).filter(Number.isFinite), a = Math.min(...vals), z = Math.max(...vals);
      oy = val => top + 4 + (z - val) / ((z - a) || 1) * (OH - 8);
      s += `<rect x="0" y="${top}" width="${W}" height="${OH}" class="gpane"/>`;
      for (const L of def.levels || []) s += `<line x1="0" x2="${W}" y1="${oy(L).toFixed(1)}" y2="${oy(L).toFixed(1)}" class="glv"/><text x="${W - 4}" y="${(oy(L) - 2).toFixed(1)}" text-anchor="end" class="gtx">${L}</text>`;
      for (const l of lines) s += l.kind === "hist" ? l.values.map((val, i) => val == null ? "" : `<line x1="${x(i).toFixed(1)}" x2="${x(i).toFixed(1)}" y1="${oy(0).toFixed(1)}" y2="${oy(val).toFixed(1)}" stroke="${l.colors[i]}" stroke-width="2"/>`).join("")
        : path(l.values, x, oy).map(p => `${p} stroke="${l.color}" stroke-width="1.5"/>`).join("");
    }
    const pts = signals(id, lines, b).map((p, k) => ({ ...p, n: k + 1 }));
    for (const p of pts) {
      const cy = Math.max(10, Math.min(PH - 10, p.up ? y(b[p.i].low) + 12 : y(b[p.i].high) - 12));
      s += `<line x1="${x(p.i).toFixed(1)}" x2="${x(p.i).toFixed(1)}" y1="0" y2="${H}" class="gmk"/><circle cx="${x(p.i).toFixed(1)}" cy="${cy.toFixed(1)}" r="8" class="gpt ${p.up ? "u" : "d"}"/>`
        + `<text x="${x(p.i).toFixed(1)}" y="${(cy + 3.5).toFixed(1)}" text-anchor="middle" class="gpn">${p.n}</text>`;
    }
    const legend = lines.filter(l => l.kind !== "hist").map(l => ({ title: l.title, color: l.color }));
    return { svg: `<svg viewBox="0 0 ${W} ${H}" class="gsvg" role="img">${s}</svg>`, points: pts, legend };
  }

  return { render };
})();
// "?" next to each indicator in the full chart picker → detailed guide: what it measures, formula, how to read, illustrated example

const IndGuide = (() => {

  const lvText = (name, p) => T(LV[p.lo === p.hi ? (p.up ? "up0" : "down0") : p.L === p.lo ? (p.up ? "outLow" : "inLow") : (p.up ? "inHigh" : "outHigh")], { name, L: p.L });
  const kind = id => ["sma", "ema", "wma"].includes(id) ? "ma" : ["rsi", "cci", "wr", "mfi", "roc"].includes(id) ? "lv" : SIG[id] ? id : null;
  const ids = () => Object.keys(Indicators.DEFS).filter(k => !Indicators.DEFS[k].intraday && IND_GUIDE[k]);

  const e = s => Dom.esc(s ?? "");

  function body(id) {

      : `<p class="muted">${e(T("Chỉ báo này không cho tín hiệu mua / bán trực tiếp — xem hướng đi và phân kỳ như phần Cách đọc."))}</p>`;
    return `<div class="dlg-head"><span class="gd-title"><b>${e(d.name)}</b> ${e(T(d.label))}${g.imp ? ` <span class="badge imp">★ ${e(T("Quan trọng"))}</span>` : ""}</span>`

      + sec("Cách đọc", list(g.read))

        + `<p class="muted">${e(T("Dữ liệu giả lập (giảm → tích luỹ → tăng → đi ngang → giảm), chỉ báo tính bằng đúng công thức của tool với tham số mặc định. Số trên hình = điểm tín hiệu."))}</p>`)
      + sec("Ví dụ thực tế", `<p>${e(T(g.ex))}</p>`)
      + sec("Phối hợp với chỉ báo khác", list(g.combo))
      + sec("Lưu ý với crypto", `<p>${e(T(g.note))}</p>`)
      + `<p class="gd-act"><button data-g="toggle" data-v="${id}" class="${on ? "" : "main"}">${e(on ? T("✔ Đang hiện trên biểu đồ — bấm để ẩn") : T("➕ Hiện trên biểu đồ"))}</button>`
      + ` <span class="muted">${e(T("Chỉ để học và tham khảo, không phải lời khuyên đầu tư."))}</span></p></div>`;
  }

  function open(id) {
    if (!IND_GUIDE[id] || !Indicators.DEFS[id]) return;
    cur = id;
    const dlg = $("guideDlg");
    dlg.innerHTML = body(id);
    if (!dlg.open) dlg.showModal();
    dlg.querySelector(".dlg-body").scrollTop = 0;
  }

  function init() {
    const dlg = $("guideDlg");
    dlg.addEventListener("click", ev => {
      if (ev.target === dlg) { dlg.close(); return; }
      const b = ev.target.closest("[data-g]");
      if (!b) return;

      if (b.dataset.g === "nav") open(b.dataset.v);
      if (b.dataset.g === "toggle") { CoinChart.toggleInd(b.dataset.v); open(b.dataset.v); }
    });
    I18n.onChange(() => { if (dlg.open && cur) open(cur); });
  }

  return { init, open };
})();
// Coin chart: Binance klines, range (1 day → all) × interval (1m → 1M), in the detail tab "Kỹ thuật" + full-screen dialog, live candle via
// kline WebSocket, 6 chart types, log / % scale, 17 indicators (checkbox picker), compare coins, drawing tools, PNG. One shared state (Prefs "chart").
const CoinChart = (() => {
  const TYPES = CoinBar.TYPES.map(t => t[0]), SCALES = CoinBar.SCALES.map(t => t[0]), IV = CoinBar.INTERVALS.map(t => t[0]), RK = CoinBar.RANGES.map(r => r[0]);
  const WARM = 250;
  let st, sym = "", active = false, dlgOpen = false, data = { key: "", bars: [], cmp: [] }, seq = 0, mini, full, unsub = null, note = null, pickOpen = false;
  const draw = ChartDraw.create();

  function clean(raw) {
    const r = raw && typeof raw === "object" ? raw : {};
    const range = RK.includes(r.range) ? r.range : "1Y", v2 = r.v === 2; // v2: saved after peaks default → off, crosses → on
    return { range, interval: CoinBar.fix(range, IV.includes(r.interval) ? r.interval : "1d"), type: TYPES.includes(r.type) ? r.type : "candle", scale: SCALES.includes(r.scale) ? r.scale : "normal",
      volume: r.volume !== false, peaks: v2 && r.peaks === true, crosses: !v2 || r.crosses !== false, v: 2, ind: Indicators.clean(r.ind), cmp: CoinParse.clean(Array.isArray(r.cmp) ? r.cmp : [], 3) };
  }
  const save = () => Prefs.set("chart", st);
  const say = (id, key, p) => { const el = $(id); el.hidden = !key; el.textContent = key ? T(key, p) : ""; };
  const msg = key => { say("miniMsg", key); say("fullMsg", key); };
  function bars() { $("miniBar").innerHTML = CoinBar.compact(st); $("fullBar").innerHTML = CoinBar.full(st, draw.tool(), pickOpen); $("fullChips").innerHTML = CoinBar.chips(st.ind); alignPick(); }
  // Open the indicator list towards the side with room (the dialog clips anything past its edge).
  function alignPick() {
    const d = $("fullBar").querySelector("details.ipick[open]"), p = d && d.querySelector(".ipop");
    if (!p || matchMedia("(max-width: 640px)").matches) return;
    const r = d.getBoundingClientRect(), right = r.left + p.offsetWidth > $("chartDlg").getBoundingClientRect().right - 8;
    p.style.left = right ? "auto" : "0"; p.style.right = right ? "0" : "auto";
  }
  function head() {
    const r = Coins.row(sym), tone = Fmt.tone(r.pct);
    $("dlgTitle").innerHTML = `<b class="${tone}">${Dom.esc(sym)}</b> <span class="muted">${Dom.esc(r.name || "")}</span>` + (r.last ? ` <b class="${tone}">${Dom.esc(Fmt.money(r.last))}</b> <span class="${tone}">${Dom.esc(Fmt.pct(r.pct))}</span>` : "");
    $("dlgClose").title = T("Đóng (Esc)");
    $("fullStatus").textContent = note ? T(note.key, note.p) : draw.tool() ? T(draw.needsTwo() ? "Bấm 2 điểm trên biểu đồ." : "Bấm 1 điểm trên biểu đồ.") : T("Kéo để cuộn, lăn chuột / chụm 2 ngón để phóng to, bấm đúp trục giá để tự co giãn.");
  }

  async function load() {
    if (!sym || (!active && !dlgOpen)) return;
    const pair = Coins.pair(sym);
    if (!pair) { data = { key: "", bars: [], cmp: [] }; [mini, full].forEach(v => v.destroy()); msg(Coins.ready() ? "Coin này không có cặp USDT trên Binance nên không có biểu đồ nến." : "Đang tải dữ liệu biểu đồ…"); return; }
    const my = ++seq, key = `${pair}|${st.range}|${st.interval}|${st.cmp.join()}`;
    if (data.key !== key) {
      msg("Đang tải dữ liệu biểu đồ…");
      try {
        const others = st.cmp.filter(c => c !== sym && Coins.pair(c)), n = Math.min(5000, CoinBar.need(st.range, st.interval) + WARM);
        const [raw, ...cmp] = await Promise.all([Spot.klines(pair, st.interval, n), ...others.map(c => Spot.klines(Coins.pair(c), st.interval, n).catch(() => []))]);
        if (my !== seq) return;
        data = { key, bars: raw, cmp: others.map((name, i) => ({ name, bars: cmp[i] })).filter(c => c.bars.length) };
      } catch (e) {
        if (my !== seq) return;
        console.warn("CoinChart.load - get klines fail", pair, e.message);
        data = { key: "", bars: [], cmp: [] }; [mini, full].forEach(v => v.destroy());
        msg("Không tải được nến từ Binance. Thử lại sau.");
        return;
      }
    }
    render(false);
    stream(pair);
  }

  // Live candle: the kline stream of the shown interval updates (or appends) the last bar of both charts.
  function stream(pair) {
    if (unsub) unsub();
    unsub = Live.sub(`${pair.toLowerCase()}@kline_${st.interval}`, d => {
      if (!d || !d.k || !data.bars.length) return;
      const b = Spot.liveBar(d.k);
      mini.updateLast(b); if (dlgOpen) full.updateLast(b);
    });
  }

  function render(keep) {
    if (!data.bars.length) { [mini, full].forEach(v => v.destroy()); msg("Không có dữ liệu nến."); return; }
    msg(null);
    const intraday = !["1d", "1w", "1M"].includes(st.interval), inds = Indicators.compute(st.ind, data.bars);
    const s = { bars: data.bars, type: st.type, scale: data.cmp.length ? "pct" : st.scale, volume: st.volume, peaks: st.peaks, crosses: st.crosses, inds, intraday, from: Math.max(0, data.bars.length - CoinBar.need(st.range, st.interval)), keep, compare: data.cmp };
    if (active) mini.render(s);
    if (dlgOpen) { full.render(s); draw.apply(full); }
  }

  function show(on, s) {
    active = on;
    if (s && s !== sym) { sym = s; draw.clear(); note = null; data.key = ""; }
    if (!on && !dlgOpen) { if (unsub) { unsub(); unsub = null; } mini.destroy(); return; }
    load();
  }

  function onBar(e) {
    const el = e.target.closest("[data-c]");
    if (!el || (e.type === "click" && /^(SELECT|INPUT)$/.test(el.tagName))) return;
    const c = el.dataset.c, v = el.dataset.v ?? el.value;
    if (c === "open") { openDialog(); return; }
    if (c === "guide") { IndGuide.open(v); return; }
    if (c === "fit") { (dlgOpen ? full : mini).fit(); return; }
    if (c === "png") { const cv = full.screenshot(); if (cv) cv.toBlob(b => { const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = `${sym}-${st.interval}.png`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000); }); return; }
    if (c === "tool") { draw.setTool(v); note = null; bars(); head(); return; }
    if (c === "clearDraw") { draw.clear(); note = null; head(); render(true); return; }
    if (c === "range" && RK.includes(v)) { st.range = v; st.interval = CoinBar.fix(v, st.interval); }
    else if (c === "interval" && IV.includes(v) && CoinBar.valid(st.range, v)) st.interval = v;
    else if (c === "type" && TYPES.includes(v)) st.type = v;
    else if (c === "scale" && SCALES.includes(v)) st.scale = v;
    else if (c === "volume") st.volume = el.checked;
    else if (c === "peaks" || c === "crosses") { st[c] = el.checked; pickOpen = true; }
    else if (c === "cmp") st.cmp = CoinParse.parse(el.value).symbols.slice(0, 3);
    else if (c === "ind" && Object.hasOwn(Indicators.DEFS, v)) { st.ind = el.checked ? Indicators.add(st.ind, v) : st.ind.filter(x => x.id !== v); pickOpen = true; }
    else if (c === "rm") st.ind = st.ind.filter((_, i) => i !== +el.dataset.i);
    else if (c === "param") { const x = st.ind[+el.dataset.i]; if (!x) return; x.p = Indicators.params(x.id, { ...x.p, [el.dataset.k]: el.value }); }
    else return;
    save(); bars();
    if (["range", "interval", "cmp"].includes(c)) load(); else render(true);
  }

  function openDialog() {
    if (!sym) return;
    const dlg = $("chartDlg");
    if (!dlg.open) dlg.showModal();
    dlgOpen = true; bars(); head(); load();
  }

  function init() {
    st = clean(Prefs.get("chart"));
    mini = TechChart.create($("miniHost"), { legend: $("miniLegend"), compact: true });
    full = TechChart.create($("fullHost"), { legend: $("fullLegend"), tip: $("fullTip"), onClick: pt => { const r = draw.click(pt, data.bars); if (!r) return; note = r; head(); if (r.redraw) render(true); } });
    for (const id of ["miniBar", "fullBar", "fullChips"]) { $(id).addEventListener("click", onBar); $(id).addEventListener("change", onBar); }
    $("fullBar").addEventListener("toggle", e => { if (e.target.matches("details.ipick")) { pickOpen = e.target.open; alignPick(); } }, true);
    document.addEventListener("click", e => { const d = $("fullBar").querySelector("details.ipick[open]"); if (d && !d.contains(e.target)) { d.open = false; pickOpen = false; } });
    $("dlgClose").onclick = () => $("chartDlg").close();
    $("chartDlg").addEventListener("close", () => { dlgOpen = false; full.destroy(); draw.setTool(draw.tool()); if (!active && unsub) { unsub(); unsub = null; } });
    bars();
  }

  // Guide dialog button: show / hide every instance of one indicator.
  function toggleInd(id) {
    if (!Object.hasOwn(Indicators.DEFS, id)) return;
    st.ind = st.ind.some(x => x.id === id) ? st.ind.filter(x => x.id !== id) : Indicators.add(st.ind, id);
    save(); bars(); render(true);
  }

  return { init, show, openDialog, toggleInd, set: raw => { st = clean(raw); save(); bars(); data.key = ""; load(); }, get: () => st, relabel: () => { bars(); if (dlgOpen) head(); }, bars: () => data.bars, symbol: () => sym };
})();
// Under the chart: rule-based technical read (TechOutlook score −100…+100) on 1h / 4h / 1D candles — trend label, RSI, ADX, ATR,
// support / resistance, pivots, the daily signal list, and how often price rose after past bars with a similar score.
const OutlookView = (() => {
  const TFS = [["1h", "1 giờ", 500], ["4h", "4 giờ", 500], ["1d", "1 ngày", 1000]];
  const SIG = { aboveFast: "Giá so với MA20", aboveMid: "Giá so với MA50", aboveSlow: "Giá so với MA200", maOrder: "Thứ tự MA20 / MA50 / MA200", slope: "Độ dốc MA50 (5 nến)",
    rsi: "RSI 14", macd: "MACD so với đường tín hiệu", macdHist: "Histogram MACD", adx: "ADX (sức mạnh xu hướng)", bb: "Vị trí trong dải Bollinger", volume: "Khối lượng so với TB 20 nến" };
  const cache = new Map();
  let sym = "", seq = 0;
  const e = s => Dom.esc(s ?? "");
  const tone = b => b > 0 ? "up" : b < 0 ? "down" : "ref";
  const vote = v => v > 0 ? ["up", "Tích cực"] : v < 0 ? ["down", "Tiêu cực"] : ["ref", "Trung tính"];

  async function frames(pair) {
    const key = pair, hit = cache.get(key);
    if (hit && Date.now() - hit.at < 60e3) return hit.list;
    const list = await Promise.all(TFS.map(async ([iv, label, n]) => ({ iv, label, f: TechOutlook.frame(await Spot.klines(pair, iv, n), "D", [1, 5]) })));
    cache.set(key, { at: Date.now(), list });
    return list;
  }

  function card(x) {
    const f = x.f;
    if (!f) return `<div class="ol-card"><b>${e(T(x.label))}</b><p class="muted">${e(T("Chưa đủ dữ liệu."))}</p></div>`;
    const o = f.odds[5];
    return `<div class="ol-card"><div class="ol-h"><b>${e(T(x.label))}</b><span class="badge ${tone(f.bucket)}">${e(T(f.label))} · ${f.score > 0 ? "+" : ""}${f.score}</span></div>`
      + `<div class="ol-meter"><i style="left:${((f.score + 100) / 2).toFixed(0)}%"></i></div>`
      + `<div class="stats"><div><span>RSI 14</span><b>${f.rsi == null ? "—" : Fmt.en(f.rsi, 0)}</b></div><div><span>ADX</span><b>${f.adx == null ? "—" : Fmt.en(f.adx, 0)}</b></div>`
      + `<div><span>${e(T("Biên độ ATR"))}</span><b>${f.atrPct == null ? "—" : Fmt.en(f.atrPct, 2) + "%"}</b></div>`
      + `<div><span>${e(T("Hỗ trợ / kháng cự"))}</span><b>${e(Fmt.price(f.support))} / ${e(Fmt.price(f.resistance))}</b></div>`
      + `<div><span>Pivot</span><b>${e(Fmt.price(f.pivots.p))}</b></div><div><span>R1 / S1</span><b>${e(Fmt.price(f.pivots.r1))} / ${e(Fmt.price(f.pivots.s1))}</b></div></div>`
      + (o && o.n ? `<p class="muted ol-odds">${e(T("Lịch sử: sau {n} nến có điểm tương tự, giá cao hơn 5 nến sau {p}% số lần (trung vị {m}%).", { n: o.n, p: Fmt.en(o.up, 0), m: Fmt.signed(o.median, 1) }))}${o.broad ? " " + e(T("(gộp cả nhóm cùng chiều vì ít mẫu)")) : ""}</p>` : "")
      + `</div>`;
  }

  function signals(f) {
    if (!f) return "";
    return `<table class="dtable"><thead><tr><th>${e(T("Tín hiệu (khung ngày)"))}</th><th>${e(T("Giá trị"))}</th><th>${e(T("Đánh giá"))}</th></tr></thead><tbody>`
      + f.signals.map(s => { const [c, l] = vote(s.vote); return `<tr><td>${e(T(SIG[s.key] || s.key))}</td><td>${s.val == null ? "" : e(Math.abs(s.val) >= 1 ? Fmt.price(s.val) : Fmt.en(s.val, 2))}</td><td class="${c}">${e(T(l))}</td></tr>`; }).join("")
      + `</tbody></table>`;
  }

  async function open(s) {
    sym = s;
    const my = ++seq, el = $("dOutlook"), pair = Coins.pair(s);

    } catch (err) {
      if (my !== seq) return;

    }
  }

  return { open, close: () => { seq++; } };
})();
// "Khuyến nghị" tab: CoinAdvice on 4h / 1D / 1W Binance candles + funding, Fear & Greed, BTC trend — action, when to buy / sell,
// buy / sell zones, stop-loss per horizon, and other key notes. Rule-based, refreshed each time the tab opens (1-min cache).
const AdviceView = (() => {
  const HORIZON = { short: ["Hôm nay / ngắn hạn", "1–5 ngày"], medium: ["Trung hạn", "2–8 tuần"], long: ["Dài hạn", "6–24 tháng"] };
  const PRICE = new Set(["a", "b", "c", "d", "r", "s"]);
  const cache = new Map();
  let sym = "", seq = 0;
  const e = s => Dom.esc(s ?? "");
  // Translate a [key, params] pair: price params → coin price format, m → money, f → funding %, tf → translated word.
  const fmt = (v, k) => typeof v !== "number" ? T(v) : PRICE.has(k) ? Fmt.price(v) : k === "m" ? Fmt.moneyBig(v) : k === "f" ? Fmt.en(v, 4) : Fmt.en(v, Number.isInteger(v) ? 0 : 1);
  const tr = (key, p = {}) => T(key, Object.fromEntries(Object.entries(p).map(([k, v]) => [k, fmt(v, k)])));
  const range = z => `${Fmt.price(z.lo)} – ${Fmt.price(z.hi)}`;

  async function load(s, pair) {
    const hit = cache.get(pair);
    if (hit && Date.now() - hit.at < 60e3) return hit.v;
    const isBtc = s === "BTC";
    const [h4, d1, w1] = await Promise.all([Spot.klines(pair, "4h", 300), Spot.klines(pair, "1d", 1000), Spot.klines(pair, "1w", 400)]);
    const [btc, fut, fng] = await Promise.allSettled([isBtc ? null : Spot.klines("BTCUSDT", "1d", 300), Futures.board(Coins.hasSpot, 60e3), FearGreed.history(1)]);
    const f = fut.status === "fulfilled" ? fut.value.find(x => x.sym === s) : null;
    const v = CoinAdvice.build({ h4, d1, w1 }, { isBtc, btc: btc.value || null, funding: f ? f.funding : null, fng: fng.status === "fulfilled" && fng.value[0] ? fng.value[0].v : null, qvol: Coins.row(s).qvol });
    cache.set(pair, { at: Date.now(), v });
    return v;
  }

  function card(h) {
    const [title, span] = HORIZON[h.id], o = h.odds;
    const row = (label, val, sub, cls = "") => `<div class="adv-row"><span>${e(T(label))}</span><b class="${cls}">${e(val)}</b><em class="muted">${e(sub)}</em></div>`;
    return `<div class="ol-card adv-card"><div class="ol-h"><b>${e(T(title))} <span class="muted">· ${e(T(span))}</span></b><span class="badge ${h.tone}">${e(T(h.action))}</span></div>`
      + `<div class="ol-meter" title="${e(T("Điểm kỹ thuật {s} (−100…+100)", { s: h.score }))}"><i style="left:${((h.score + 100) / 2).toFixed(0)}%"></i></div>`
      + row("Vùng mua", range(h.buy), T(h.buy.basis), "up") + row("Vùng bán / chốt lời", range(h.sell), T(h.sell.basis), "down")
      + row("Dừng lỗ", Fmt.price(h.stop.v), tr(h.stop.basis, { n: h.stop.n }), "down")
      + row("Lời : lỗ", h.rr == null ? "—" : `1 : ${Fmt.en(Math.max(0, h.rr), 1)}`, T(h.tone === "down" ? "nếu mua ở vùng mua — chỉ tham khảo khi xu hướng còn giảm" : h.rr >= 2 ? "đáng giá" : h.rr >= 1 ? "tạm được" : "kém — chờ giá tốt hơn"), h.tone === "down" ? "" : h.rr >= 2 ? "up" : h.rr < 1 ? "down" : "")
      + `<ul class="insights adv-when">${h.timing.map(([k, p]) => `<li>${e(tr(k, p))}</li>`).join("")}</ul>`
      + (o && o.n ? `<p class="muted adv-odds">${e(T("Lịch sử: sau {n} lần có điểm tương tự, giá cao hơn {h} sau {p}% số lần (trung vị {m}%).", { n: o.n, h: T(h.oddsH), p: Fmt.en(o.up, 0), m: Fmt.signed(o.median, 1) }))}</p>` : "")
      + `</div>`;
  }

  async function open(s) {
    sym = s;
    const my = ++seq, el = $("dAdvice"), pair = Coins.pair(s), head = `<div class="dsec"><b>${e(T("Khuyến nghị"))}</b><span class="muted">${e(T("tự động theo quy tắc kỹ thuật — không phải lời khuyên đầu tư"))}</span></div>`;
    if (MarketMath.isStable(Coins.row(s))) { el.innerHTML = head + `<p class="pad muted">${e(T("{s} là stablecoin (giá neo ~1$) — không có khuyến nghị mua / bán theo giá.", { s }))}</p>`; return; }
    if (!pair) { el.innerHTML = head + `<p class="pad muted">${e(T("Coin này không có cặp USDT trên Binance nên không có biểu đồ nến."))}</p>`; return; }
    el.innerHTML = head + `<p class="pad muted">${e(T("Đang tính…"))}</p>`;
    try {
      const v = await load(s, pair);
      if (my !== seq) return;

      el.innerHTML = head + `<p class="pad adv-price">${e(T("Giá tham chiếu {p} (đóng cửa nến ngày hiện tại)", { p: Fmt.price(v.price) }))}</p>`

        + `<p class="sc-note">${e(T("Cách tính: điểm kỹ thuật (MA20/50/200, RSI, MACD, ADX, Bollinger, khối lượng) quyết định hành động; vùng mua / bán lấy từ pivot, MA, đỉnh / đáy gần nhất ± một phần ATR; dừng lỗ dưới vùng mua 0,5–1 ATR. Ngắn hạn dùng nến 4h + ngày, trung hạn nến ngày, dài hạn nến tuần."))}</p>`;
    } catch (err) {
      if (my !== seq) return;
      console.warn("AdviceView.open - load klines fail", s, err.message);
      el.innerHTML = head + `<div class="errbox">${e(T("Không tải được nến để tính khuyến nghị."))}</div>`;

  }

})();
// "Sổ lệnh" tab: Binance order book (top 15 per side, depth bars, spread, bid/ask imbalance) + realtime aggregated trades with taker buy/sell split.
const BookView = (() => {
  const LV = 15, KEEP = 50;
  let sym = "", pair = "", book = null, trades = [], unsubs = [], timer = 0, seq = 0;
  const e = s => Dom.esc(s ?? "");

  function bookHtml() {
    if (!book || !book.bids.length || !book.asks.length) return `<p class="pad muted">${e(T("Đang tải sổ lệnh…"))}</p>`;
    const asks = book.asks.slice(0, LV), bids = book.bids.slice(0, LV);
    const cum = list => { let t = 0; return list.map(([p, q]) => (t += q, [p, q, t])); };
    const ca = cum(asks), cb = cum(bids), max = Math.max(ca.at(-1)[2], cb.at(-1)[2]);
    const row = (side, [p, q, c]) => `<tr class="${side}"><td class="${side === "a" ? "down" : "up"}">${e(Fmt.price(p))}</td><td>${e(Fmt.qty(q))}</td><td>${e(Fmt.moneyBig(p * q))}</td>`
      + `<td class="bk-bar"><i class="${side}" style="width:${(c / max * 100).toFixed(1)}%"></i></td></tr>`;
    const bidV = bids.reduce((t, [p, q]) => t + p * q, 0), askV = asks.reduce((t, [p, q]) => t + p * q, 0), imb = bidV + askV ? (bidV - askV) / (bidV + askV) * 100 : 0;
    const spread = asks[0][0] - bids[0][0], mid = (asks[0][0] + bids[0][0]) / 2;
    return `<table class="dtable book"><thead><tr><th>${e(T("Giá"))}</th><th>${e(T("Số lượng"))}</th><th>${e(T("Giá trị"))}</th><th>${e(T("Luỹ kế"))}</th></tr></thead><tbody>`
      + ca.slice().reverse().map(r => row("a", r)).join("")
      + `<tr class="spread"><td colspan="4">${e(T("Chênh lệch {s} ({p}%)", { s: Fmt.price(spread), p: Fmt.en(spread / mid * 100, 4) }))}</td></tr>`
      + cb.map(r => row("b", r)).join("") + `</tbody></table>`
      + `<div class="sides"><span class="up">${e(T("Bên mua {v}", { v: Fmt.moneyBig(bidV) }))}</span><span class="${Fmt.tone(imb)}">${e(T("Lệch {p}", { p: Fmt.pct(imb, 1) }))}</span><span class="down">${e(T("Bên bán {v}", { v: Fmt.moneyBig(askV) }))}</span>`
      + `<div class="sbar"><i class="up" style="width:${(bidV / (bidV + askV) * 100).toFixed(1)}%"></i><i class="down" style="flex:1"></i></div></div>`;
  }

  function tradesHtml() {
    if (!trades.length) return "";
    const buy = trades.filter(t => t.buy).reduce((s, t) => s + t.p * t.q, 0), all = trades.reduce((s, t) => s + t.p * t.q, 0);
    const fmtT = t => new Date(t).toLocaleTimeString(I18n.lang, { hour12: false });
    return `<div class="dsec"><b>${e(T("Khớp lệnh gần nhất"))}</b><span class="muted">${e(T("Mua chủ động {p}% giá trị", { p: Fmt.en(all ? buy / all * 100 : 0, 0) }))}</span></div>`
      + `<table class="dtable trades"><thead><tr><th>${e(T("Giờ"))}</th><th>${e(T("Giá"))}</th><th>${e(T("Số lượng"))}</th><th>${e(T("Giá trị"))}</th></tr></thead><tbody>`
      + trades.slice(0, 40).map(t => `<tr><td class="muted">${e(fmtT(t.t))}</td><td class="${t.buy ? "up" : "down"}">${e(Fmt.price(t.p))}</td><td>${e(Fmt.qty(t.q))}</td><td>${e(Fmt.moneyBig(t.p * t.q))}</td></tr>`).join("")
      + `</tbody></table>`;
  }

  function paint() { timer = 0; const el = $("dBook"); if (el && pair) el.innerHTML = bookHtml() + tradesHtml() + `<p class="src muted">${e(T("Nguồn: Binance {p}, cập nhật mỗi giây", { p: pair }))}</p>`; }
  const later = () => { if (!timer) timer = setTimeout(paint, 500); };

  async function open(s) {
    close();
    sym = s; pair = Coins.pair(s) || ""; book = null; trades = [];
    const my = ++seq;
    if (!pair) { $("dBook").innerHTML = `<p class="pad muted">${e(T("Coin này không có cặp USDT trên Binance nên không có sổ lệnh."))}</p>`; return; }
    paint();
    const lp = pair.toLowerCase();
    unsubs = [Live.sub(`${lp}@depth20@1000ms`, d => { if (d && d.bids) { book = { bids: d.bids.map(([p, q]) => [+p, +q]), asks: d.asks.map(([p, q]) => [+p, +q]) }; later(); } }),
      Live.sub(`${lp}@aggTrade`, d => { if (d && d.p) { trades.unshift(Spot.trade(d)); if (trades.length > KEEP) trades.length = KEEP; later(); } })];
    try {
      const [b, t] = await Promise.all([Spot.depth(pair, 20), Spot.trades(pair, KEEP)]);
      if (my !== seq) return;
      if (!book) book = b;
      if (!trades.length) trades = t;
      paint();
    } catch (err) {
      if (my !== seq) return;
      console.warn("BookView.open - load depth fail", pair, err.message);
      $("dBook").innerHTML = `<div class="errbox">${e(T("Không tải được sổ lệnh từ Binance."))}</div>`;
    }
  }

  function close() { seq++; unsubs.forEach(u => u()); unsubs = []; clearTimeout(timer); timer = 0; pair = ""; }

  return { open, close };
})();
// "Phái sinh" tab (CryptoQuant / Coinglass view of one coin's Binance perpetual): mark / index / basis, funding now + history,
// open interest, long/short account ratio vs top traders, taker buy/sell ratio, and a plain-language read of positioning.
const DerivView = (() => {
  const PERIODS = [["1h", "1 giờ", 48], ["4h", "4 giờ", 42], ["1d", "1 ngày", 30]];
  let sym = "", seq = 0, period = ["1h", "4h", "1d"].includes(Prefs.get("deriv.period")) ? Prefs.get("deriv.period") : "4h", charts = [], wired = false;
  const e = s => Dom.esc(s ?? "");
  const card = (label, value, sub = "", cls = "") => `<div class="card"><span>${e(label)}</span><b class="${cls}">${e(value)}</b><em class="muted">${e(sub)}</em></div>`;

  // Rules of thumb: funding > 0.03 %/8h or long/short > 2 = crowded longs (squeeze risk down); negative funding = crowded shorts.
  function reads(f, ls, tk, oi) {
    const out = [];
    if (f.funding > 0.03) out.push(["down", T("Funding cao ({p}/8h): phe Long đang trả phí đắt — thị trường quá hưng phấn, dễ có cú quét Long.", { p: Fmt.pct(f.funding, 4) })]);
    else if (f.funding < 0) out.push(["up", T("Funding âm ({p}/8h): phe Short đang trả phí — nếu giá tăng có thể xảy ra short squeeze.", { p: Fmt.pct(f.funding, 4) })]);
    else out.push(["ref", T("Funding bình thường ({p}/8h).", { p: Fmt.pct(f.funding, 4) })]);
    const l = ls.at(-1), t = tk.at(-1);
    if (l) out.push([l.ratio > 2 ? "down" : l.ratio < 0.8 ? "up" : "ref", T("{p}% tài khoản đang Long (tỷ lệ Long/Short {r}).", { p: Fmt.en(l.long * 100, 0), r: Fmt.en(l.ratio, 2) })]);
    if (t) out.push([t.ratio > 1.05 ? "up" : t.ratio < 0.95 ? "down" : "ref", T("Taker mua/bán {r}: {s}.", { r: Fmt.en(t.ratio, 2), s: t.ratio > 1.05 ? T("bên mua chủ động lấn át") : t.ratio < 0.95 ? T("bên bán chủ động lấn át") : T("cân bằng") })]);
    if (oi.length > 1) {
      const ch = (oi.at(-1).oiv / oi[0].oiv - 1) * 100;
      out.push([ch > 0 ? "up" : "down", T("Hợp đồng mở (OI) {p} trong kỳ — {s}.", { p: Fmt.pct(ch, 1), s: ch > 10 ? T("đòn bẩy đang tăng nhanh, biến động có thể mạnh") : ch < -10 ? T("vị thế đang bị đóng / thanh lý") : T("ổn định") })]);
    }
    return `<ul class="insights">${out.map(([c, x]) => `<li class="${c}">${e(x)}</li>`).join("")}</ul>`;
  }

  function chartBox(id) { return `<div class="cbox sc-box tall"><div class="clegend" id="${id}L"></div><div class="chost" id="${id}H"></div></div>`; }
  function draw(oi, fr, ls, top, tk) {
    charts.forEach(c => c.destroy());
    const a = SeriesChart.create($("dvAH"), { legend: $("dvAL"), fmt: v => Fmt.big(v) }), b = SeriesChart.create($("dvBH"), { legend: $("dvBL"), fmt: v => Fmt.en(v, 2) });
    const intraday = period !== "1d", s = x => Math.floor(x / 1000);
    a.set([{ title: T("OI (USD)"), type: "area", color: "#0ea5e9", data: oi.map(x => ({ time: s(x.t), value: x.oiv })) },
      { title: T("Funding %/8h"), type: "hist", color: "#a855f7", pane: 1, fmt: v => Fmt.en(v, 4) + "%", data: fr.map(x => ({ time: s(x.t), value: x.rate, color: x.rate >= 0 ? "#22c55e99" : "#ef444499" })) }], { intraday });
    b.set([{ title: T("Long/Short tài khoản"), color: "#f59e0b", data: ls.map(x => ({ time: s(x.t), value: x.ratio })), levels: [{ price: 1 }] },
      { title: T("Long/Short top trader"), color: "#3b82f6", data: top.map(x => ({ time: s(x.t), value: x.ratio })) },
      { title: T("Taker mua/bán"), color: "#14b8a6", pane: 1, data: tk.map(x => ({ time: s(x.t), value: x.ratio })), levels: [{ price: 1 }] }], { intraday });
    charts = [a, b];
  }

  async function open(s) {
    sym = s;
    const my = ++seq, el = $("dDeriv");
    el.innerHTML = `<p class="pad muted">${e(T("Đang tải dữ liệu phái sinh…"))}</p>`;
    try {
      const all = await Futures.board(Coins.hasSpot, 15e3), f = all.find(x => x.sym === s);
      if (my !== seq) return;
      if (!f) { el.innerHTML = `<p class="pad muted">${e(T("{s} không có hợp đồng vĩnh cửu USDT trên Binance Futures.", { s }))}</p>`; return; }
      const [, label, n] = PERIODS.find(p => p[0] === period);
      const [oi, fr, ls, top, tk] = await Promise.all([Futures.openInterest(f.pair, period, n), Futures.funding(f.pair, 60), Futures.longShort(f.pair, period, n), Futures.topTraders(f.pair, period, n), Futures.taker(f.pair, period, n)]);
      if (my !== seq) return;
      const oiNow = oi.at(-1);
      el.innerHTML = `<div class="dsec"><b>${e(T("Hợp đồng {p}", { p: f.pair }))}</b><span class="seg">${PERIODS.map(([k, l]) => `<button data-dp="${k}"${k === period ? ' class="on"' : ""}>${e(T(l))}</button>`).join("")}</span></div>`
        + `<div class="cards">${card(T("Giá mark"), Fmt.money(f.mark), T("Index {p}", { p: Fmt.money(f.index) }))}${card(T("Chênh mark − index"), Fmt.pct(f.basis, 3), T("dương = futures cao hơn spot"), Fmt.tone(f.basis))}`
        + card(T("Funding hiện tại"), Fmt.pct(f.funding, 4), T("≈ {y}/năm · còn {c}", { y: Fmt.pct(f.funding * 3 * 365, 1), c: BoardCols.countdown(f.next - Date.now()) }), BoardCols.C.funding.f(f).c)
        + card(T("Hợp đồng mở (OI)"), oiNow ? Fmt.moneyBig(oiNow.oiv) : "—", oiNow ? T("{q} {s}", { q: Fmt.big(oiNow.oi), s: f.sym }) : "")
        + card(T("KL futures 24h"), Fmt.moneyBig(f.qvol), Fmt.pct(f.pct) + " · 24h", Fmt.tone(f.pct)) + `</div>`
        + reads(f, ls, tk, oi)
        + `<div class="dsec"><b>${e(T("OI & funding ({l})", { l: T(label) }))}</b></div>${chartBox("dvA")}`
        + `<div class="dsec"><b>${e(T("Tỷ lệ Long/Short & taker"))}</b></div>${chartBox("dvB")}`
        + `<p class="sc-note">${e(T("Long/Short tài khoản: số tài khoản Long ÷ Short. Top trader: theo vị thế của 20% tài khoản lớn nhất. Taker mua/bán > 1: lệnh thị trường mua nhiều hơn bán. Nguồn: Binance Futures."))}</p>`;
      draw(oi, fr, ls, top, tk);
    } catch (err) {
      if (my !== seq) return;
      console.warn("DerivView.open - load futures data fail", s, err.message);
      el.innerHTML = `<div class="errbox">${e(T("Không tải được dữ liệu phái sinh từ Binance."))} <button data-dp="${period}">${e(T("Thử lại"))}</button></div>`;
    }
  }

  function close() { seq++; charts.forEach(c => c.destroy()); charts = []; }

  function wire() {
    if (wired) return; wired = true;
    $("dDeriv").addEventListener("click", ev => { const b = ev.target.closest("button[data-dp]"); if (b && ["1h", "4h", "1d"].includes(b.dataset.dp)) { period = b.dataset.dp; Prefs.set("deriv.period", period); open(sym); } });
  }

  return { open: s => { wire(); open(s); }, close };
})();
// "Hồ sơ" tab: CoinGecko profile — categories (sector), genesis date, consensus / hashing, block time, chains & contracts, official links, description.
const ProfileView = (() => {
  let seq = 0;

      .map(([l, u]) => link(l, u)).filter(Boolean).join(" · ");

      + (links ? `<tr><th>${e(T("Liên kết"))}</th><td>${links}</td></tr>` : "")

      + `<p class="src muted pad">${e(T("Nguồn: CoinGecko. Kiểm tra kỹ địa chỉ hợp đồng trước khi giao dịch — token giả thường trùng tên."))}</p>`;

// Detail pane tabs: Tổng quan · Kỹ thuật · Khuyến nghị · Sổ lệnh · Phái sinh · Hồ sơ. Only the open tab loads / streams; switching coin reloads it.
const DetailTabs = (() => {
  const TABS = [["overview", "Tổng quan"], ["chart", "Kỹ thuật"], ["advice", "Khuyến nghị"], ["book", "Sổ lệnh"], ["deriv", "Phái sinh"], ["profile", "Hồ sơ"]];
  const IDS = new Set(TABS.map(t => t[0]));
  let cur = IDS.has(Prefs.get("dtab")) ? Prefs.get("dtab") : "overview", sym = "";

  function buttons() { $("dTabs").innerHTML = TABS.map(([id, label]) => `<button data-dt="${id}"${id === cur ? ' class="on"' : ""}>${Dom.esc(T(label))}</button>`).join(""); }

  function activate() {
    CoinChart.show(cur === "chart", sym);
    if (cur === "chart") OutlookView.open(sym); else OutlookView.close();
    if (cur === "advice") AdviceView.open(sym); else AdviceView.close();
    if (cur === "book") BookView.open(sym); else BookView.close();
    if (cur === "deriv") DerivView.open(sym); else DerivView.close();
    if (cur === "profile") ProfileView.open(sym);
  }

  function show(id) {
    if (!IDS.has(id)) return;
    cur = id; Prefs.set("dtab", id);
    document.querySelectorAll("#detail .dpanel").forEach(p => { p.hidden = p.dataset.tab !== id; });
    $("dTabs").querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.dt === id));
    if (sym) activate();
  }

  function setSymbol(s) { if (s === sym) return; sym = s; activate(); }

  function init() {
    buttons();
    $("dTabs").addEventListener("click", e => { const b = e.target.closest("button[data-dt]"); if (b) show(b.dataset.dt); });
    show(cur);
  }

  // Language switch: tab labels + re-render the open tab from cache.
  function relabel() { buttons(); DetailView.render(DetailView.current()); if (sym) { const s = sym; sym = ""; setSymbol(s); } CoinChart.relabel(); }

  return { IDS, init, show, setSymbol, relabel, get: () => cur };
})();
// 🔔 price alerts dialog (add / re-arm / delete, browser notifications) + in-page toasts when an alert fires.

const WatchIO = (() => {
  const say = (m, cls) => Controls.say(cls === "muted" ? "muted" : cls || "good", m);

  function exportFile() {
    const watch = Watch.all();
    if (!watch.length) { Controls.say("warn", "Danh mục trống."); return; }

  }

  // Imported holdings / alerts are untrusted: Holdings.merge and Alerts.merge re-validate every field.
  function importText(name, text) {
    if (text == null) { Controls.say("bad", "Không đọc được file."); return; }
    let r;
    try { r = WatchFile.parse(text); } catch { Controls.say("bad", "File không có mã coin nào."); return; }
    if (!r.symbols.length) { Controls.say("bad", "File không có mã coin nào."); return; }
    const hold = Object.fromEntries(Object.entries(r.holdings).filter(([s]) => r.symbols.includes(s)));
    Holdings.merge(hold);
    const before = Alerts.all().length;
    Alerts.merge(r.alerts.filter(a => r.symbols.includes(a.sym)));
    Watch.replace(r.symbols);
    Board.setBad(r.bad);
    Board.setTab("watch");
    Controls.say("good", "✔ Đã nhập {n} coin từ {f} ({x} vị thế, {a} cảnh báo).", { n: r.symbols.length, f: name, x: Object.keys(hold).length, a: Alerts.all().length - before });
  }

  function init() {
    const saved = SavedSessions({ select: $("savedLists"), saveBtn: $("saveList"), delBtn: $("delList"), store: Prefs, key: "lists",
      snapshot: () => ({ watch: Watch.all() }), isEmpty: p => !p.watch.length, note: say,
      suggestName: () => T("Danh mục {d}", { d: new Date().toLocaleDateString(I18n.lang) }),
      open: p => { Watch.replace(CoinParse.clean(p.watch)); Board.setTab("watch"); } });
    I18n.onChange(() => saved.fill());
    $("exportList").onclick = exportFile;
    $("importList").onchange = e => { const f = e.target.files[0]; e.target.value = ""; if (f) Dom.readFile(f, importText); };

})();
// 🔗 share link (#pako: payload = tab + watchlist + options + sort + coin + detail tab + chart; never holdings), ?data= / ?demo= / ?tab= intake, demo picker.
const ShareDemo = (() => {
  const SORT_KEYS = new Set(Object.keys(BoardCols.C));

  async function copyLink(payload, say) {
    let url;
    try { url = location.href.split(/[?#]/)[0] + "#" + await ShareCodec.encode(payload); }
    catch { say("bad", "Trình duyệt không hỗ trợ nén link (cần Chrome/Edge/Firefox/Safari mới)."); return; }
    const ok = await Dom.copy(url);
    if (!ok) { prompt(T("Chép link này:"), url); return; }
    say("good", location.protocol === "file:" ? "✔ Đã chép link ({n} ký tự) — mở bằng file:// nên link chỉ dùng được trên máy này." : "✔ Đã chép link ({n} ký tự).", { n: Fmt.en(url.length) });
  }

  // Untrusted payload → only known fields with the right types (opts / chart are re-validated by their owners).
  function sanitize(p) {
    if (!p || typeof p !== "object" || Array.isArray(p)) return null;
    const out = {};
    if (typeof p.tab === "string" && Board.TAB_IDS.has(p.tab)) out.tab = p.tab;
    if (Array.isArray(p.watch)) out.watch = CoinParse.clean(p.watch);
    if (p.opts && typeof p.opts === "object") out.opts = p.opts;
    if (p.sort && SORT_KEYS.has(p.sort.key) && (p.sort.dir === 1 || p.sort.dir === -1)) out.sort = { key: p.sort.key, dir: p.sort.dir };
    if (CoinParse.isSymbol(p.sym)) out.sym = p.sym;
    if (typeof p.dtab === "string" && DetailTabs.IDS.has(p.dtab)) out.dtab = p.dtab;
    if (p.chart && typeof p.chart === "object") out.chart = p.chart;
    return out;
  }

  const fromText = text => { const r = CoinParse.parse(text); return { tab: "watch", watch: r.symbols, bad: r.bad }; };
  function demo(key) {
    if (!Object.hasOwn(DEMOS, key)) return { error: true };
    const d = DEMOS[key], r = fromText(d.text);
    return { ...r, tab: d.tab, sym: d.sym || r.watch[0], dtab: d.dtab };
  }

  // Reads hash / query once, then strips them so F5 does not re-apply.
  async function readIncoming() {
    const q = new URLSearchParams(location.search), hash = location.hash.slice(1);
    let res = null;
    try {
      if (hash) res = sanitize(await ShareCodec.decode(decodeURIComponent(hash))) || { error: true };
      else if (q.has("data")) { const d = q.get("data"); res = sanitize(await ShareCodec.decode(d)) || fromText(d); }
      else if (q.has("demo")) res = demo(q.get("demo"));
      if (q.has("tab") && Board.TAB_IDS.has(q.get("tab")) && !(res && res.error)) (res ||= {}).tab = q.get("tab");
    } catch { res = { error: true }; }
    if (hash || q.has("data") || q.has("demo") || q.has("tab")) history.replaceState(null, "", location.pathname);
    return res;
  }

  return { copyLink, readIncoming, demo, fromText };
})();
// App state: tabs (price tables + analytic views), data loading / refresh cadence, realtime wiring, selection, share payload.
// Analytic view contract: { id, label, wide, mount(el), unmount(), relabel() }; elements with data-coin="SYM" inside open that coin.
const Board = (() => {
  const tab = (id, label, v = null) => ({ id, label: v ? v.label : label, view: v });
  const TABS = [tab("watch", "★ Danh mục"), tab("market", "", MarketView), tab("top100", "Top 100"), tab("top", "Top 250"), tab("trending", "Trending"), tab("exchanges", "", ExchangesView),
    tab("network", "Mạng lưới"), tab("spot", "Spot Binance"), tab("futures", "Phái sinh"), tab("defi", "", DefiView), tab("onchain", "", OnchainView), tab("wallet", "", WalletView)];
  const TAB_IDS = new Set(TABS.map(t => t.id));
  const S = { tab: "watch", sel: "BTC", fut: [], futAt: 0, futErr: null, view: null, missing: [], bad: [], geckoErr: null, loading: true };
  let opts = {}, filterText = "", futTimer = 0;
  const view = id => (TABS.find(t => t.id === id) || {}).view || null;

  // Tickers the socket must follow: current table + strip coins + selected coin + armed alerts.
  function syncLive() {
    const base = [...Strip.COINS, S.sel, ...Alerts.symbols()];
    const list = S.tab === "watch" ? [...Watch.all(), ...base] : S.tab === "top" ? [...Coins.list().map(g => g.sym), ...base] : TabSources.has(S.tab) ? [...TabSources.syms(S.tab), ...base] : base;
    Live.want(S.tab === "spot", [...new Set(list.map(Coins.pair).filter(Boolean))]);
  }

  function rows() {
    if (S.tab === "futures") return S.fut.map(f => ({ ...f, name: Coins.name(f.sym) })).sort((a, b) => b.qvol - a.qvol);
    const syms = S.tab === "watch" ? Watch.all() : S.tab === "top" ? [...new Set(Coins.list().map(g => g.sym))] : TabSources.has(S.tab) ? TabSources.syms(S.tab) : Coins.spotBases();
    const out = [];
    for (const sym of syms) {
      const r = Coins.row(sym);
      if (S.tab === "spot" && !r.last) continue;
      if (S.tab === "watch") { r.hold = Holdings.get(sym); r.pos = Pnl.position(r.hold, r.last); }
      out.push(r);
    }
    return S.tab === "spot" ? out.sort((a, b) => (b.spotQvol || 0) - (a.spotQvol || 0)) : out;
  }
  function filtered(list) {
    const toks = filterText.toUpperCase().split(/[\s,;|]+/).filter(Boolean);
    return toks.length ? list.filter(r => toks.some(t => r.sym.startsWith(t) || (t.length > 2 && (r.name || "").toUpperCase().includes(t)))) : list;
  }

  function draw(force = false) {
    if (S.view) { Controls.count(); return; }
    const all = rows(), list = filtered(all), cols = BoardCols.visible(S.tab, { ...opts, pos: opts.pos && Holdings.any() });
    S.missing = S.tab === "watch" && Coins.ready() && !S.loading ? Watch.all().filter(s => !Coins.known(s)) : [];
    PortfolioBar.render(S.tab === "watch" && opts.pos ? all : null);
    if (list.length) BoardView.render(list, cols, force);
    else if (S.tab === "watch" && !Watch.all().length) BoardView.message(T("Danh mục trống — gõ mã coin vào ô “Lọc / thêm coin” rồi bấm ★ Thêm."));
    else if (S.loading) BoardView.message(T("Đang tải dữ liệu…"));
    else if (all.length) BoardView.message(T("Không có coin khớp bộ lọc “{q}”.", { q: filterText }));
    else BoardView.message(S.tab === "futures" && S.futErr ? T("Không tải được dữ liệu phái sinh Binance — đang thử lại.") : T("Không có dữ liệu."));
    Controls.count(list.length, all.length);
  }

  function onTicks() {
    if (!S.view) draw(); else if (S.view.onTicks) S.view.onTicks();
    Strip.render();
    DetailView.live(Coins.row(S.sel));
    const al = Alerts.symbols();
    if (al.length) { const hits = Alerts.check(new Map(al.map(s => [s, Coins.row(s)]))); if (hits.length) PersonalUI.onHits(hits); }
    Controls.status();
  }

  async function loadFutures() {
    clearTimeout(futTimer);
    if (S.tab !== "futures") return;
    try { S.fut = await Futures.board(Coins.hasSpot); S.futAt = Date.now(); S.futErr = null; }
    catch (e) { console.warn("loadFutures - get futures board fail", e.message); S.futErr = e; }
    S.loading = false;
    if (S.tab === "futures") { draw(); futTimer = setTimeout(loadFutures, opts.rate === "off" ? 600e3 : 15000); }
  }

  function setTab(tab) {
    S.tab = TAB_IDS.has(tab) ? tab : "watch";
    Prefs.set("tab", S.tab);
    if (S.view) { S.view.unmount(); S.view = null; }
    const v = view(S.tab);
    $("boardBox").hidden = !!v; $("marketView").hidden = !v;
    $("work").classList.toggle("wide", !!(v && v.wide));
    Controls.tabChanged(S.tab);
    if (v) { $("marketView").innerHTML = ""; S.view = v; v.mount($("marketView")); Controls.count(); }
    else { BoardView.message(T("Đang tải dữ liệu…")); draw(true); }
    if (S.tab === "futures") { S.loading = !S.fut.length; loadFutures(); }
    subBar();
    if (TabSources.has(S.tab)) TabSources.load(S.tab, () => { subBar(); syncLive(); draw(); });
    syncLive();
    Controls.status();
  }

  function subBar() { const html = TabSources.bar(S.tab); $("subBar").innerHTML = html; $("subBar").hidden = !html; }
  function onSubBar(e) { if ((e.type === "change") === (e.target.tagName === "SELECT") && TabSources.act(e.target)) setTab(S.tab); }

  function select(sym, fromUser) {
    if (!CoinParse.isSymbol(sym)) return;
    const changed = sym !== S.sel;
    S.sel = sym;
    Prefs.set("sel", sym);
    BoardView.select(sym);
    if (changed) syncLive();
    DetailView.render(Coins.row(sym));
    DetailTabs.setSymbol(sym);
    if (fromUser) PhoneLayout.show(1);
  }

  // Slow sources: CoinGecko top 250 (2 min), global stats + Fear & Greed (5 min), VND rate (10 min).
  async function refreshGecko() {
    try { await Coins.loadGecko(); S.geckoErr = null; }
    catch (e) { console.warn("refreshGecko - get coingecko markets fail", e.message); S.geckoErr = e; }
    S.loading = false;
    if (S.tab === "top") syncLive();
    draw(); Strip.render(); DetailView.live(Coins.row(S.sel)); Controls.status();
  }
  async function refreshRate() {
    try { Currency.setRate(await Gecko.vndRate()); } catch (e) { console.warn("refreshRate - get USDT/VND fail", e.message); }
    Strip.render(); if (Currency.code === "VND") draw(true);
  }

  async function boot() {
    setInterval(() => { if (!document.hidden && opts.rate !== "off") refreshGecko(); }, 120e3);
    setInterval(() => { if (!document.hidden) Strip.loadSlow(); }, 300e3);
    setInterval(refreshRate, 600e3);
    Strip.loadSlow(); refreshRate();
    try { await Coins.loadPairs(); } catch (e) { console.warn("boot - load binance pairs fail", e.message); }
    syncLive(); draw();
    select(S.sel, false);
    await refreshGecko();
  }

  function onWatchChange() {
    BoardView.refreshStars();
    DetailView.render(Coins.row(S.sel));
    if (S.tab === "watch") { syncLive(); draw(); }
    Controls.status();
  }

  // Sample / share link / ?data=: { tab?, watch?, opts?, sort?, sym?, dtab?, chart?, bad?, error? }
  function applyIncoming(res) {
    if (!res) return false;
    if (res.error) { Controls.say("bad", "Link chia sẻ hoặc mẫu không hợp lệ — giữ nguyên danh mục hiện tại."); return false; }
    if (res.opts) setOpts(Controls.writeOpts(res.opts), false);
    if (res.sort) BoardView.setSort(res.sort);
    if (res.chart) CoinChart.set(res.chart);
    if (res.dtab) DetailTabs.show(res.dtab);
    if (res.watch) Watch.replace(res.watch);
    S.bad = res.bad || [];
    if (res.sym) select(res.sym, false);
    setTab(res.tab || (res.watch ? "watch" : S.tab));
    if (res.sym) PhoneLayout.show(1);
    return true;
  }

  function setOpts(o, redraw = true) {
    opts = o; Prefs.set("opts", o);
    Currency.set(o.cur); Live.setRate(o.rate);
    if (redraw) { draw(true); Strip.render(); DetailView.render(Coins.row(S.sel)); if (S.view) S.view.relabel(); }
  }

  const setFilter = Dom.debounce(v => { filterText = v; draw(); }, 150);
  const payload = () => ({ tab: S.tab, watch: Watch.all(), opts, sort: BoardView.getSort(), sym: S.sel, dtab: DetailTabs.get(), chart: CoinChart.get() });

  $("subBar").addEventListener("click", onSubBar); $("subBar").addEventListener("change", onSubBar);
  Watch.onChange(onWatchChange);
  Holdings.onChange(() => { if (S.tab === "watch") draw(); });
  Alerts.onChange(syncLive);
  Live.onTicks(onTicks);
  Live.onStatus(() => Controls.status());

  return { TABS, TAB_IDS, state: () => S, getOpts: () => opts, setTab, select, draw, boot, applyIncoming, setOpts, setFilter, payload, rows, setBad: b => { S.bad = b; }, relabelView: () => { if (S.view) S.view.relabel(); subBar(); } };
})();
// DOM wiring: tabs, toolbar options, add / filter box, share / undo, CSV, keyboard, status footer, language switch, start-up.
const Controls = (() => {
  let msg = null, msgTimer = 0;
  const MODE = { ws: "● Realtime", connecting: "Đang kết nối…", poll: "Lấy định kỳ", off: "Tạm dừng" };
  const tabLabel = id => { const t = Board.TABS.find(x => x.id === id); return t ? T(t.label) : id; };

  function say(cls, key, params) {
    msg = { cls, key, params };
    clearTimeout(msgTimer);
    msgTimer = setTimeout(() => { msg = null; status(); }, 8000);
    status();
  }

  function status() {
    const S = Board.state(), st = Live.status(), out = [];
    $("liveBadge").textContent = T(MODE[st.mode] || st.mode);
    $("liveBadge").className = "badge " + (st.mode === "ws" ? "live" : st.mode === "poll" ? "poll" : "");
    if (st.at) out.push(`<span>${Dom.esc(T("Giá Binance lúc {t}", { t: new Date(st.at).toLocaleTimeString(I18n.lang, { hour12: false }) }))}</span>`);
    if (st.mode === "poll" && Board.getOpts().rate === "live") out.push(`<span class="warn">${Dom.esc(T("WebSocket Binance không kết nối được — đang lấy giá định kỳ 5s."))}</span>`);
    if (S.geckoErr) out.push(`<span class="warn">${Dom.esc(S.geckoErr.rateLimited ? T("CoinGecko giới hạn tần suất — vốn hoá / % 7 ngày sẽ cập nhật lại sau ~{n}s.", { n: S.geckoErr.retryIn || 60 }) : T("Không tải được dữ liệu CoinGecko — đang thử lại."))}</span>`);
    else if (Coins.geckoAt()) out.push(`<span class="muted">${Dom.esc(T("Vốn hoá CoinGecko lúc {t}", { t: new Date(Coins.geckoAt()).toLocaleTimeString(I18n.lang, { hour12: false }) }))}</span>`);
    if (S.bad.length) out.push(`<span class="warn">${Dom.esc(T("Bỏ qua (không phải mã coin): {list}", { list: S.bad.join(", ") }))}</span>`);
    if (S.missing.length) out.push(`<span class="warn">${Dom.esc(T("Không tìm thấy {n} mã: {list}", { n: S.missing.length, list: S.missing.join(", ") }))}</span> <button id="dropMissing">${Dom.esc(T("Bỏ các mã này khỏi danh mục"))}</button>`);
    if (msg) out.push(`<span class="${msg.cls}">${Dom.esc(T(msg.key, msg.params))}</span>`);
    $("status").innerHTML = out.join(" · ");
    $("undo").hidden = !Watch.hasBackup();
  }

  function buildTabs() {
    $("tabs").innerHTML = Board.TABS.map(t => `<button data-tab="${t.id}">${Dom.esc(T(t.label))}</button>`).join("");
    tabChanged(Board.state().tab);
  }
  function tabChanged(tab) {
    $("tabs").querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
    $("boardTitle").textContent = tabLabel(tab);
  }
  const count = (n, total) => { $("count").textContent = n == null ? "" : n === total ? T("{n} coin", { n }) : T("{n} / {total} coin", { n, total }); };

  const optEls = () => [...document.querySelectorAll("[data-opt]")];
  const readOpts = () => Object.fromEntries(optEls().map(el => [el.id, el.type === "checkbox" ? el.checked : el.value]));
  // Values from share links / storage are untrusted: known controls only, booleans for checkboxes, existing <option>s.
  function writeOpts(o = {}) {
    for (const el of optEls()) {
      if (!o || !Object.hasOwn(o, el.id)) continue;
      const v = o[el.id];
      if (el.type === "checkbox") el.checked = v === true;
      else if (typeof v === "string" && [...el.options].some(x => x.value === v)) el.value = v;
    }
    return readOpts();
  }

  function addFromBox() {
    const r = CoinParse.parse($("q").value);
    Board.setBad(r.bad);
    if (!r.symbols.length) { say(r.bad.length ? "warn" : "muted", "Gõ mã coin, cách nhau bằng dấu phẩy hoặc khoảng trắng (vd: BTC, ETH)."); return; }
    const fresh = Watch.add(r.symbols);
    $("q").value = ""; Board.setFilter("");
    r.symbols.filter(s => !Coins.known(s)).forEach(s => Coins.resolve(s).then(() => Board.draw()));
    say(fresh.length ? "good" : "muted", fresh.length ? "✔ Đã thêm {n} coin vào danh mục." : "Các coin này đã có trong danh mục.", { n: fresh.length });
  }

  function exportCsv() {
    const S = Board.state(), cols = BoardView.cols().filter(c => c.k !== "spark");
    const cell = v => /[",\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v;
    const byS = new Map(Board.rows().map(r => [r.sym, r]));
    const lines = BoardView.order().map(s => byS.get(s)).filter(Boolean).map(r => BoardCols.rowCells(r, cols).map(c => cell(c.t)).join(","));
    if (S.view || !lines.length) { say("warn", "Bảng đang trống."); return; }
    Dom.download(String.fromCharCode(0xfeff) + [cols.map(c => cell(T(c.h))).join(","), ...lines].join("\r\n"), `${T("bang-gia-crypto")}-${S.tab}-${new Date().toISOString().slice(0, 10)}.csv`, "text/csv;charset=utf-8");
  }

  function moveSelection(step) {
    const order = BoardView.order(), i = order.indexOf(Board.state().sel), next = order[Math.max(0, Math.min(order.length - 1, i + step))];
    if (next && !Board.state().view) Board.select(next, false);
  }

  function wire() {
    $("tabs").addEventListener("click", e => { const b = e.target.closest("button[data-tab]"); if (b) { Board.setBad([]); Board.setTab(b.dataset.tab); } });
    $("q").oninput = e => Board.setFilter(e.target.value);
    $("q").onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); addFromBox(); } };
    $("add").onclick = addFromBox;
    $("share").onclick = () => ShareDemo.copyLink(Board.payload(), say);
    $("undo").onclick = () => { Watch.undo(); Board.setBad([]); Board.setTab("watch"); };
    $("csv").onclick = exportCsv;
    document.addEventListener("change", e => { if (e.target.matches("[data-opt]")) Board.setOpts(readOpts()); });
    document.addEventListener("click", e => {
      const c = e.target.closest("[data-coin]");
      if (c && !e.target.closest("a, input, select") && CoinParse.isSymbol(c.dataset.coin)) Board.select(c.dataset.coin, true);
    });
    $("status").addEventListener("click", e => { if (e.target.id === "dropMissing") Watch.remove(Board.state().missing); });
    $("board").addEventListener("dblclick", e => { const tr = e.target.closest("tr[data-sym]"); if (tr && !e.target.closest("button")) { Board.select(tr.dataset.sym, false); CoinChart.openDialog(); } });
    document.addEventListener("keydown", e => {
      if (e.target.closest("input, select, textarea, dialog") || e.ctrlKey || e.metaKey || e.altKey) return;
      if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); moveSelection(e.key === "ArrowDown" ? 1 : -1); }
    });
    addEventListener("hashchange", async () => { if (location.hash) Board.applyIncoming(await ShareDemo.readIncoming()); });
    I18n.onChange(() => { buildTabs(); Strip.render(); Board.draw(true); Board.relabelView(); DetailTabs.relabel(); status(); });
  }

  async function start() {
    I18n.init();
    ThemePicker.bind($("theme"), { get: (k, d) => Prefs.get(k, k === "theme" ? "dark" : d), set: Prefs.set });
    TechChart.setPriceFormat(Fmt.price);
    BoardView.init($("board"), { onSelect: Board.select, onStar: s => Watch.toggle(s), onSort: () => Board.draw(true) });
    Strip.init($("strip"));
    DetailView.init();
    CoinChart.init();
    IndGuide.init();
    DetailTabs.init();
    PersonalUI.init();
    CalcUI.init();
    WatchIO.init();
    Board.setOpts(writeOpts(Prefs.get("opts", {})), false);
    const tab = Prefs.get("tab", "watch"), sel = Prefs.get("sel", "BTC");
    Board.state().tab = Board.TAB_IDS.has(tab) ? tab : "watch";
    if (CoinParse.isSymbol(sel)) Board.state().sel = sel;
    buildTabs();
    wire();
    const incoming = await ShareDemo.readIncoming();
    if (!Board.applyIncoming(incoming)) Board.setTab(Board.state().tab);
    Board.boot();
  }

  return { start, say, status, tabChanged, count, writeOpts };
})();
Controls.start();
</script>
</body>
</html>
