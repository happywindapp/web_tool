<!-- GoatCounter: chỉ gửi path (không query/hash); chạy local đếm thành /local/<tên file> để không lộ thư mục máy -->
<script>
{ const local = !location.protocol.startsWith("http") || ["localhost", "127.0.0.1"].includes(location.hostname);
  const p = local ? "/local/" + location.pathname.split("/").pop() : location.pathname.replace(/index[.]html$/, "");
  const gc = "https://quan111.goatcounter.com/count";
  navigator.sendBeacon?.(gc + "?" + new URLSearchParams({ p, r: document.referrer.split("?")[0], t: document.title, s: screen.width }));
  addEventListener("DOMContentLoaded", () => {
    const el = document.querySelector(".gc-views");
    // GoatCounter cache mỗi URL (kể cả 404) tới 4 giờ ⇒ đổi start mỗi 10 phút; mọi ngày trước khi ra mắt cho cùng tổng
    const start = "2026-10-" + String(Math.floor(Date.now() / 6e5) % 28 + 1).padStart(2, "0");
    if (el) fetch(gc + "er/" + encodeURIComponent(p) + ".json?start=" + start).then(r => r.status === 404 ? { count: "0" } : r.json())
      .then(j => { el.textContent = "👁 " + j.count; el.hidden = false; }).catch(() => {});
  }); }
</script>

  "Nến: thân xanh = đóng cửa cao hơn mở cửa, đỏ = thấp hơn; râu là giá cao / thấp nhất trong phiên. Cột dưới cùng là khối lượng.": "Candles: green body = close above open, red = below; wicks are the session high / low. Bottom bars are volume.",
  "Đường trung bình đơn giản: giá trên đường là xu hướng tăng, dưới là giảm; đường dốc lên / xuống cho biết hướng, thường đóng vai hỗ trợ / kháng cự.": "Simple moving average: price above it = uptrend, below = downtrend; its slope shows direction and it often acts as support / resistance.",
  "Đường trung bình hàm mũ: như SMA nhưng phản ứng nhanh hơn với giá gần đây.": "Exponential moving average: like an SMA but reacts faster to recent prices.",
  "Đường trung bình có trọng số: giá càng gần càng nặng ký, phản ứng nhanh hơn SMA.": "Weighted moving average: recent prices weigh more, so it reacts faster than an SMA.",
  "Dải Bollinger: SMA ± 2 độ lệch chuẩn. Giá chạm dải trên là căng, dải dưới là quá bán; dải co hẹp báo sắp có biến động mạnh.": "Bollinger Bands: SMA ± 2 standard deviations. Touching the upper band = stretched, lower band = oversold; a squeeze warns of a big move.",

  "SMA + RSI: chỉ mua khi giá trên SMA200 và RSI hồi lên từ vùng 40–50, tránh bắt dao rơi.": "SMA + RSI: buy only above the SMA200 when RSI turns up from 40–50 — avoid catching falling knives.",
  "SMA + Khối lượng: giá vượt SMA kèm khối lượng > 1,5 lần trung bình mới đáng tin.": "SMA + Volume: a break above the SMA counts only with volume > 1.5× average.",
  "SMA + ADX: ADX > 25 thì giao cắt MA đáng tin hơn; ADX < 20 (đi ngang) dễ cắt giả.": "SMA + ADX: MA crosses are more reliable with ADX > 25; with ADX < 20 (ranging) they often fail.",
  "Crypto giao dịch 24/7 nên SMA200 khung ngày ≈ 200 ngày lịch. SMA phản ứng chậm — thị trường đi ngang sẽ cho nhiều tín hiệu sai.": "Crypto trades 24/7, so the daily SMA200 ≈ 200 calendar days. The SMA reacts slowly — sideways markets give many false signals.",
  "Trung bình động hàm mũ: nến càng gần càng có trọng số lớn, nên bám giá nhanh hơn SMA.": "Exponential moving average: recent candles weigh more, so it follows price faster than the SMA.",
  "EMA hôm nay = Giá × k + EMA hôm qua × (1 − k), với k = 2 / (N + 1). Hay dùng: EMA 9, 21, 50, 200.": "EMA today = Price × k + EMA yesterday × (1 − k), with k = 2 / (N + 1). Common: EMA 9, 21, 50, 200.",
  "Giá trên EMA dốc lên → xu hướng tăng; EMA 9 / 21 hay dùng cho giao dịch ngắn.": "Price above a rising EMA → uptrend; EMA 9 / 21 are popular for short-term trading.",
  "EMA ngắn cắt lên EMA dài → tín hiệu tăng đến sớm hơn so với SMA.": "A short EMA crossing above a long EMA → bullish signal that arrives earlier than with SMAs.",
  "Giá cách EMA quá xa → đang căng, dễ hồi về EMA.": "Price far from the EMA → stretched, likely to revert towards it.",
  "Ví dụ: ETH khung 4 giờ, EMA21 cắt lên EMA50 tại 1.800$ sau một nhịp giảm; các nến sau giữ được trên EMA21 → xác nhận đảo chiều ngắn hạn.": "Example: ETH 4h, EMA21 crosses above EMA50 at $1,800 after a pullback; the next candles hold above EMA21 → short-term reversal confirmed.",
  "EMA + MACD: MACD chính là hiệu của 2 EMA — dùng MACD để đo sức mạnh của giao cắt.": "EMA + MACD: MACD is the gap between two EMAs — use it to gauge how strong the cross is.",
  "EMA21 + Bollinger: giá nằm giữa EMA21 và dải trên = xu hướng tăng khoẻ.": "EMA21 + Bollinger: price riding between EMA21 and the upper band = healthy uptrend.",
  "EMA + ATR: đặt dừng lỗ dưới EMA21 khoảng 1–1,5 × ATR.": "EMA + ATR: place the stop about 1–1.5 × ATR below EMA21.",
  "Nhanh hơn nên cũng nhiễu hơn SMA; với altcoin biến động mạnh nên xem khung 4h / 1D thay vì 5m.": "Faster means noisier than the SMA; for volatile altcoins use 4h / 1D instead of 5m.",
  "Trung bình có trọng số tuyến tính: nến mới nhất nặng N, nến cũ nhất nặng 1.": "Linearly weighted average: the newest candle weighs N, the oldest 1.",
  "WMA = (N·Cₙ + (N−1)·Cₙ₋₁ + … + 1·C₁) / (N(N+1)/2).": "WMA = (N·Cₙ + (N−1)·Cₙ₋₁ + … + 1·C₁) / (N(N+1)/2).",
  "Đọc như SMA / EMA: giá trên WMA dốc lên là xu hướng tăng.": "Read it like an SMA / EMA: price above a rising WMA is an uptrend.", "Phản ứng nhanh hơn SMA, gần giống EMA.": "Reacts faster than the SMA, similar to the EMA.",
  "Hay dùng làm đường tín hiệu ngắn (WMA 10–20).": "Often used as a short signal line (WMA 10–20).",
  "Ví dụ: SOL nến ngày đóng cửa dưới WMA20 lần đầu sau 3 tuần tăng → cảnh báo nhịp tăng đang yếu đi.": "Example: SOL's first daily close below WMA20 after a 3-week rally → warning that the advance is weakening.",
  "WMA ngắn + SMA dài (WMA20 với SMA50) để bắt giao cắt sớm.": "Short WMA + long SMA (WMA20 vs SMA50) to catch crosses early.", "WMA + RSI: WMA bị gãy kèm RSI dưới 50 = xác nhận suy yếu.": "WMA + RSI: a WMA break with RSI below 50 confirms weakness.",
  "Ít phổ biến hơn EMA và không có lợi thế rõ rệt — nên chọn một loại MA và dùng nhất quán.": "Less common than the EMA with no clear edge — pick one MA type and use it consistently.",
  "Dải Bollinger: SMA20 ở giữa và hai dải cách ±2 độ lệch chuẩn — đo mức biến động của giá.": "Bollinger Bands: SMA20 in the middle and bands ±2 standard deviations away — a measure of volatility.",
  "Giữa = SMA(20); Trên / Dưới = SMA(20) ± 2 × độ lệch chuẩn của 20 nến.": "Middle = SMA(20); Upper / Lower = SMA(20) ± 2 × the 20-candle standard deviation.",
  "Dải co hẹp (squeeze) → sắp có biến động mạnh; hướng phá vỡ cho biết chiều đi.": "Narrowing bands (squeeze) → a big move is coming; the breakout direction tells the way.",
  "Trong xu hướng tăng mạnh, giá có thể đi dọc dải trên — chưa phải tín hiệu bán.": "In a strong uptrend price can ride the upper band — that alone is not a sell signal.",
  "Khi đi ngang: chạm dải dưới hay hồi về đường giữa, chạm dải trên hay quay đầu.": "In a range: touches of the lower band tend to revert to the middle, touches of the upper band tend to turn back.",
  "Ví dụ: BTC đi ngang 64–66 nghìn $ làm dải co còn ~3% giá; nến ngày đóng cửa vượt dải trên ở 66.500$ với khối lượng gấp đôi → bứt phá, mục tiêu đầu tiên ≈ độ cao vùng tích luỹ (~2.000$).": "Example: BTC ranging $64–66k squeezes the bands to ~3% of price; a daily close above the upper band at $66,500 on double volume → breakout, first target ≈ the range height (~$2,000).",
  "BB + RSI: chạm dải dưới và RSI < 30 rồi quay lên = tín hiệu hồi mạnh hơn khi dùng riêng.": "BB + RSI: a lower-band touch with RSI < 30 that turns up is a stronger bounce signal than either alone.",
  "BB squeeze + Khối lượng / OBV: KL và OBV tăng trước khi phá vỡ gợi ý hướng dễ xảy ra.": "BB squeeze + Volume / OBV: rising volume and OBV before the break hint at the likely direction.",
  "BB + ADX: ADX thấp → giao dịch hồi về giữa dải; ADX > 25 → đi theo hướng phá vỡ.": "BB + ADX: low ADX → trade reversion to the middle; ADX > 25 → follow the breakout.",
  "Crypto hay có phá vỡ giả (quét thanh khoản rồi quay lại trong dải) — chờ nến đóng cửa, đừng vào lệnh giữa nến.": "Crypto often fakes breakouts (liquidity sweeps back inside the bands) — wait for the candle close, don't enter mid-candle.",
  "Kênh Donchian: giá cao nhất và thấp nhất của N nến — vẽ ranh giới vùng giá.": "Donchian Channel: highest high and lowest low of N candles — the boundaries of the price range.",
  "Trên = cao nhất N nến; Dưới = thấp nhất N nến; Giữa = (Trên + Dưới) / 2. Mặc định N = 20.": "Upper = highest of N candles; Lower = lowest of N; Middle = (Upper + Lower) / 2. Default N = 20.",
  "Giá đóng cửa vượt cạnh trên = bứt phá lên đỉnh mới N nến (kiểu hệ thống Turtle).": "A close above the upper edge = breakout to a new N-candle high (Turtle-style).",
  "Thủng cạnh dưới = phá vỡ hỗ trợ, nghiêng về xu hướng giảm.": "A break of the lower edge = support broken, leaning bearish.", "Kênh phẳng = đi ngang; kênh dốc = đang có xu hướng.": "Flat channel = range; sloping channel = trend.",
  "Ví dụ: LINK đóng cửa 20,5$ vượt đỉnh 20 ngày là 20$ → vào lệnh theo bứt phá, dừng lỗ dưới đường giữa kênh.": "Example: LINK closes at $20.5 above its 20-day high of $20 → enter the breakout, stop below the channel's middle line.",
  "Donchian + ATR: dừng lỗ = giá vào − 2 × ATR (cách của hệ thống Turtle).": "Donchian + ATR: stop = entry − 2 × ATR (the Turtle way).", "Donchian + ADX: chỉ theo bứt phá khi ADX đang tăng trên 20.": "Donchian + ADX: only take breakouts while ADX is rising above 20.",
  "Donchian + Khối lượng để lọc bứt phá giả.": "Donchian + Volume to filter fake breakouts.",
  "Hiệu quả khi thị trường có xu hướng mạnh (mùa tăng crypto), nhưng lỗ liên tục khi đi ngang — cần quản lý vốn chặt.": "Works in strong trends (crypto bull runs) but bleeds in ranges — strict money management needed.",
  "Mây Ichimoku: hệ thống 5 đường cho biết xu hướng, động lượng và hỗ trợ / kháng cự trong một khung.": "Ichimoku Cloud: a 5-line system showing trend, momentum and support / resistance at a glance.",
  "Tenkan = (cao + thấp 9 nến) / 2; Kijun = (cao + thấp 26 nến) / 2; Span A = (Tenkan + Kijun) / 2 đẩy tới 26 nến; Span B = (cao + thấp 52 nến) / 2 đẩy tới 26 nến; Chikou = giá đóng cửa lùi 26 nến.": "Tenkan = (9-candle high + low) / 2; Kijun = (26-candle high + low) / 2; Span A = (Tenkan + Kijun) / 2 shifted 26 ahead; Span B = (52-candle high + low) / 2 shifted 26 ahead; Chikou = close shifted 26 back.",
  "Giá trên mây = xu hướng tăng; dưới mây = giảm; trong mây = chưa rõ.": "Price above the cloud = uptrend; below = downtrend; inside = unclear.",
  "Tenkan cắt lên Kijun khi giá trên mây = tín hiệu mua mạnh; dưới mây = tín hiệu yếu.": "Tenkan crossing above Kijun above the cloud = strong buy signal; below the cloud = weak one.",
  "Mây dày = hỗ trợ / kháng cự mạnh; Span A trên Span B = mây thiên tăng.": "A thick cloud = strong support / resistance; Span A above Span B = bullish cloud.",
  "Ví dụ: BTC khung ngày vượt lên trên mây, Tenkan cắt lên Kijun và Chikou nằm trên giá của 26 ngày trước → đủ 3 điều kiện xác nhận xu hướng tăng.": "Example: daily BTC moves above the cloud, Tenkan crosses above Kijun and Chikou sits above the price of 26 days ago → all 3 conditions confirm an uptrend.",
  "Ichimoku + RSI để tránh mua khi đã quá mua.": "Ichimoku + RSI to avoid buying when already overbought.", "Ichimoku + Khối lượng khi giá thoát khỏi mây.": "Ichimoku + Volume when price exits the cloud.",
  "Một số trader crypto dùng tham số 20 / 60 / 120 vì thị trường mở cửa 24/7.": "Some crypto traders use 20 / 60 / 120 because the market never closes.",
  "Nhiều đường nên dễ rối; khung nhỏ dưới 1 giờ rất nhiễu — hợp với khung 4h / 1D.": "Many lines can clutter; below 1h it is very noisy — best on 4h / 1D.",
  "Parabolic SAR: chuỗi chấm bám theo giá, dùng làm điểm dừng lỗ di động và báo đảo chiều.": "Parabolic SAR: dots trailing the price, used as a trailing stop and a reversal signal.",
  "SAR mới = SAR cũ + AF × (EP − SAR cũ); EP = đỉnh / đáy cực trị của xu hướng; AF bắt đầu 0,02, tăng 0,02 mỗi khi có cực trị mới, tối đa 0,2.": "New SAR = old SAR + AF × (EP − old SAR); EP = the trend's extreme high / low; AF starts at 0.02, adds 0.02 at each new extreme, max 0.2.",
  "Chấm dưới giá = xu hướng tăng; chấm trên giá = xu hướng giảm.": "Dots below price = uptrend; above price = downtrend.", "Chấm đổi phía = tín hiệu đảo chiều.": "Dots switching sides = reversal signal.",
  "Vị trí chấm là mức dừng lỗ gợi ý, nâng dần theo giá.": "The dot is a suggested stop level, trailing the price.",
  "Ví dụ: DOGE đang tăng, chấm SAR ở 0,150$ dưới giá 0,165$ → đặt dừng lỗ 0,150$ và nâng theo chấm mỗi ngày cho tới khi chấm đổi phía.": "Example: DOGE rising with SAR at $0.150 under a $0.165 price → stop at $0.150, raised with the dots daily until they flip.",
  "SAR + ADX: chỉ theo tín hiệu SAR khi ADX > 25 (có xu hướng).": "SAR + ADX: follow SAR signals only when ADX > 25 (trending).", "SAR + EMA50: chỉ nhận tín hiệu mua khi giá trên EMA50.": "SAR + EMA50: take buy signals only above EMA50.",
  "Dùng SAR để thoát lệnh, chỉ báo khác để vào lệnh.": "Use SAR to exit and other indicators to enter.",
  "Đi ngang thì đảo chiều liên tục; nến crypto râu dài dễ chạm SAR rồi quay lại.": "In ranges it flips constantly; long crypto wicks easily tag the SAR and come back.",

  "Chỉ số sức mạnh tương đối (0–100): so sánh mức tăng và mức giảm trung bình gần đây để đo động lượng.": "Relative Strength Index (0–100): compares recent average gains and losses to measure momentum.",
  "RSI = 100 − 100 / (1 + RS), RS = trung bình tăng / trung bình giảm của 14 nến (làm mượt kiểu Wilder).": "RSI = 100 − 100 / (1 + RS), RS = average gain / average loss over 14 candles (Wilder smoothing).",
  "> 70 quá mua, < 30 quá bán; trong xu hướng tăng mạnh RSI hay dao động 40–80, xu hướng giảm 20–60.": "> 70 overbought, < 30 oversold; in strong uptrends RSI tends to swing 40–80, in downtrends 20–60.",
  "RSI vượt lên trên 50 = phe mua chiếm ưu thế; xuống dưới 50 = phe bán.": "RSI above 50 = buyers in control; below 50 = sellers.",

  "RSI + MA200: chỉ mua vùng quá bán khi giá còn trên MA200 (xu hướng lớn tăng).": "RSI + MA200: buy oversold only while price is above the MA200 (major uptrend).",
  "RSI + Bollinger: quá bán kèm chạm dải dưới tăng độ tin cậy.": "RSI + Bollinger: oversold together with a lower-band touch is more reliable.",

  "Hội tụ – phân kỳ trung bình động: chênh lệch giữa EMA nhanh và EMA chậm, đo động lượng của xu hướng.": "Moving Average Convergence Divergence: the gap between a fast and a slow EMA, measuring trend momentum.",

  "MACD cắt lên đường tín hiệu = động lượng chuyển tăng; cắt xuống = chuyển giảm.": "MACD crossing above its signal = momentum turning up; crossing below = turning down.",
  "MACD trên 0 = EMA12 trên EMA26 (xu hướng tăng).": "MACD above 0 = EMA12 above EMA26 (uptrend).",
  "Histogram thu hẹp = động lượng yếu dần; phân kỳ với giá báo đảo chiều sớm.": "A shrinking histogram = momentum fading; divergence with price warns early of a reversal.",
  "Ví dụ: BNB khung 4h, MACD cắt lên đường tín hiệu ngay dưới mức 0 sau nhịp điều chỉnh, histogram chuyển dương → tín hiệu mua, dừng lỗ dưới đáy gần nhất.": "Example: BNB 4h, MACD crosses above its signal just below 0 after a pullback and the histogram turns positive → buy signal, stop under the latest low.",
  "MACD + RSI: MACD cắt lên đúng lúc RSI vừa thoát vùng quá bán.": "MACD + RSI: MACD crosses up just as RSI leaves oversold.", "MACD + MA200: chỉ nhận tín hiệu cùng chiều xu hướng lớn.": "MACD + MA200: only take signals in the direction of the major trend.",

  "Là chỉ báo trễ — đi ngang sẽ cắt qua lại nhiều lần; giá trị MACD tính bằng đơn vị giá nên không so được giữa các coin.": "It lags — in ranges it crosses back and forth; MACD values are in price units, so they can't be compared across coins.",

  "Nhạy hơn RSI, hợp với thị trường đi ngang.": "More sensitive than RSI, suited to ranging markets.",

  "Chỉ số định hướng trung bình: đo độ MẠNH của xu hướng (không cho biết chiều); +DI / −DI cho biết chiều.": "Average Directional Index: measures trend STRENGTH (not direction); +DI / −DI give the direction.",

// Share-link payload codec, same format as mermaid.live: "pako:" + base64url(zlib(JSON)); also reads uncompressed "base64:".
const ShareCodec = (() => {
  const b64url = u8 => {
    let s = "";
    for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode(...u8.subarray(i, i + 0x8000));

// Named saves in localStorage (newest first, ≤ 30): 💾 asks a name and saves snapshot() · pick one in the <select> to reopen · 🗑 deletes the open one.
const SavedSessions = ({ select, saveBtn, delBtn, store, key = "saved", snapshot, open, suggestName = () => "", isEmpty = p => !String(p.text || "").trim(), note, keep = () => {} }) => {
  const MAX = 30;
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  let current = null;
  // Stored entries are only trusted after this shape check; the tool's open() still validates its own payload fields.
  const list = () => (store.get(key, []) || []).filter(a => a && typeof a.id === "string" && typeof a.name === "string" && a.payload && typeof a.payload === "object");

  function fill() {
    const items = list(), head = esc(T("📂 Đã lưu ({n})", { n: items.length }));
    select.innerHTML = `<option value="">${head}</option>` +
      items.map(a => `<option value="${esc(a.id)}">${esc(`${a.name} · ${new Date(a.t).toLocaleString(I18n.lang)}`)}</option>`).join("");
    delBtn.hidden = !current;
  }

  function save() {
    const p = snapshot();
    if (isEmpty(p)) return note(T("Chưa có dữ liệu để lưu."), "bad");
    const name = prompt(T("Tên bản lưu (lưu trong trình duyệt này):"), current ? current.name : suggestName());
    if (!name || !name.trim()) return;
    const id = current && current.name === name.trim() ? current.id : Date.now().toString(36);
    const entry = { id, name: name.trim().slice(0, 80), t: Date.now(), payload: p };
    if (!store.set(key, [entry, ...list().filter(a => a.id !== id)].slice(0, MAX))) return note(T("✖ Không lưu được — bộ nhớ trình duyệt đầy hoặc bị chặn."), "bad");
    current = entry;
    fill();
    note(T("✔ Đã lưu “{name}”.", { name: entry.name }), "good");
  }

  function openId(id) {
    const a = list().find(x => x.id === id);
    if (!a) return;
    keep();
    open(a.payload);
    current = a;
    fill();
    note(T("Đã mở “{name}”.", { name: a.name }), "muted");
  }

  function remove() {
    if (!current || !confirm(T("Xoá “{name}” khỏi trình duyệt?", { name: current.name }))) return;
    store.set(key, list().filter(a => a.id !== current.id));
    current = null;
    fill();
  }

};

const PhoneLayout = (() => {
  const switches = [...document.querySelectorAll(".pane-switch")];
  const visible = () => switches.find(sw => sw.offsetParent);

  function sync(sw) {
    const box = sw.nextElementSibling, i = box.clientWidth ? Math.round(box.scrollLeft / box.clientWidth) : 0;
    [...sw.children].forEach((b, k) => b.classList.toggle("on", k === i));
  }
  function go(sw, i) { const box = sw.nextElementSibling; box.scrollLeft = i * box.clientWidth; }
  const show = i => { const sw = visible(); if (sw) go(sw, i); };
  const showLast = () => { const sw = visible(); if (sw) go(sw, sw.children.length - 1); };

  for (const sw of switches) {
    const box = sw.nextElementSibling;
    box.addEventListener("scroll", () => sync(sw), { passive: true });
    new ResizeObserver(() => sync(sw)).observe(box);
    sw.addEventListener("click", e => { if (e.target !== sw) go(sw, [...sw.children].indexOf(e.target)); });
  }
  document.addEventListener("click", e => { const b = e.target.closest("button[data-pane-go]"); if (b) show(+b.dataset.paneGo); });
  document.addEventListener("change", e => { if (e.target.matches("select[data-pane-go], input[data-pane-go]")) show(+e.target.dataset.paneGo); });

})();

const Currency = (() => {

const Fmt = (() => {

    const a = Math.abs(p);
    if (a === 0) return "0";
    if (a >= 1000) return en(p, 2);
    if (a >= 1) return en(p, a >= 100 ? 2 : 4);
    const dec = Math.min(12, Math.max(4, 3 - Math.floor(Math.log10(a))));

const AlertRule = (() => {
  const TYPES = { above: "Giá ≥", below: "Giá ≤", pctUp: "24h tăng ≥ %", pctDown: "24h giảm ≥ %" };
  const valid = a => !!a && Object.hasOwn(TYPES, a.type) && Number.isFinite(+a.value) && +a.value > 0 && (a.type.startsWith("pct") ? +a.value <= 1000 : true);

      const f = { ...a, fired: now };
      hits.push({ ...f, price: rows.get(a.sym).last, pct: rows.get(a.sym).pct });

})();

  function position(h, price) {

  function summary(rows) {
    let value = 0, invested = 0, costed = 0;
    const alloc = [];
    for (const r of rows) {
      const p = position(r, r.price);
      if (!p) continue;
      value += p.value; alloc.push({ sym: r.sym, value: p.value });
      if (p.invested != null) { invested += p.invested; costed += p.value; }

const Calc = (() => {
  const DAY = 86400;
  const sameBucket = (a, b, every) => {
    const da = new Date(a * 1000), db = new Date(b * 1000);
    if (every === "month") return da.getUTCFullYear() === db.getUTCFullYear() && da.getUTCMonth() === db.getUTCMonth();
    if (every === "week") return Math.floor((a / DAY + 3) / 7) === Math.floor((b / DAY + 3) / 7);
    return Math.floor(a / DAY) === Math.floor(b / DAY);
  };

  // bars: daily { time (s), close } oldest first. Buys `amount` USD at the first close of each period from `from`; compares with one lump sum on day one.
  function dca(bars, { amount, every = "week", from = 0 }) {
    const list = bars.filter(b => b.time >= from && b.close > 0);
    if (!list.length || !(amount > 0)) return null;
    let qty = 0, invested = 0, buys = 0, prev = null;
    const curve = [];
    for (const b of list) {
      if (prev === null || !sameBucket(prev, b.time, every)) { qty += amount / b.close; invested += amount; buys++; prev = b.time; }
      curve.push({ time: b.time, invested, value: qty * b.close });
    }
    const last = list[list.length - 1].close, value = qty * last, lumpQty = invested / list[0].close;
    return { buys, invested, qty, value, avgCost: invested / qty, roi: (value / invested - 1) * 100, last,
      lumpValue: lumpQty * last, lumpRoi: (last / list[0].close - 1) * 100, start: list[0].time, curve };
  }

  // Isolated margin, linear USDT contract: liquidation when the loss eats margin minus maintenance (mmr % of notional).
  function futures({ side = "long", entry, lev, margin, exit, mmr = 0.5 }) {
    if (!(entry > 0) || !(lev >= 1) || !(margin > 0)) return null;
    const s = side === "short" ? -1 : 1, notional = margin * lev, qty = notional / entry, m = mmr / 100;
    const liq = s > 0 ? entry * (1 - 1 / lev + m) : entry * (1 + 1 / lev - m);
    const pnl = exit > 0 ? s * (exit - entry) * qty : null;
    return { notional, qty, liq: Math.max(0, liq), liqDist: (liq / entry - 1) * 100, pnl, roe: pnl == null ? null : pnl / margin * 100 };

  function size({ balance, riskPct, entry, stop }) {

  return { dca, futures, size, convert };
})();

const ChartRange = (() => {

  const RANGES = [

    { k: "6M", days: 183, label: "6 tháng" }, { k: "1Y", days: 366, label: "1 năm" }, { k: "3Y", days: 1096, label: "3 năm" },
    { k: "5Y", days: 1827, label: "5 năm" }, { k: "10Y", days: 3653, label: "10 năm" }, { k: "ALL", days: 9132, label: "Tất cả" },
  ];
  // max/min days keep bar counts sane (5m × 1 month ≈ 1k bars) and match how far back intraday data really goes.
  const INTERVALS = [
    { k: "5m", res: "5", max: 31 }, { k: "15m", res: "15", max: 92 }, { k: "30m", res: "30", max: 183 }, { k: "1h", res: "60", max: 366 },
    { k: "1D", res: "D", max: Infinity }, { k: "1W", res: "D", group: "week", min: 28 }, { k: "1M", res: "D", group: "month", min: 90 },
  ];
  const DEFAULT = { "1W": "15m", "1M": "1h", "3M": "1D", "6M": "1D", "1Y": "1D", "3Y": "1W", "5Y": "1W", "10Y": "1M", "ALL": "1M" };

  const range = k => RANGES.find(r => r.k === k) || RANGES[4];
  const interval = k => INTERVALS.find(i => i.k === k) || INTERVALS[4];
  const valid = (rk, ik) => { const d = range(rk).days, i = interval(ik); return d <= (i.max ?? Infinity) && d >= (i.min ?? 0); };
  const fix = (rk, ik) => valid(rk, ik) ? ik : DEFAULT[range(rk).k];
  const intraday = ik => interval(ik).res !== "D";

  // Fetch window [from, to] in unix seconds; daily fetches start a little earlier so long MAs have warm-up bars.
  function windowOf(rk, ik, now = Date.now() / 1000) {
    const days = range(rk).days + (intraday(ik) ? 0 : 300);

  }

  }

  }

})();

// GET JSON with timeout, TTL cache (memory, + sessionStorage when persist) and in-flight de-dup; errors carry .status and .rateLimited (HTTP 429) for clear UI messages.
const Http = (() => {
  const cache = new Map(), inflight = new Map();
  const blockedUntil = new Map();
  const host = url => { try { return new URL(url).host; } catch { return ""; } };
  const SK = "web_tool.crypto-market-board.http:";
  const fromSession = url => { try { const v = JSON.parse(sessionStorage.getItem(SK + url) || "null"); if (v && v.at && "data" in v) { cache.set(url, v); return v; } } catch { /* blocked / full */ } return null; };
  const toSession = (url, v) => { try { sessionStorage.setItem(SK + url, JSON.stringify(v)); } catch { /* blocked / full */ } };

  // opt: { ttl ms (0 = no cache), timeout ms, persist (survive reload within ttl), opaqueLimit (host answers 429 without CORS → a network error means "rate limited") }
  async function json(url, opt = {}) {
    const ttl = opt.ttl || 0, hit = cache.get(url) || (opt.persist ? fromSession(url) : null);
    if (ttl && hit && Date.now() - hit.at < ttl) return hit.data;
    if (inflight.has(url)) return inflight.get(url);
    const h = host(url), wait = (blockedUntil.get(h) || 0) - Date.now();
    if (wait > 0) {
      if (hit) return hit.data;
      throw Object.assign(new Error(`rate limited by ${h}`), { status: 429, rateLimited: true, retryIn: Math.ceil(wait / 1000) });
    }
    const p = (async () => {
      const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), opt.timeout || 20000);
      try {
        const res = await fetch(url, { signal: ctl.signal, credentials: "omit", referrerPolicy: "no-referrer" });
        if (res.status === 429 || res.status === 418) {
          const sec = Math.min(300, Math.max(30, +res.headers.get("retry-after") || 60));
          blockedUntil.set(h, Date.now() + sec * 1000);
          throw Object.assign(new Error(`HTTP ${res.status} ${h}`), { status: res.status, rateLimited: true, retryIn: sec });
        }
        if (!res.ok) throw Object.assign(new Error(`HTTP ${res.status} ${h}`), { status: res.status });
        const data = await res.json();
        if (ttl) { const v = { at: Date.now(), data }; cache.set(url, v); if (opt.persist) toSession(url, v); }
        return data;
      } catch (e) {
        if (opt.opaqueLimit && e instanceof TypeError) {
          blockedUntil.set(h, Date.now() + 60000);
          e = Object.assign(new Error(`rate limited by ${h} (opaque)`), { rateLimited: true, retryIn: 60 });
        }
        // A stale copy beats an empty view when the source hiccups.
        if (hit && !opt.noStale) return hit.data;
        throw e;
      } finally { clearTimeout(timer); inflight.delete(url); }
    })();
    inflight.set(url, p);
    return p;
  }

  return { json, qs, drop: url => cache.delete(url) };
})();

// api.binance.com first; a refused / blocked region (HTTP 451, network error) switches to the market-data mirror data-api.binance.vision.
const Spot = (() => {
  const HOSTS = ["https://api.binance.com", "https://data-api.binance.vision"];
  let hi = 0;
  const TZ = -new Date().getTimezoneOffset() * 60;

  async function get(path, opt) {
    try { return await Http.json(HOSTS[hi] + path, opt); }
    catch (e) {
      if (e.rateLimited || hi === HOSTS.length - 1) throw e;
      console.warn("Spot.get - switch to mirror host", path, e.message);
      hi++;
      return Http.json(HOSTS[hi] + path, opt);
    }
  }

  // → Map base → "BASEUSDT" (trading pairs only).
  async function pairs() {
    const j = await get("/api/v3/exchangeInfo?permissions=SPOT&symbolStatus=TRADING", { ttl: 3600e3, timeout: 30000 });
    const m = new Map();
    for (const s of j.symbols || []) if (s.quoteAsset === "USDT" && s.status === "TRADING") m.set(s.baseAsset, s.symbol);
    return m;
  }

  // MINI ticker → common tick { pair, last, open, high, low, vol, qvol, pct, at }.
  const tick = t => {
    const last = +t.lastPrice || +t.c, open = +t.openPrice || +t.o;
    return { pair: t.symbol || t.s, last, open, high: +(t.highPrice ?? t.h), low: +(t.lowPrice ?? t.l), vol: +(t.volume ?? t.v), qvol: +(t.quoteVolume ?? t.q),

  };
  // pairs omitted → every symbol (weight 80, ~1 MB raw); otherwise ≤ 100 per call.
  async function tickers(list) {
    if (!list) return (await get("/api/v3/ticker/24hr?type=MINI", { timeout: 30000 })).map(tick);
    const out = [];
    for (let i = 0; i < list.length; i += 100) {
      const chunk = list.slice(i, i + 100);
      out.push(...(await get(`/api/v3/ticker/24hr?type=MINI&symbols=${encodeURIComponent(JSON.stringify(chunk))}`)).map(tick));
    }
    return out;
  }

  const INTERVALS = ["1m", "5m", "15m", "1h", "4h", "1d", "1w", "1M"];
  const bar = k => ({ time: Math.floor(k[0] / 1000) + TZ, open: +k[1], high: +k[2], low: +k[3], close: +k[4], volume: +k[5], qv: +k[7] });

  async function klines(pair, interval, limit = 1000) {
    let out = [], end = null;
    while (out.length < limit) {
      const n = Math.min(1000, limit - out.length);
      const page = await get(`/api/v3/klines?${Http.qs({ symbol: pair, interval, limit: n, endTime: end })}`, { ttl: interval === "1m" ? 0 : 20e3 });
      if (!page.length) break;
      out = page.map(bar).concat(out);
      if (page.length < n) break;
      end = page[0][0] - 1;
    }
    return out;
  }
  const liveBar = k => bar([k.t, k.o, k.h, k.l, k.c, k.v, 0, k.q]);

  async function depth(pair, limit = 20) {
    const j = await get(`/api/v3/depth?symbol=${pair}&limit=${limit}`);
    return { bids: j.bids.map(([p, q]) => [+p, +q]), asks: j.asks.map(([p, q]) => [+p, +q]) };
  }
  // Aggregated trades → { p, q, t, buy } (buy = taker bought, i.e. buyer was not the maker).
  const trade = a => ({ p: +a.p, q: +a.q, t: a.T, buy: !a.m });
  const trades = async (pair, limit = 60) => (await get(`/api/v3/aggTrades?symbol=${pair}&limit=${limit}`)).map(trade).reverse();

  return { pairs, tickers, tick, klines, liveBar, depth, trades, trade, INTERVALS, TZ };
})();

// the viewer picks a slower rate, the socket keeps failing (blocked network) or the page is hidden (60 s, enough for price alerts).
const Live = (() => {
  const HOSTS = ["wss://stream.binance.com:9443/stream", "wss://data-stream.binance.vision/stream"];
  const ticks = new Map(), subs = new Map(), tickFns = [], statusFns = [];

  const put = t => { if (t.pair && t.pair.endsWith("USDT") && t.last > 0) ticks.set(t.pair, t); };

    if (rate !== "off" && !sleeping) for (const k of subs.keys()) s.add(k);

    catch (e) { console.warn("Live.connect - open websocket fail", e); onFail(); return; }

})();

  const extra = new Map();

      for (const r of rows) if (r.sym && !gecko.has(r.sym)) gecko.set(r.sym, r);
    } catch (e) { err = e; throw e; }
  }

  const pair = sym => pairMap.get(sym) || null;
  // Rows seen outside the top 250 (trending, network lists) still give price / cap to the detail pane.
  const g = sym => gecko.get(sym) || (extra.get(sym) && extra.get(sym).price != null ? extra.get(sym) : null);
  const name = sym => g(sym)?.name || extra.get(sym)?.name || "";
  const id = sym => g(sym)?.id || extra.get(sym)?.id || null;
  const known = sym => pairMap.has(sym) || gecko.has(sym) || extra.has(sym);

  const COPY = ["rank", "mcap", "fdv", "circ", "total", "max", "ath", "athPct", "athDate", "atl", "atlPct", "atlDate", "pct1h", "pct7d", "pct30d", "pct1y", "spark"];

    if (gr) { for (const k of COPY) r[k] = gr[k]; Object.assign(r, { last: gr.price, pct: gr.pct, high: gr.high, low: gr.low, qvol: gr.qvol, src: "gecko" }); }
    if (t && (!gr || !gr.price || Math.abs(t.last / gr.price - 1) < 0.15)) {

// 6 requests at a time, result cached 15 min (Binance public weight: ~2 per call).
const PicksData = (() => {
  const N = 60, POOL = 6, TTL = 900e3;
  let cache = null, running = null;

  function rowOf(r, daily) {
    const c = daily.map(b => b.close), price = r.last || c[c.length - 1];
    const f = TechOutlook.frame(daily, "D", [5]), weekly = ChartRange.shape(daily, "1W"), fw = weekly.length >= 30 ? TechOutlook.frame(weekly, "W", [4]) : null;
    const ma = c.length >= 200 ? TA.sma(c, 200)[c.length - 1] : null;
    return { sym: r.sym, price, rank: r.rank || 999, d: f ? f.score : null, rsi: f ? f.rsi : null, up5: f && f.odds[5] && f.odds[5].n ? f.odds[5].up : null,
      w: fw ? fw.score : null, above200: ma ? price > ma : null, mayer: ma ? price / ma : null, athPct: r.athPct, ret1y: r.pct1y,
      fdvR: r.fdv && r.mcap ? r.fdv / r.mcap : null, turnover: r.qvol && r.mcap ? r.qvol / r.mcap * 100 : null };
  }

  // onProgress(done, total) while loading; resolves to { rows, at }.
  async function load(onProgress = () => {}) {
    if (cache && Date.now() - cache.at < TTL) return cache;
    if (running) return running;
    running = (async () => {
      const coins = [...new Set(Coins.list().map(g => g.sym))].map(Coins.row).filter(r => r.pair && MarketMath.tradable(r)).sort((a, b) => (a.rank || 1e9) - (b.rank || 1e9)).slice(0, N);
      const rows = [];
      let done = 0;
      for (let i = 0; i < coins.length; i += POOL) {
        await Promise.all(coins.slice(i, i + POOL).map(async r => {
          try { const d = await Spot.klines(r.pair, "1d", 400); if (d.length >= 30) rows.push(rowOf(r, d)); }
          catch (e) { console.warn("PicksData.load - klines fail", r.pair, e.message); }
          onProgress(++done, coins.length);
        }));
      }
      if (rows.length) cache = { rows, at: Date.now() };
      return cache || { rows, at: Date.now() };
    })();
    try { return await running; } finally { running = null; }
  }

  return { load, cached: () => cache };
})();

  // blockchain.info can lag a day or two; top up with Binance daily closes.
  async function topUp(price) {
    const last = price.length ? price[price.length - 1].t : 0;
    if (Date.now() / 1000 - last < 2 * DAY) return price;
    try {
      const k = await Http.json("https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=1d&limit=10", { ttl: 600e3 });
      const extra = k.map(r => ({ t: Math.floor(r[0] / 1000 / DAY) * DAY, v: +r[4] })).filter(p => p.t > last && p.v > 0);
      return price.concat(extra);
    } catch { return price; }
  }

  async function history() {
    const [price, rev, supply] = await Promise.all([chart("market-price", "&sampled=false"), chart("miners-revenue", "&sampled=false"), chart("total-bitcoins")]);
    return { price: await topUp(price), rev, supply };

})();

const Alerts = (() => {
  const MAX = 100;
  const id = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const clean = arr => Array.isArray(arr) ? arr.filter(a => AlertRule.valid(a) && CoinParse.isSymbol(a.sym)).slice(0, MAX)
    .map(a => ({ id: /^[a-z0-9]{4,20}$/.test(a.id || "") ? a.id : id(), sym: a.sym, type: a.type, value: +a.value, fired: Number.isFinite(+a.fired) && +a.fired > 0 ? +a.fired : 0 })) : [];
  let list = clean(Prefs.get("alerts", []));
  const fns = [];
  const changed = () => { Prefs.set("alerts", list); fns.forEach(f => f()); };
  // Another tab may fire / edit alerts → re-read before every write.
  const reload = () => { list = clean(Prefs.get("alerts", [])); };
  addEventListener("storage", e => { if (e.key === Prefs.P + "alerts") { reload(); fns.forEach(f => f()); } });

  function add(sym, type, value) {
    reload();
    const a = { id: id(), sym, type, value: +value, fired: 0 };
    if (!AlertRule.valid(a) || !CoinParse.isSymbol(sym) || list.length >= MAX) return false;
    list = [...list, a]; changed();
    return true;
  }
  const remove = aid => { reload(); list = list.filter(a => a.id !== aid); changed(); };
  const rearm = aid => { reload(); list = list.map(a => a.id === aid ? { ...a, fired: 0 } : a); changed(); };
  const merge = raw => { reload(); const have = new Set(list.map(a => `${a.sym}|${a.type}|${a.value}`)); list = [...list, ...clean(raw).filter(a => !have.has(`${a.sym}|${a.type}|${a.value}`))].slice(0, MAX); changed(); };
  function check(rows) {
    reload();
    const r = AlertRule.check(list, rows);
    if (r.hits.length) { list = r.list; changed(); }
    return r.hits;
  }
  return { add, remove, rearm, merge, check, all: () => list.slice(), symbols: () => [...new Set(list.filter(a => !a.fired).map(a => a.sym))], onChange: f => fns.push(f) };
})();
// Lightweight Charts wrapper for analytic time series (on-chain, DeFi, derivatives): lines / areas / histograms on 1–3 panes,
// left / right / own scales, log scale, markers, guide levels, crosshair legend. axis "days" shows x as day counts (halving cycles).
const SeriesChart = (() => {
  const css = () => { const s = getComputedStyle(document.documentElement), v = n => s.getPropertyValue(n).trim(); return { bg: v("--panel"), muted: v("--muted"), line: v("--line"), ink: v("--ink") }; };
  const alpha = (hex, a) => /^#[0-9a-f]{6}$/i.test(hex) ? hex + a : hex;
  const DAY = 86400;
  // Sorted, one point per time, finite values only (the library throws on unsorted / duplicate times).
  function tidy(data) {
    const m = new Map();
    for (const d of data || []) if (d && Number.isFinite(d.time) && (d.value == null || Number.isFinite(d.value))) m.set(Math.round(d.time), d);
    return [...m.entries()].sort((a, b) => a[0] - b[0]).map(([t, d]) => d.value == null ? { time: t } : { ...d, time: t });
  }

  // opt: { legend?: HTMLElement, axis?: "date" | "days", fmt?: v => string }
  function create(el, opt = {}) {
    const LW = globalThis.LightweightCharts;
    let chart = null, made = [], args = null;

    function destroy() { if (chart) chart.remove(); chart = null; made = []; }

    // series: [{ title, data: [{ time (s), value, color? }], color, type: "line"|"area"|"hist"|"dots", width, dash, scale, pane, fmt, markers, levels }]
    function set(series, o = {}) {
      args = [series, o];
      destroy();
      const c = css(), days = opt.axis === "days";
      const fmt = opt.fmt || (v => Fmt.big(v));
      chart = LW.createChart(el, {
        autoSize: true,
        layout: { background: { type: "solid", color: c.bg }, textColor: c.muted, fontSize: 11, panes: { separatorColor: c.line } },
        grid: { vertLines: { color: alpha(c.line, "44") }, horzLines: { color: alpha(c.line, "44") } },
        rightPriceScale: { borderColor: c.line, visible: true }, leftPriceScale: { borderColor: c.line, visible: series.some(s => s.scale === "left") },
        timeScale: { borderColor: c.line, timeVisible: !!o.intraday, secondsVisible: false, rightOffset: 2, minBarSpacing: 0.02,
          ...(days ? { tickMarkFormatter: t => T("Ngày {n}", { n: Math.round(t / DAY) }) } : {}) },
        localization: { locale: "en-US", priceFormatter: fmt, ...(days ? { timeFormatter: t => T("Ngày {n}", { n: Math.round(t / DAY) }) } : {}) },
        crosshair: { mode: LW.CrosshairMode.Normal },
        handleScroll: { vertTouchDrag: false },
      });
      made = series.map(s => {
        const pane = s.pane || 0, common = { priceLineVisible: false, lastValueVisible: s.last !== false, title: s.axisTitle || "", priceScaleId: s.scale || "right", visible: s.visible !== false,
          ...(s.fmt ? { priceFormat: { type: "custom", formatter: s.fmt, minMove: 1e-12 } } : {}) };
        let ser;
        if (s.type === "hist") ser = chart.addSeries(LW.HistogramSeries, { ...common, color: s.color }, pane);
        else if (s.type === "area") ser = chart.addSeries(LW.AreaSeries, { ...common, lineColor: s.color, topColor: alpha(s.color, "55"), bottomColor: alpha(s.color, "08"), lineWidth: s.width || 2 }, pane);
        else ser = chart.addSeries(LW.LineSeries, { ...common, color: s.color, lineWidth: s.width || 2, lineStyle: s.dash ? LW.LineStyle.Dashed : LW.LineStyle.Solid,
          lineVisible: s.type !== "dots", pointMarkersVisible: s.type === "dots", pointMarkersRadius: 2, crosshairMarkerVisible: true }, pane);
        ser.setData(tidy(s.data));
        if (s.markers && s.markers.length) LW.createSeriesMarkers(ser, tidy(s.markers.map(m => ({ ...m, value: 0 }))).map(m => ({ time: m.time, position: m.position || "aboveBar", color: m.color || c.ink, shape: m.shape || "arrowDown", text: m.text || "" })));
        for (const lv of s.levels || []) ser.createPriceLine({ price: lv.price, color: lv.color || c.muted, lineWidth: 1, lineStyle: LW.LineStyle.Dotted, axisLabelVisible: true, title: lv.title || "" });
        return { s, ser };
      });
      if (o.log) chart.priceScale("right").applyOptions({ mode: 1 });
      for (const sc of new Set(series.map(s => s.scale).filter(x => x && x !== "right" && x !== "left"))) {
        const first = series.find(s => s.scale === sc);
        chart.priceScale(sc, first.pane || 0).applyOptions({ scaleMargins: first.margins || { top: 0.7, bottom: 0 } });
      }
      const panes = chart.panes();
      panes.forEach((p, i) => p.setStretchFactor(i ? 1 : Math.max(2, panes.length)));
      chart.subscribeCrosshairMove(p => legend(p));
      if (o.from) chart.timeScale().setVisibleRange({ from: o.from, to: o.to || Math.floor(Date.now() / 1000) + DAY });
      else chart.timeScale().fitContent();
      legend(null);
    }

    function legend(p) {
      if (!opt.legend) return;
      const items = made.filter(m => m.s.legend !== false).map(({ s, ser }) => {
        let v = p && p.seriesData ? p.seriesData.get(ser) : null;
        if (!v) { const d = ser.data(); v = d[d.length - 1]; }
        const val = v && Number.isFinite(v.value) ? (s.fmt || opt.fmt || Fmt.big)(v.value) : "–";
        return `<span style="color:${s.color}">${Dom.esc(s.title)} <b>${Dom.esc(val)}</b></span>`;
      });
      const t = p && p.time != null ? (opt.axis === "days" ? T("Ngày {n}", { n: Math.round(p.time / DAY) }) : Fmt.date(p.time * 1000)) : "";
      opt.legend.innerHTML = (t ? `<span>${Dom.esc(t)}</span>` : "") + items.join("");
    }

    return { set, destroy, redraw: () => { if (args) set(...args); }, chart: () => chart };
  }

  // [{ t (ms) | time (s), value }] helpers for callers.
  const fromMs = (list, key = "value") => list.map(x => ({ time: Math.floor(x.t / 1000), value: x[key] }));
  return { create, tidy, fromMs, DAY };
})();

  const TABS = new Set(["top100", "trending", "network"]);

  let mode = MODES.some(m => m[0] === Prefs.get("trend")) ? Prefs.get("trend") : "hot";

  const e = s => Dom.esc(s ?? "");
  const uniq = list => [...new Set(list)];
  const top = () => uniq(Coins.list().map(g => g.sym)).map(Coins.row);

    if (mode === "lose") return MarketMath.movers(rows, "pct", 50, true);
    if (mode === "move1h") return MarketMath.movers(rows.map(r => ({ ...r, abs1h: Math.abs(r.pct1h) })), "abs1h", 50);
    return MarketMath.movers(rows.map(r => ({ ...r, turn: r.mcap ? r.qvol / r.mcap : null })), "turn", 50);
  }

    const ch = SeriesChart.create(el.querySelector(".chost"), { legend: el.querySelector(".clegend"), fmt });

    drawers[drawers.length - 1]();
  }

  function treemap(chains) {
    if (typeof Mkt === "undefined") return "";
    const narrow = body.clientWidth < 640, top = chains.slice(0, narrow ? 24 : 40), W = 1000, H = narrow ? 900 : 340, by = new Map(top.map(c => [c.name, c]));
    const cells = Mkt.treemap(top.map(c => ({ key: c.name, w: c.tvl })), 0, 0, W, H).map((c, i) => {
      const r = by.get(c.key), fs = Math.max(narrow ? 22 : 11, Math.min(30, Math.sqrt(c.w * c.h) / 6)), big = c.w > (narrow ? 150 : 80) && c.h > fs * 2.6;
      return `<g><title>${e(c.key)} ${e(Fmt.moneyBig(r.tvl))} ${e(Fmt.en(r.share, 1))}%</title><rect x="${c.x.toFixed(1)}" y="${c.y.toFixed(1)}" width="${Math.max(0, c.w - 1).toFixed(1)}" height="${Math.max(0, c.h - 1).toFixed(1)}" fill="${PAL[i % PAL.length]}"/>`
        + (big ? `<text class="mk-sym" x="${(c.x + 6).toFixed(1)}" y="${(c.y + fs + 3).toFixed(1)}" font-size="${fs.toFixed(1)}">${e(c.key)}</text><text class="mk-sym mk-pct" x="${(c.x + 6).toFixed(1)}" y="${(c.y + fs * 2 + 5).toFixed(1)}" font-size="${(fs * (narrow ? 1 : .8)).toFixed(1)}">${e(Fmt.en(r.share, 1))}%</text>` : "") + "</g>";
    });
    return `<svg viewBox="0 0 ${W} ${H}" class="heatmap" role="img">${cells.join("")}</svg>`;
  }
  function catBars(cats) {
    const top = cats.slice(0, 14), mx = top[0] ? top[0].tvl : 1;

  }

  function overview(id) {
    body.innerHTML = `<div class="cards">${card("tvl", T("Tổng TVL DeFi"))}${card("fees", T("Phí 24h"))}${card("rev", T("Doanh thu 24h"))}${card("dex", T("Khối lượng DEX 24h"))}${card("stable", T("Vốn hóa stablecoin"))}</div>`

    slot("chains", data.chains(), (c, el) => { el.innerHTML = treemap(c); });
    slot("cats", data.proto(), (p, el) => { el.innerHTML = catBars(D.categoryRows(p.filter(g => g.category !== "CEX"))); });
    get("fees", () => L.fees()).then(f => alive(id) && setCard("fees", Fmt.moneyBig(f.total24h), chg("24h", f.change_1d))).catch(() => {});
    get("revT", () => Promise.all([L.revenue(), L.fees()])).then(([r, f]) => alive(id) && setCard("rev", Fmt.moneyBig(r.total24h), f.total24h > 0 ? T("{p}% của phí", { p: Fmt.en(r.total24h / f.total24h * 100, 0) }) : "")).catch(() => {});
    get("dexT", () => L.dexs()).then(x => alive(id) && setCard("dex", Fmt.moneyBig(x.total24h), chg("24h", x.change_1d) + " " + chg("7d", x.change_7d))).catch(() => {});
    get("stableT", async () => D.stableTotals(await L.stables())).then(t => alive(id) && setCard("stable", Fmt.moneyBig(t.cur), chg("7d", t.c7) + " " + chg("30d", t.c30))).catch(() => {});
  }

  // Generic list tab: sticky-name table, remembered sort, optional filters (search / category / CEX).
  function listTab(key, rows, o = {}) {
    const st = pref("sort." + key, o.sort), cats = o.cats ? [...new Set(rows.map(r => r.category))].sort() : [];
    if (o.cats && !cats.includes(flt.cat)) flt.cat = "";
    body.innerHTML = (o.top || "") + `<div class="df-ctl"><input type="search" data-f="q" value="${e(flt.q)}" placeholder="${e(T("Tìm theo tên hoặc mã…"))}">`
      + (o.cats ? `<select data-f="cat"><option value="">${e(T("Tất cả danh mục"))}</option>${cats.map(c => `<option${c === flt.cat ? " selected" : ""}>${e(c)}</option>`).join("")}</select>` : "")
      + (o.cex ? `<label><input type="checkbox" data-f="cex"${flt.cex ? " checked" : ""}> ${e(T("Hiện CEX"))}</label>` : "") + `<span class="muted" data-n></span></div><div data-tbl></div>` + note(o.note);
    const draw = () => {
      const q = flt.q.trim().toLowerCase();
      let r = rows.filter(x => (!q || x.name.toLowerCase().includes(q) || (x.symbol || "").toLowerCase().includes(q)) && (!o.cats || !flt.cat || x.category === flt.cat) && (o.cex === undefined || flt.cex || x.category !== "CEX"));
      const n = r.length;
      r = D.sortRows(r, st.k, st.dir).slice(0, o.limit || 200);
      body.querySelector("[data-tbl]").innerHTML = DefiTables.table(DefiTables.COLS[key](), r, st);
      body.querySelector("[data-n]").textContent = T("Hiển thị {n} / {m}", { n: r.length, m: n });

    cur = { draw, st, key, cols: () => DefiTables.COLS[key]() };
    draw();

  const LIST = {
    async chains(id) { const r = await data.chains(); if (alive(id)) listTab("chains", r, { sort: { k: "tvl", dir: -1 }, limit: 300, note: T("Thị phần = TVL của chain / tổng TVL các chain. Nhấn tên để mở token gốc của chain.") }); },
    async protocols(id) {
      const r = await data.proto();
      if (alive(id)) listTab("protocols", r, { sort: { k: "tvl", dir: -1 }, cats: 1, cex: 1, note: T("Các phiên bản của cùng một giao thức được gộp lại. MCap/TVL thấp nghĩa là vốn hóa token nhỏ so với tài sản đang khóa. Hiển thị tối đa 200 dòng, dùng ô tìm kiếm để thu hẹp.") });
    },

      const r = await data.rev();
      if (alive(id)) listTab("revenue", r, { sort: { k: "r30", dir: -1 }, top: note(T("Phí (fees) là toàn bộ phí người dùng trả; doanh thu (DT) là phần giao thức hoặc người nắm giữ token giữ lại sau khi chia cho nhà cung cấp thanh khoản và các bên khác. P/F = vốn hóa / phí năm hóa, P/S = vốn hóa / doanh thu năm hóa: càng thấp càng rẻ so với dòng tiền, nhưng chưa tính tăng trưởng hay rủi ro. Không phải khuyến nghị đầu tư.")), note: T("Năm hóa = tổng 1 năm gần nhất (thiếu thì lấy 30 ngày x 365/30). Vốn hóa lấy từ DeFiLlama, thiếu thì dùng CoinGecko theo mã token; dấu – là chưa có.") });
    },
    async dex(id) { const r = await data.dex(); if (alive(id)) listTab("dex", r, { sort: { k: "d1", dir: -1 }, note: T("Khối lượng giao dịch trên các sàn phi tập trung (DEX); các phiên bản của cùng một giao thức được gộp lại.") }); },
    async stable(id) {
      const [r, hist] = await Promise.all([data.stable(), get("stableH", () => L.stableHistory()).catch(() => null)]);
      if (!alive(id)) return;
      const t = D.stableTotals(r);
      listTab("stable", r, { sort: { k: "cur", dir: -1 }, note: T("Nguồn cung stablecoin theo DeFiLlama; % thay đổi so với 1 ngày, 7 ngày và 30 ngày trước.") });
      body.insertAdjacentHTML("afterbegin", `<div class="cards">${card("sup", T("Tổng nguồn cung"))}${card("w", T("Thay đổi 7 ngày"))}${card("m", T("Thay đổi 30 ngày"))}</div><div data-s="sh"></div>`);
      setCard("sup", Fmt.moneyBig(t.cur), ""); setCard("w", Fmt.pct(t.c7, 2), ""); setCard("m", Fmt.pct(t.c30, 2), "");
      if (hist && hist.length) chartSection(body.querySelector('[data-s="sh"]'), T("Tổng vốn hóa stablecoin"), [{ title: "Stablecoin", data: hist, color: "#15803d", type: "area" }], v => Fmt.moneyBig(v));
    },
  };

  async function show() {
    const id = ++run;
    charts.forEach(c => c.destroy()); charts = []; drawers = []; cur = null;
    body.innerHTML = `<p class="muted pad">${e(T("Đang tải…"))}</p>`;
    try { await (tab === "overview" ? overview(id) : LIST[tab](id)); } catch (err) { if (alive(id)) body.innerHTML = errHtml(err); }
  }

  function render() {
    root.innerHTML = `<div class="dsec df-tabs"><span class="seg">${TABS.map(([k, l]) => `<button data-t="${k}" class="${k === tab ? "on" : ""}">${e(l())}</button>`).join("")}</span></div><div data-body></div>`;
    body = root.querySelector("[data-body]");
    show();
  }

  function onClick(ev) {
    const t = ev.target.closest("[data-t],[data-sort],[data-act],[data-range],[data-cat]");
    if (!t) return;
    if (t.dataset.t) { tab = t.dataset.t; save("tab", tab); render(); }
    else if (t.dataset.act === "retry") { cache = {}; L.clear(); show(); }
    else if (t.dataset.cat !== undefined) { flt.cat = t.dataset.cat; tab = "protocols"; save("tab", tab); render(); }
    else if (t.dataset.range) { save("range", t.dataset.range); root.querySelectorAll("[data-range]").forEach(b => b.classList.toggle("on", b.dataset.range === t.dataset.range)); drawers.forEach(f => f()); }
    else if (t.dataset.sort && cur) {
      const k = t.dataset.sort, c = cur.cols().find(x => x.k === k), same = cur.st.k === k;
      cur.st.dir = same ? -cur.st.dir : c && (c.tx || c.left) ? 1 : -1; cur.st.k = k;
      save("sort." + cur.key, { k, dir: cur.st.dir }); cur.draw();
    }
  }
  const onInput = Dom.debounce(ev => {
    const f = ev.target.dataset.f;
    if (!f || !cur) return;
    flt[f] = f === "cex" ? ev.target.checked : ev.target.value;
    if (f === "cat" || f === "cex") save(f, flt[f]);
    cur.draw();
  }, 150);

  function mount(el) {
    host = el; host.innerHTML = "";
    root = document.createElement("div"); root.className = "df";
    host.appendChild(root);
    root.addEventListener("click", onClick);
    root.addEventListener("input", onInput); root.addEventListener("change", onInput);
    const t = pref("tab", "overview"); tab = TABS.some(x => x[0] === t) ? t : "overview";
    Object.assign(flt, { q: "", cat: pref("cat", ""), cex: !!pref("cex", false) });
    render();
  }
  function unmount() {
    run++; charts.forEach(c => c.destroy()); charts = []; drawers = [];
    if (root) root.remove();
    host = root = body = cur = null;
  }
  function relabel() { if (!root) return; for (const k in cache) cache[k].at = Date.now(); render(); }

  return { id: "defi", label: "DeFi & Doanh thu", wide: true, mount, unmount, relabel };
})();

        return R.times.length ? [{ title: "MA30", data: eh(R.s30), color: "#22c55e", width: 2, fmt: f, markers: R.recovery.map(i => ({ time: R.times[i], position: "belowBar", color: "#22c55e", shape: "arrowUp" })) },
          { title: "MA60", data: eh(R.s60), color: "#ef4444", width: 2, fmt: f }, { title: T("Độ khó (T)"), data: diff, color: "#38bdf8", width: 1.5, pane: 1, fmt: v => Fmt.en(v, 1) + "T" }] : [];
      },
      note: A => T("Hashrate trung bình 30 ngày (MA30) và 60 ngày (MA60), cùng độ khó mạng ở khung dưới. Khi MA30 xuống dưới MA60 là thợ đào đang chịu áp lực (capitulation); khi MA30 cắt lên lại trên MA60 (mũi tên xanh) là tín hiệu hồi phục của Hash Ribbons.")
        + " " + (A.now.capitulation ? T("Hiện tại: đang trong giai đoạn thợ đào đầu hàng (MA30 dưới MA60).") : T("Hiện tại: MA30 đang trên MA60, không còn đầu hàng.")) },
    { id: "fng", label: "Fear & Greed vs giá", opt: { log: true },
      series: (A, X) => { const f = (X.fg || []).slice().reverse(); return f.length ? [price(A), { title: "Fear & Greed", data: f.map(p => ({ time: Math.floor(p.t / 86400) * 86400, value: p.v })), color: "#f59e0b", width: 1.5, scale: "left", fmt: v => Fmt.en(v, 0) }] : []; },
      from: (A, X) => X.fg && X.fg.length ? Math.min(...X.fg.map(p => p.t)) : 0,
      note: A => T("Chỉ số Fear & Greed (0–100, trục trái) đặt cạnh giá BTC (trục phải, thang log). Sợ hãi cực độ thường đi cùng giai đoạn giá giảm mạnh, tham lam cực độ đi cùng giai đoạn giá tăng nóng.")
        + (A.now.fg != null ? " " + T("Hiện tại: {v} ({label}).", { v: A.now.fg, label: fgLabel(A.now.fg) }) : "") },
  ];

  const byId = id => list.find(c => c.id === id) || list[0];
  function build(id, A, X) {
    const c = byId(id), series = c.series(A, X);
    return { series, opt: { ...c.opt, from: c.from ? c.from(A, X) : undefined }, note: c.note(A, X) };
  }

  return { list, byId, build, fgLabel };
})();
// "Bitcoin On-chain" tab: network status cards, cycle thermometer, indicator chart picker, latest blocks. Data via BtcData, maths via BtcCycle, charts via OnchainCharts.
const OnchainView = (() => {
  let host = null, chart = null, timer = 0, gen = 0, S = null;
  const q = s => host && host.querySelector(s);
  const MEANING = {
    mayer: ["Mayer Multiple", "Giá / MA200 ngày; dưới 0.8 là rẻ, trên 2.4 là quá nóng."], wma: ["Giá / 200WMA", "Giá / MA200 tuần; quanh 1× thường là vùng đáy dài hạn."],
    pi: ["Pi Cycle Top", "MA111 / 2×MA350; chạm 100% là tín hiệu đỉnh chu kỳ."], puell: ["Puell Multiple", "Doanh thu thợ đào / TB 365 ngày; dưới 0.5 rẻ, trên 4 nóng."],
    rainbow: ["Cầu vồng (Rainbow)", "Dải màu hồi quy log–log của giá theo thời gian."], fng: ["Fear & Greed", "Tâm lý thị trường; sợ hãi cao thường đi cùng vùng giá rẻ."],
    ribbon: ["Hash Ribbons", "Hashrate MA30 so với MA60; bên dưới nghĩa là thợ đào đang đầu hàng."],
  };
  const x2 = v => Fmt.en(v, 2) + "×";
  const rowValue = r => r.key === "pi" ? Fmt.en(r.value * 100, 0) + "%" : r.key === "rainbow" ? T(BtcCycle.BANDS[r.value]) : r.key === "fng" ? r.value + " · " + OnchainCharts.fgLabel(r.value)
    : r.key === "ribbon" ? (r.value ? T("Đầu hàng") : T("Bình thường")) : x2(r.value);
  const card = (label, value, sub, tone = "") => `<div class="card"><span>${Dom.esc(label)}</span><b class="${tone}">${Dom.esc(value)}</b><em class="muted">${Dom.esc(sub || "")}</em></div>`;
  const ago = sec => sec < 60 ? T("{n} giây trước", { n: Math.max(0, sec) }) : sec < 3600 ? T("{n} phút trước", { n: Math.floor(sec / 60) }) : T("{n} giờ trước", { n: Math.floor(sec / 3600) });
  const loading = () => `<p class="muted pad">${Dom.esc(T("Đang tải…"))}</p>`;
  const errbox = grp => `<div class="errbox">${Dom.esc(T("Không tải được dữ liệu. Thử lại sau ít phút."))}<button data-act="retry" data-grp="${grp}">${Dom.esc(T("Thử lại"))}</button></div>`;
  const gate = (grp, ok) => ok ? "" : S.err[grp] ? errbox(grp) : loading();

  function renderNet() {
    const n = S.net, A = S.A, el = q(".oc-net");
    if (!el) return;
    const g = gate("net", n), out = [];
    if (A) out.push(card(T("Giá BTC"), Fmt.money(Coins.row("BTC").last || A.now.price), T("Cách đỉnh {x}", { x: Fmt.pct(A.now.drawdown, 1) })));
    if (n) {
      const h = BtcCycle.halvingInfo(n.height), a = n.adj, f = n.fees;
      out.push(card(T("Chiều cao block"), Fmt.en(n.height), T("Block gần nhất")));
      out.push(card(T("Halving kế tiếp"), T("Còn {n} block", { n: Fmt.en(h.blocksLeft) }), T("Dự kiến {d} · tiến độ {p}%", { d: Fmt.date(h.etaMs), p: Fmt.en(h.progress, 1) })));
      out.push(card(T("Điều chỉnh độ khó"), Fmt.pct(a.difficultyChange, 2), T("Tiến độ {p}% · dự kiến {d}", { p: Fmt.en(a.progressPercent, 1), d: Fmt.date(a.estimatedRetargetDate) }), Fmt.tone(a.difficultyChange)));
      out.push(card(T("Phí nhanh nhất"), f.fastestFee + " sat/vB", T("30 phút: {a} · 1 giờ: {b} · tiết kiệm: {c}", { a: f.halfHourFee, b: f.hourFee, c: f.economyFee })));
      out.push(card("Hashrate", Fmt.en(n.hashNow / 1e18, 1) + " EH/s", T("Độ khó {d}T", { d: Fmt.en(n.diffNow / 1e12, 2) })));
    }
    if (S.hist && S.hist.supply.length) { const s = S.hist.supply[S.hist.supply.length - 1].v; out.push(card(T("Nguồn cung đã đào"), Fmt.en(s / 1e6, 3) + "M", T("{p}% của 21M", { p: Fmt.en(s / 21e6 * 100, 2) }))); }
    if (S.fg && S.fg.length) out.push(card("Fear & Greed", String(S.fg[0].v), OnchainCharts.fgLabel(S.fg[0].v)));
    el.innerHTML = (out.length ? `<div class="cards">${out.join("")}</div>` : "") + g;
  }

  function renderThermo() {
    const el = q(".oc-thermo");
    if (!el) return;
    if (!S.A) { el.innerHTML = gate("hist", false); return; }
    const th = S.A.thermo, zone = th.score == null ? "" : T(BtcCycle.ZONES[th.zone]);
    const rows = th.rows.map(r => `<tr><td>${Dom.esc(T(MEANING[r.key][0]))}</td><td class="r">${Dom.esc(rowValue(r))}</td><td><span class="badge oc-z${r.zone}">${Dom.esc(T(BtcCycle.ZONES[r.zone]))}</span></td><td class="muted">${Dom.esc(T(MEANING[r.key][1]))}</td></tr>`).join("");
    el.innerHTML = `<div class="oc-score"><div class="oc-meter"><i style="left:${th.score == null ? 0 : Math.round(th.score)}%"></i></div>
      <div class="oc-score-t">${Dom.esc(T("Điểm tổng hợp"))}: <b>${th.score == null ? "–" : Fmt.en(th.score, 0)}/100</b> <span class="badge oc-z${th.zone}">${Dom.esc(zone)}</span>
      <span class="muted">${Dom.esc(T("0 = đáy · 100 = đỉnh"))}</span></div></div>
      <div class="oc-scroll"><table class="dtable"><thead><tr><th>${Dom.esc(T("Chỉ báo"))}</th><th class="r">${Dom.esc(T("Giá trị"))}</th><th>${Dom.esc(T("Vùng chu kỳ"))}</th><th>${Dom.esc(T("Ý nghĩa"))}</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }

  function renderPicker() {
    const el = q(".oc-picker");
    if (!el) return;
    const opts = OnchainCharts.list.map(c => `<option value="${c.id}"${c.id === S.id ? " selected" : ""}>${Dom.esc(T(c.label))}</option>`).join("");
    el.innerHTML = `<div class="seg oc-pick-seg">${OnchainCharts.list.map(c => `<button data-act="pick" data-id="${c.id}" class="${c.id === S.id ? "on" : ""}">${Dom.esc(T(c.label))}</button>`).join("")}</div><select class="oc-pick-sel" aria-label="${Dom.esc(T("Chọn biểu đồ"))}">${opts}</select>`;
  }

  function killChart() { if (chart) chart.destroy(); chart = null; }
  function renderChart() {
    const el = q(".oc-chart");
    killChart();
    if (!el) return;
    if (!S.A) { el.innerHTML = gate("hist", false); return; }
    try {
      const b = OnchainCharts.build(S.id, S.A, S);
      if (!b.series.length) { el.innerHTML = `<p class="muted pad">${Dom.esc(T("Chưa có dữ liệu cho biểu đồ này."))}</p><p class="sc-note">${Dom.esc(b.note)}</p>`; return; }
      el.innerHTML = `<div class="cbox sc-box tall"><div class="clegend"></div><div class="chost"></div></div><p class="sc-note">${Dom.esc(b.note)}</p>`;
      chart = SeriesChart.create(el.querySelector(".chost"), { legend: el.querySelector(".clegend"), axis: b.opt.axis || "date", fmt: b.opt.fmt });
      chart.set(b.series, { log: !!b.opt.log, from: b.opt.from || undefined });
      const ts = chart.chart().timeScale();
      ts.applyOptions({ minBarSpacing: 0.02 });
      if (b.opt.from) ts.setVisibleRange({ from: b.opt.from, to: Math.floor(Date.now() / 1000) + 86400 }); else ts.fitContent();
    } catch (e) { el.innerHTML = `<p class="muted pad">${Dom.esc(T("Không vẽ được biểu đồ."))}</p>`; }
  }

  function renderBlocks() {
    const el = q(".oc-blocks");
    if (!el) return;
    if (!S.net) { el.innerHTML = gate("net", false); return; }
    const now = Math.floor(Date.now() / 1000);
    const rows = S.net.blocks.map(b => `<tr><td>${Fmt.en(b.height)}</td><td>${Dom.esc(ago(now - b.t))}</td><td class="r">${Fmt.en(b.tx)}</td><td class="r">${Fmt.en(b.size / 1e6, 2)}</td><td>${Dom.esc(b.pool || "–")}</td></tr>`).join("");
    el.innerHTML = `<div class="oc-scroll"><table class="dtable"><thead><tr><th>${Dom.esc(T("Block"))}</th><th>${Dom.esc(T("Thời gian"))}</th><th class="r">${Dom.esc(T("Số giao dịch"))}</th><th class="r">${Dom.esc(T("Dung lượng (MB)"))}</th><th>Pool</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }

  const sec = (title, cls, extra = "") => `<div class="dsec"><b>${Dom.esc(T(title))}</b>${extra}</div><div class="${cls}"></div>`;
  function renderAll() {
    if (!host) return;
    host.innerHTML = `<div class="oc-wrap">${sec("Trạng thái mạng Bitcoin", "oc-net")}${sec("Nhiệt kế chu kỳ", "oc-thermo")}${sec("Biểu đồ on-chain", "oc-picker")}<div class="oc-chart"></div>${sec("Các block mới nhất", "oc-blocks")}
      <p class="muted pad">${Dom.esc(T("Chỉ để tham khảo, không phải lời khuyên đầu tư."))}</p></div>`;
    renderNet(); renderThermo(); renderPicker(); renderChart(); renderBlocks();
  }

  function analyze() {
    if (!S.hist) return;
    S.A = BtcCycle.analyze({ ...S.hist, hash: S.net ? S.net.hash : [], fg: S.fg && S.fg.length ? S.fg[0].v : null });
  }
  async function loadNet() {
    const my = gen, first = !S.net;
    try { const net = await BtcData.network(); if (my !== gen) return; S.net = net; S.err.net = null; }
    catch (e) { if (my !== gen) return; if (!S.net) S.err.net = e; }
    renderNet(); renderBlocks();
    if (first && S.net && S.hist) { analyze(); renderThermo(); renderChart(); }
  }
  async function loadHist() {
    const my = gen;
    try { const [h, fg] = await Promise.all([BtcData.history(), BtcData.fearGreed().catch(() => [])]); if (my !== gen) return; S.hist = h; S.fg = fg; S.err.hist = null; analyze(); }
    catch (e) { if (my !== gen) return; S.err.hist = e; }
    renderNet(); renderThermo(); renderChart();
  }

  function onClick(e) {
    const b = e.target.closest("[data-act]");
    if (!b || !S) return;
    if (b.dataset.act === "retry") { const grp = b.dataset.grp; S.err[grp] = null; renderAll(); return grp === "net" ? loadNet() : loadHist(); }
    if (b.dataset.act === "pick") choose(b.dataset.id);
  }
  function choose(id) { S.id = OnchainCharts.byId(id).id; Prefs.set("onchain.chart", S.id); renderPicker(); renderChart(); }

  function mount(el) {
    host = el; gen++;
    S = { net: null, hist: null, fg: null, A: null, err: { net: null, hist: null }, id: OnchainCharts.byId(Prefs.get("onchain.chart", "rainbow")).id };
    host.onclick = onClick;
    host.onchange = e => { if (e.target.classList.contains("oc-pick-sel")) choose(e.target.value); };
    renderAll(); loadNet(); loadHist();
    timer = setInterval(loadNet, 60000);
  }
  function unmount() { gen++; clearInterval(timer); killChart(); if (host) { host.onclick = null; host.onchange = null; } host = null; S = null; }

  return { id: "onchain", label: "Bitcoin On-chain", wide: true, mount, unmount, relabel: renderAll };
})();
// Wallet tab helpers: shared cell markup (WalletUi), the personal address book (AddrBook) and the realtime whale-stream section (WhalePanel).
const WalletUi = (() => {
  const e = Dom.esc, LINK = 'target="_blank" rel="noopener noreferrer"';
  const tagName = tag => ({ exchange: T("Sàn giao dịch"), whale: T("Cá voi"), fund: T("Quỹ"), mine: T("Của tôi"), other: T("Khác") })[tag] || T("Khác");
  const btcMoney = sats => { const p = BtcChain.price(); return p ? Fmt.moneyBig(sats / BtcFlow.SAT * p) : ""; };
  const addrCell = (a, book) => {
    const hit = BtcFlow.labelOf(book, a);
    return `<button class="wl-lk" data-lookup="${e(a)}" title="${e(a)}">${hit ? `<b>${e(hit.label)}</b> ` : ""}<span class="${hit ? "muted" : ""}">${e(BtcFlow.short(a))}</span></button>`;
  };
  const txCell = id => `<span class="wl-tx"><a href="${e(BtcChain.txUrl(id))}" ${LINK} title="${e(id)}">${e(BtcFlow.short(id, 8))}</a><button class="wl-cp" data-copy="${e(id)}" title="${e(T("Chép"))}" aria-label="${e(T("Chép"))}">⧉</button></span>`;
  const time = ms => { const d = new Date(ms || Date.now()), p = n => String(n).padStart(2, "0"); return `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`; };
  return { tagName, btcMoney, addrCell, txCell, time, LINK };
})();

const AddrBook = (() => {
  let list = BtcFlow.cleanBook(Prefs.get("wallet.book", [])), map = null;
  const fns = [];
  const commit = () => { list = BtcFlow.cleanBook(list); map = null; Prefs.set("wallet.book", list); fns.forEach(f => f()); };
  const index = () => map || (map = new Map(list.map(x => [x.addr, x])));
  function save(entry) {
    const c = BtcFlow.cleanBook([entry])[0];
    if (!c) return false;
    const i = list.findIndex(x => x.addr === c.addr);
    if (i >= 0) list[i] = c; else if (list.length >= BtcFlow.MAX_BOOK) return false; else list.push(c);
    commit(); return true;
  }
  const remove = a => { list = list.filter(x => x.addr !== a); commit(); };
  const merge = raw => { const n = list.length; list = list.concat(BtcFlow.cleanBook(raw).filter(x => !index().has(x.addr))); commit(); return list.length - n; };
  return { list: () => list, map: index, has: a => index().has(a), save, remove, merge, onChange: f => fns.push(f) };
})();

const WhalePanel = (() => {
  const LEVELS = [10, 50, 100, 500, 1000], MAX = 100, e = Dom.esc;
  let host = null, ctl = null, tick = 0, list, stats, msgs, rate, state, threshold, dirty, lastRate;
  const q = k => host && host.querySelector(`[data-w="${k}"]`);
  const loadLevel = () => { const v = +Prefs.get("wallet.whale", 100); return LEVELS.includes(v) ? v : 100; };

  function onTx(x) {
    msgs++;
    const s = BtcFlow.summariseUtx(x);
    if (!BtcFlow.isWhale(s, threshold)) return;
    s.seen = Date.now();
    list.unshift(s); if (list.length > MAX) list.length = MAX;
    stats.n++; stats.sats += s.totalOut;
    if (!stats.top || s.totalOut > stats.top.totalOut) stats.top = s;
    dirty = true;
  }

  const reset = () => { list = []; stats = { n: 0, sats: 0, top: null }; };

  function start() {
    if (ctl) return;
    reset();
    ctl = BtcChain.watch({ onTx, onState: s => { state = s; dirty = true; } });
  }
  function stop() { if (ctl) { ctl.stop(); ctl = null; } }

  const row = s => {
    const f = s.inputs[0], t = s.outputs[0], book = AddrBook.map(), usd = WalletUi.btcMoney(s.totalOut);
    return `<tr><td>${e(WalletUi.time(s.seen))}</td><td class="r"><b>${e(BtcFlow.btc(s.totalOut))}</b> BTC</td><td class="r">${e(usd)}</td>`
      + `<td>${f ? WalletUi.addrCell(f.addr, book) : '<span class="muted">—</span>'}${s.inputs.length > 1 ? ` <span class="muted">+${s.inputs.length - 1}</span>` : ""}</td>`
      + `<td>${t ? WalletUi.addrCell(t.addr, book) : '<span class="muted">—</span>'}${s.outputs.length > 1 ? ` <span class="muted">+${s.outputs.length - 1}</span>` : ""}</td><td>${WalletUi.txCell(s.hash)}</td></tr>`;
  };

  const STATE = () => ({ connecting: T("Đang kết nối"), live: T("Trực tiếp"), reconnecting: T("Đang kết nối lại"), stopped: T("Đã dừng") })[state] || "";
  const card = (label, value, sub) => `<div class="card"><span>${e(label)}</span><b>${value}</b><em class="muted">${sub || "&nbsp;"}</em></div>`;

  function paintDyn() {
    if (!host) return;
    const b = q("badge"); b.textContent = STATE(); b.className = "badge" + (state === "live" ? " live" : state === "stopped" ? "" : " poll");
    q("rate").textContent = ctl ? T("{n} tin/giây", { n: Fmt.en(rate, 1) }) : "";
    q("toggle").textContent = ctl ? T("Dừng") : T("Bắt đầu");
    const top = stats.top;
    q("cards").innerHTML = card(T("Giao dịch cá voi"), Fmt.en(stats.n), "")
      + card(T("BTC đã chuyển"), `${e(BtcFlow.btc(stats.sats))} BTC`, e(WalletUi.btcMoney(stats.sats)))
      + card(T("Lớn nhất"), top ? `${e(BtcFlow.btc(top.totalOut))} BTC` : "—", top ? e(WalletUi.btcMoney(top.totalOut)) : "");
    q("list").innerHTML = list.length
      ? `<div class="wl-scroll"><table class="wl-tbl"><thead><tr><th>${e(T("Giờ"))}</th><th class="r">${e(T("Tổng BTC"))}</th><th class="r">${e(T("Giá trị"))}</th><th>${e(T("Từ (lớn nhất)"))}</th><th>${e(T("Đến (lớn nhất)"))}</th><th>${e(T("Mã giao dịch"))}</th></tr></thead><tbody>${list.map(row).join("")}</tbody></table></div>`
      : `<p class="muted wl-pad">${e(T("Chưa có giao dịch vượt ngưỡng {n} BTC — đang chờ…", { n: threshold }))}</p>`;
  }

  function paintCtl() {
    q("seg").innerHTML = LEVELS.map(n => `<button data-th="${n}" class="${n === threshold ? "on" : ""}">${n}</button>`).join("");
  }

  function frame() {
    host.innerHTML = `<div class="wl-sec"><b>${e(T("Cá voi realtime"))}</b><span class="muted">${e(T("Giao dịch chưa xác nhận lớn hơn ngưỡng (BTC)"))}</span></div>`
      + `<div class="wl-ctl"><button class="main" data-w="toggle"></button><span class="seg" data-w="seg"></span><span class="badge" data-w="badge"></span><span class="muted" data-w="rate"></span></div>`
      + `<div class="cards" data-w="cards"></div><div data-w="list"></div>`
      + `<p class="sc-note">${e(T("Tổng BTC gồm cả tiền thối về ví gửi nên có thể lớn hơn số tiền thực chuyển. Nhãn lấy từ sổ địa chỉ của bạn."))}</p>`;
    paintCtl();
  }

  function mount(el) {
    host = el; msgs = 0; rate = 0; state = "connecting"; dirty = true; threshold = loadLevel(); lastRate = Date.now(); reset();
    frame();
    el.onclick = ev => {
      const t = ev.target.closest("[data-w=toggle],[data-th]");
      if (!t) return;
      if (t.dataset.th) { threshold = +t.dataset.th; Prefs.set("wallet.whale", threshold); reset(); paintCtl(); dirty = true; }
      else if (ctl) { stop(); state = "stopped"; dirty = true; } else { state = "connecting"; start(); dirty = true; }
    };
    start();
    tick = setInterval(() => {
      const now = Date.now();
      if (now - lastRate >= 1000) { rate = msgs * 1000 / (now - lastRate); msgs = 0; lastRate = now; dirty = true; }
      if (dirty) { dirty = false; paintDyn(); }
    }, 500);
    paintDyn();
  }

  function unmount() { stop(); clearInterval(tick); tick = 0; if (host) host.onclick = null; host = null; }
  const relabel = () => { if (host) { frame(); paintDyn(); } };

const DetailView = (() => {

    return `<div class="dh"><div><b class="dsym">${e(r.sym)}</b> <button class="star${on ? " on" : ""}" id="dStar" title="${e(on ? T("Bỏ khỏi danh mục") : T("Thêm vào danh mục"))}">${on ? "★" : "☆"}</button>`

      + `<div class="dp"><b class="${tone}">${e(Fmt.money(r.last) || "—")}</b><span class="${tone}">${e(Fmt.pct(r.pct))} · 24h</span></div></div>`
      + `<div class="dact"><button id="dAlert">🔔 ${e(T("Cảnh báo"))}</button><button id="dCalc">🧮 ${e(T("Tính toán"))}</button><button id="dChart" class="chart-btn">📊 ${e(T("Biểu đồ"))}</button></div>`;
  }

      + (pct != null ? `<i><em style="width:${pct.toFixed(1)}%"></em></i>` : "")
      + `<div class="muted">${e(T("Tổng cung {t} · Tối đa {m}", { t: r.total ? Fmt.big(r.total) : "—", m: r.max ? Fmt.big(r.max) : T("không giới hạn") }))}</div></div>`;

})();
// Toolbar markup of the coin chart: range × candle interval (like the stock board), chart type / scale, indicator picker with

  const DEFAULT = { "1D": "5m", "1W": "1h", "1M": "4h", "3M": "1d", "1Y": "1d", "3Y": "1w", "5Y": "1w", "10Y": "1M", ALL: "1M" };

  const MAX_BARS = 5000;

  const minutes = iv => (INTERVALS.find(i => i[0] === iv) || INTERVALS[5])[2];
  const days = rk => (RANGES.find(r => r[0] === rk) || RANGES[4])[1];
  // Bars needed to cover the range (ALL = as many as the source has, capped).
  const need = (rk, iv) => days(rk) ? Math.ceil(days(rk) * 1440 / minutes(iv)) : MAX_BARS;
  const valid = (rk, iv) => !days(rk) ? minutes(iv) >= 1440 : need(rk, iv) <= MAX_BARS && need(rk, iv) >= 6;
  const fix = (rk, iv) => valid(rk, iv) ? iv : DEFAULT[rk] || "1d";

  const rangeOpts = s => RANGES.map(([k, , l]) => `<option value="${k}"${k === s.range ? " selected" : ""}>${e(T(l))}</option>`).join("");
  const ivOpts = s => INTERVALS.map(([k, l]) => `<option value="${k}"${k === s.interval ? " selected" : ""}${valid(s.range, k) ? "" : " disabled"}>${l}</option>`).join("");

  // Checkbox list: checked = at least one instance on the chart; core indicators (★) first and highlighted; "?" opens the full guide.
  function picker(s, open) {

      + `<button class="iq" data-c="guide" data-v="${k}" title="${e(T("Giải thích chi tiết, ví dụ minh hoạ và cách phối hợp"))}">?</button></div>`;

      .sort((a, b) => imp(b[0]) - imp(a[0])).map(item).join("") + `</div>`;
    const main = group("main", "Trên biểu đồ giá"), own = group("own", "Khung riêng");
    const peaks = `<div class="ipi ipk"><label><input type="checkbox" data-c="peaks"${s.peaks ? " checked" : ""}><span class="ipt"><b>${e(T("Đánh dấu Đỉnh / Đáy"))}</b><em>${e(T("Hiện / ẩn nhãn Đỉnh, Đáy trên biểu đồ giá"))}</em></span></label></div>`
      + `<div class="ipi ipk"><label><input type="checkbox" data-c="crosses"${s.crosses ? " checked" : ""}><span class="ipt"><b><span class="xdot">●</span> ${e(T("Điểm giao cắt quan trọng"))}</b>`
      + `<em>${e(T("Chấm tại chỗ các đường cắt nhau (MA, MACD, RSI 70/30, +DI/−DI…); rê chuột hoặc chạm vào chấm để xem giải thích"))}</em></span></label></div>`;
    return `<details class="ipick"${open ? " open" : ""}><summary title="${e(T("Bật / tắt chỉ báo kỹ thuật"))}">${e(T("+ Chỉ báo…"))} <span class="badge">${s.ind.length}</span></summary>`
      + `<div class="ipop"><p class="iph">${e(T("Tick để hiện trên biểu đồ · ★ = chỉ báo quan trọng · ? = giải thích chi tiết"))}</p>${peaks}${main}${own}</div></details>`;

      + `<label class="chk" title="${e(T("So sánh tối đa 3 coin, cách nhau bằng dấu phẩy (thang % thay đổi)"))}">${e(T("So sánh"))}<input type="text" class="cmpin" data-c="cmp" value="${e(s.cmp.join(", "))}" placeholder="BTC, ETH" spellcheck="false" autocomplete="off"></label>`      + `<span class="seg tools">${TOOLS.map(([k, icon, tip]) => `<button data-c="tool" data-v="${k}" title="${e(T(tip))}"${k === tool ? ' class="on"' : ""}>${icon}</button>`).join("")}`
