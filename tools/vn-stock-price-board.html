<!-- GoatCounter: chỉ gửi path (không query/hash); chạy local đếm thành /local/<tên file> để không lộ thư mục máy -->
<script>
{ const local = !location.protocol.startsWith("http") || ["localhost", "127.0.0.1"].includes(location.hostname);
  const p = local ? "/local/" + location.pathname.split("/").pop() : location.pathname.replace(/index[.]html$/, "");
  const gc = "https://quan111.goatcounter.com/count";
  navigator.sendBeacon?.(gc + "?" + new URLSearchParams({ p, r: document.referrer.split("?")[0], t: document.title, s: screen.width }));
  addEventListener("DOMContentLoaded", () => {
    const el = document.querySelector(".gc-views");
    // GoatCounter cache mỗi URL (kể cả 404) tới 4 giờ ⇒ đổi start mỗi 10 phút; mọi ngày trước khi ra mắt cho cùng tổng
    const start = "2026-10-" + String(Math.floor(Date.now() / 6e5) % 28 + 1).padStart(2, "0");
    if (el) fetch(gc + "er/" + encodeURIComponent(p) + ".json?start=" + start).then(r => r.status === 404 ? { count: "0" } : r.json())
      .then(j => { el.textContent = "👁 " + j.count; el.hidden = false; }).catch(() => {});
  }); }
</script>

<header class="top">
  <a class="btn" href="../index.html">← Trang chủ</a>
  <h1>Bảng giá chứng khoán</h1>
  <button class="more-toggle" title="Thêm thao tác" aria-expanded="false">⋯</button>
  <button id="share" title="Chép link chứa tab + danh mục + tuỳ chọn (nằm sau dấu #, không gửi lên máy chủ)">🔗 Chia sẻ link</button>
  <button id="alertsBtn" title="Cảnh báo giá cho các mã (lưu trong trình duyệt này)">🔔 Cảnh báo</button>
  <button id="calBtn" title="Cổ tức, ĐHCĐ, phát hành sắp tới của các mã trong ★ Danh mục">📅 Lịch sự kiện</button>
  <button id="undo" title="Lấy lại danh mục trước khi nạp mẫu / link chia sẻ" hidden>↶ Khôi phục danh mục trước</button>
  <label class="chk" title="Giao diện sáng / tối">Giao diện
    <select id="theme"><option value="auto">Tự động</option><option value="light">Sáng</option><option value="dark">Tối</option></select></label>
  <span class="seg lang-switch" title="Ngôn ngữ"><span class="gc-views" title="Lượt truy cập (GoatCounter, cập nhật mỗi ~10 phút)" hidden></span><button data-lang="vi">VI</button><button data-lang="en">EN</button></span>
  <nav class="seg wb-nav" id="tabs"></nav>
</header>
<div class="toolbar">
  <button id="saveList" title="Lưu danh mục ★ hiện tại thành bản có tên (trong trình duyệt này, tối đa 30 bản)">💾 Lưu danh mục</button>
  <select id="savedLists" title="Mở lại một danh mục đã lưu"></select>
  <button id="delList" title="Xoá danh mục đang mở khỏi trình duyệt" hidden>🗑</button>
  <label class="btn" title="Nhập danh mục từ file JSON do tool xuất, hoặc TXT / CSV chứa mã (CSV lấy cột đầu)">⬆ Nhập<input type="file" id="importList" accept=".json,.txt,.csv,.tsv,text/plain,application/json"></label>
  <button id="exportList" title="Tải danh mục ★ kèm ghi chú, giá mục tiêu và cảnh báo của các mã thành file JSON">⬇ Xuất danh mục</button>
  <span class="sep"></span>
  <input type="text" id="q" placeholder="Lọc / thêm mã: VNM, FPT…" title="Gõ để lọc bảng; Enter hoặc ★ Thêm để đưa vào danh mục" autocomplete="off" spellcheck="false">
  <button id="add" class="main" title="Thêm các mã đang gõ vào danh mục ★ (lưu trong trình duyệt này)">★ Thêm</button>
  <label class="chk" title="Chu kỳ lấy dữ liệu mới; ngoài giờ giao dịch tự giãn ra 60 giây, tab ẩn thì dừng">Cập nhật
    <select id="rate" data-opt><option value="3">3s</option><option value="5" selected>5s</option><option value="10">10s</option><option value="30">30s</option><option value="off">Tạm dừng</option></select></label>
  <label class="chk" title="Đơn vị khối lượng: lô 10 cổ phiếu như bảng giá các công ty CK, hoặc số cổ phiếu thật">KL
    <select id="unit" data-opt><option value="x10">×10 CP</option><option value="share">Cổ phiếu</option></select></label>
  <label class="chk" title="Hiện cột giá Cao / Thấp / Trung bình"><input type="checkbox" id="hl" data-opt checked>Cao/Thấp</label>
  <label class="chk" title="Hiện cột nhà đầu tư nước ngoài: mua, bán, room"><input type="checkbox" id="fr" data-opt checked>ĐTNN</label>
  <label class="chk" title="Ẩn bước giá 2–3 và cột Trần/Sàn cho bảng gọn"><input type="checkbox" id="compact" data-opt>Gọn</label>
  <label class="chk" title="Hiện cột giá mục tiêu bạn tự đặt (tab Định giá) và % còn lại tới mục tiêu"><input type="checkbox" id="tg" data-opt>Mục tiêu</label>
  <span class="sep"></span>
  <button id="csv" title="Tải bảng đang xem thành CSV (mở bằng Excel)">⬇ CSV</button>

  "Đường trung bình có trọng số: giá càng gần càng nặng ký, phản ứng nhanh hơn SMA.": "Weighted moving average: recent prices weigh more, so it reacts faster than an SMA.",
  "Dải Bollinger: SMA ± 2 độ lệch chuẩn. Giá chạm dải trên là căng, dải dưới là quá bán; dải co hẹp báo sắp có biến động mạnh.": "Bollinger Bands: SMA ± 2 standard deviations. Touching the upper band = stretched, lower band = oversold; a squeeze warns of a big move.",

  "SMA (Simple Moving Average) là giá đóng cửa trung bình của N phiên gần nhất, mỗi phiên có trọng số như nhau. SMA làm mượt biến động để thấy xu hướng.": "SMA (Simple Moving Average) is the average closing price of the last N sessions, each session weighted equally. It smooths out noise so the trend is easier to see.",

  "Phân kỳ: giá tạo đỉnh mới nhưng RSI tạo đỉnh thấp hơn → động lượng yếu dần, cảnh báo đảo chiều.": "Divergence: price makes a new high but RSI makes a lower high → momentum is fading, a reversal warning.",

  "Ví dụ: giá lập đỉnh mới 60 (cao hơn đỉnh 58 trước) nhưng RSI chỉ 64 (thấp hơn 72 lần trước) → phân kỳ âm, nên thận trọng.": "Example: price makes a new high at 60 (above the previous 58) but RSI reaches only 64 (below the previous 72) → bearish divergence, be careful.",
  "Kết hợp đường trung bình: trong xu hướng tăng (giá trên SMA 200) chỉ mua khi RSI về 40–50, không chờ dưới 30.": "With moving averages: in an uptrend (price above SMA 200) buy when RSI dips to 40–50 instead of waiting for < 30.",
  "Kết hợp dải Bollinger hoặc MACD để xác nhận tín hiệu quá mua/quá bán.": "Combine with Bollinger Bands or MACD to confirm overbought / oversold signals.",
  "Trong xu hướng mạnh, RSI có thể ở vùng quá mua/quá bán rất lâu; bán chỉ vì RSI > 70 dễ bỏ lỡ đà tăng.": "In a strong trend RSI can stay overbought / oversold for a long time; selling just because RSI > 70 can miss the rally.",
  "MACD = EMA 12 − EMA 26 (đường MACD); đường tín hiệu là EMA 9 của MACD; histogram = MACD − tín hiệu.": "MACD = EMA 12 − EMA 26 (the MACD line); the signal line is the EMA 9 of MACD; histogram = MACD − signal.",
  "MACD cắt lên đường tín hiệu: động lượng chuyển sang tăng; cắt xuống: chuyển sang giảm.": "MACD crossing above the signal line: momentum turns up; crossing below: momentum turns down.",
  "MACD trên 0: EMA nhanh trên EMA chậm, xu hướng tăng; dưới 0: xu hướng giảm.": "MACD above 0: the fast EMA is above the slow one, uptrend; below 0: downtrend.",
  "Histogram co dần về 0 báo động lượng yếu đi trước khi giao cắt xảy ra.": "A histogram shrinking towards 0 shows momentum weakening before the cross happens.",
  "Ví dụ: MACD của cổ phiếu X cắt lên đường tín hiệu khi cả hai đang dưới 0 → tín hiệu đảo chiều sớm; nếu sau đó MACD vượt lên trên 0 → xu hướng tăng được xác nhận.": "Example: stock X's MACD crosses above its signal line while both are below 0 → early reversal signal; if MACD then rises above 0 → the uptrend is confirmed.",
  "Ví dụ: giá tăng lên đỉnh mới nhưng histogram nhỏ dần → phân kỳ âm, cân nhắc chốt lời.": "Example: price rises to a new high but the histogram keeps shrinking → bearish divergence, consider taking profit.",
  "Kết hợp RSI: MACD cắt lên + RSI vượt 50 cùng lúc là tín hiệu mua chắc hơn.": "With RSI: a MACD cross up together with RSI moving above 50 is a stronger buy signal.",
  "Kết hợp ADX hoặc đường trung bình để lọc tín hiệu khi thị trường đi ngang.": "Combine with ADX or a moving average to filter signals when the market is sideways.",
  "MACD là chỉ báo trễ và cho nhiều giao cắt giả khi giá đi ngang.": "MACD lags and gives many false crosses when price moves sideways.",
  "Stochastic (%K 14, %D 3) cho biết giá đóng cửa đang ở đâu trong biên độ cao–thấp của 14 phiên, từ 0 đến 100.": "Stochastic (%K 14, %D 3) shows where the close sits within the 14-session high–low range, from 0 to 100.",
  "> 80: quá mua; < 20: quá bán.": "> 80: overbought; < 20: oversold.",
  "%K cắt lên %D trong vùng < 20 là tín hiệu mua; %K cắt xuống %D trong vùng > 80 là tín hiệu bán.": "%K crossing above %D below 20 is a buy signal; %K crossing below %D above 80 is a sell signal.",
  "Stochastic nhạy hơn RSI, phù hợp giao dịch ngắn hạn trong biên độ.": "Stochastic is more sensitive than RSI and suits short-term range trading.",
  "Ví dụ: cổ phiếu X đi ngang 20–23, Stochastic xuống 12 rồi %K cắt lên %D khi giá ở 20,2 → mua gần đáy biên độ.": "Example: stock X ranges between 20 and 23; Stochastic drops to 12, then %K crosses above %D with price at 20.2 → buy near the bottom of the range.",
  "Ví dụ: giá lên 23, Stochastic 88 và %K cắt xuống %D → chốt lời gần đỉnh biên độ.": "Example: price reaches 23, Stochastic is 88 and %K crosses below %D → take profit near the top of the range.",
  "Dùng Stochastic để tìm điểm vào theo hướng xu hướng chính (xác định bằng SMA 50 hoặc MACD).": "Use Stochastic to time entries in the direction of the main trend (set by SMA 50 or MACD).",
  "Kết hợp hỗ trợ/kháng cự: tín hiệu quá bán tại vùng hỗ trợ đáng tin hơn.": "Combine with support / resistance: an oversold signal at a support zone is more reliable.",
  "Trong xu hướng mạnh, Stochastic báo quá mua/quá bán liên tục; đừng giao dịch ngược xu hướng chỉ dựa vào nó.": "In strong trends Stochastic signals overbought / oversold all the time; don't trade against the trend on it alone.",
  "ADX (14) đo độ mạnh của xu hướng, không cho biết chiều. +DI và −DI cho biết phe mua hay phe bán mạnh hơn.": "ADX (14) measures trend strength, not direction. +DI and −DI show whether buyers or sellers are stronger.",
  "ADX > 25: có xu hướng rõ; ADX < 20: thị trường đi ngang.": "ADX > 25: a clear trend; ADX < 20: a sideways market.",
  "+DI trên −DI: phe mua mạnh hơn; −DI trên +DI: phe bán mạnh hơn.": "+DI above −DI: buyers are stronger; −DI above +DI: sellers are stronger.",
  "ADX tăng dần là xu hướng đang mạnh lên; ADX quay đầu giảm từ vùng cao là xu hướng yếu dần.": "A rising ADX means the trend is strengthening; ADX turning down from a high level means it is fading.",
  "Ví dụ: ADX của cổ phiếu X tăng từ 18 lên 30 trong khi +DI cắt lên −DI → một xu hướng tăng mới đang hình thành.": "Example: stock X's ADX rises from 18 to 30 while +DI crosses above −DI → a new uptrend is forming.",
  "Ví dụ: ADX ở 15 kéo dài 1 tháng → đi ngang, nên dùng các chỉ báo dao động (RSI, Stochastic) thay vì đường trung bình.": "Example: ADX stays at 15 for a month → sideways; use oscillators (RSI, Stochastic) rather than moving averages.",
  "Dùng ADX làm bộ lọc: chỉ theo tín hiệu của MA/MACD/SAR khi ADX > 25.": "Use ADX as a filter: follow MA / MACD / SAR signals only when ADX > 25.",
  "Khi ADX thấp, ưu tiên giao dịch biên độ với Bollinger hoặc Stochastic.": "When ADX is low, prefer range trading with Bollinger Bands or Stochastic.",
  "ADX trễ và không cho tín hiệu mua/bán trực tiếp; luôn phải xét thêm chiều xu hướng.": "ADX lags and gives no direct buy / sell signal; always check the trend direction too.",
  "ATR (14) là biên độ dao động thực trung bình mỗi phiên, tính cả khoảng trống giá giữa các phiên.": "ATR (14) is the average true range per session, including price gaps between sessions.",
  "ATR cao: cổ phiếu biến động mạnh, rủi ro mỗi phiên lớn; ATR thấp: biến động nhỏ.": "High ATR: the stock is volatile, larger risk per session; low ATR: small moves.",
  "ATR tăng đột ngột thường đi kèm bứt phá hoặc hoảng loạn.": "A sudden jump in ATR often comes with a breakout or panic.",
  "ATR không cho biết chiều giá.": "ATR does not tell direction.",
  "Ví dụ: cổ phiếu X giá 50, ATR 1,5 → mỗi phiên thường dao động khoảng 1,5 (3%); đặt dừng lỗ cách giá vào 2 × ATR = 3, tức 47.": "Example: stock X at 50 with ATR 1.5 → it usually moves about 1.5 (3%) per session; set the stop 2 × ATR = 3 below entry, i.e. 47.",
  "Ví dụ: chia vốn: chấp nhận lỗ 2 triệu mỗi lệnh, dừng lỗ 3 nghìn/cp → mua tối đa khoảng 660 cổ phiếu.": "Example: position sizing: risk 2 million per trade with a 3,000/share stop → buy at most about 660 shares.",
  "Dùng ATR để đặt điểm dừng lỗ cho các tín hiệu từ Donchian, MA hoặc SAR.": "Use ATR to place stops for signals from Donchian, moving averages or SAR.",
  "So sánh ATR với Bollinger: cả hai cùng co hẹp là dấu hiệu sắp có biến động lớn.": "Compare ATR with Bollinger Bands: both contracting together signals a big move is coming.",
  "ATR là thước đo rủi ro, không phải tín hiệu giao dịch.": "ATR is a risk gauge, not a trading signal.",
  "CCI (20) đo độ lệch của giá điển hình so với trung bình của nó, chia cho độ lệch trung bình; dao động quanh 0, thường trong khoảng −200 đến +200.": "CCI (20) measures how far the typical price is from its average, divided by the mean deviation; it oscillates around 0, usually between −200 and +200.",
  "CCI > +100: giá mạnh bất thường (có thể bắt đầu xu hướng tăng hoặc quá mua).": "CCI > +100: unusually strong (a new uptrend starting, or overbought).",
  "CCI < −100: yếu bất thường (bắt đầu giảm hoặc quá bán).": "CCI < −100: unusually weak (a downtrend starting, or oversold).",
  "CCI cắt qua 0 cho thấy giá vượt lên/xuống dưới trung bình.": "CCI crossing 0 shows price moving above / below its average.",
  "Ví dụ: CCI của cổ phiếu X từ −50 vượt lên +100 kèm khối lượng lớn → bắt đầu đợt tăng mạnh.": "Example: stock X's CCI rises from −50 above +100 on heavy volume → a strong rally is starting.",
  "Ví dụ: CCI xuống −180 rồi quay lên trên −100 tại vùng hỗ trợ → tín hiệu hồi phục.": "Example: CCI falls to −180 then climbs back above −100 at a support zone → rebound signal.",
  "Kết hợp đường trung bình dài để chỉ lấy tín hiệu CCI cùng chiều xu hướng lớn.": "Combine with a long moving average to take only CCI signals in the direction of the big trend.",
  "Kết hợp RSI để xác nhận vùng quá mua/quá bán.": "Combine with RSI to confirm overbought / oversold zones.",
  "CCI không có giới hạn trên/dưới cố định nên ngưỡng ±100 cần điều chỉnh theo từng cổ phiếu.": "CCI has no fixed upper / lower bound, so the ±100 thresholds need adjusting per stock.",
  "Williams %R (14) cho biết giá đóng cửa cách đỉnh cao nhất 14 phiên bao xa, từ −100 (đáy biên độ) đến 0 (đỉnh biên độ).": "Williams %R (14) shows how far the close is from the 14-session high, from −100 (bottom of the range) to 0 (top of the range).",
  "> −20: quá mua; < −80: quá bán.": "> −20: overbought; < −80: oversold.",

  "Về bản chất là Stochastic đảo dấu, rất nhạy.": "It is essentially an inverted Stochastic and very sensitive.",

  "Ví dụ: %R ở −5 khi giá chạm kháng cự cũ → cân nhắc chốt lời ngắn hạn.": "Example: %R is −5 as price hits an old resistance → consider short-term profit taking.",
  "Dùng cùng đường trung bình để chỉ mua khi quá bán trong xu hướng tăng.": "Use with a moving average to buy oversold dips only in an uptrend.",

  "> 80: quá mua theo dòng tiền; < 20: quá bán.": "> 80: overbought by money flow; < 20: oversold.",
  "Phân kỳ giữa MFI và giá thường đáng tin hơn RSI vì có yếu tố khối lượng.": "Divergence between MFI and price is often more reliable than with RSI because volume is included.",

  "Ví dụ: MFI 85 sau 5 phiên tăng mạnh khối lượng lớn → cẩn trọng điều chỉnh.": "Example: MFI at 85 after 5 strong high-volume up sessions → beware of a pullback.",

  "Phụ thuộc chất lượng dữ liệu khối lượng; cổ phiếu thanh khoản thấp cho tín hiệu nhiễu.": "Depends on volume data quality; illiquid stocks give noisy signals.",
  "OBV (On-Balance Volume) cộng dồn khối lượng: phiên tăng cộng khối lượng, phiên giảm trừ khối lượng.": "OBV (On-Balance Volume) accumulates volume: up sessions add their volume, down sessions subtract it.",

  "Dùng OBV xác nhận bứt phá của Donchian/Bollinger.": "Use OBV to confirm Donchian / Bollinger breakouts.",

  "ROC > 0: giá cao hơn 12 phiên trước, đà tăng; ROC < 0: đà giảm.": "ROC > 0: price is above where it was 12 sessions ago, upward momentum; ROC < 0: downward momentum.",

  "Ví dụ: ROC của cổ phiếu X từ −8% vượt lên 0 trong khi giá vượt SMA 20 → động lượng chuyển sang tăng.": "Example: stock X's ROC rises from −8% above 0 while price moves above SMA 20 → momentum turns up.",
  "Ví dụ: ROC +25% trong khi bình thường chỉ ±10% → tăng quá nóng, dễ điều chỉnh.": "Example: ROC +25% when it normally stays within ±10% → overheated, prone to a pullback.",
  "Kết hợp đường trung bình để lọc xu hướng.": "Combine with moving averages to filter the trend.",

// Share-link payload codec, same format as mermaid.live: "pako:" + base64url(zlib(JSON)); also reads uncompressed "base64:".
const ShareCodec = (() => {
  const b64url = u8 => {
    let s = "";
    for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode(...u8.subarray(i, i + 0x8000));
    return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  };
  const unb64 = s => { s = s.replace(/-/g, "+").replace(/_/g, "/"); return Uint8Array.from(atob(s + "===".slice((s.length + 3) % 4)), c => c.charCodeAt(0)); };
  const pipe = async (u8, stream) => new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(stream)).arrayBuffer());

  async function encode(obj) {
    return "pako:" + b64url(await pipe(new TextEncoder().encode(JSON.stringify(obj)), new CompressionStream("deflate")));
  }

  // null → not an encoded payload (caller may treat the value as raw text).
  async function decode(s) {
    let bytes;
    if (s.startsWith("pako:")) bytes = await pipe(unb64(s.slice(5)), new DecompressionStream("deflate"));
    else if (s.startsWith("base64:")) bytes = unb64(s.slice(7));
    else return null;
    return JSON.parse(new TextDecoder().decode(bytes));
  }

  return { encode, decode };
})();
// Pure text helpers shared by parsers and tabs (no DOM, so node tests can load them).
const TextUtil = (() => {
  const stripBom = s => s.charCodeAt(0) === 0xfeff ? s.slice(1) : s;
  const lineCol = (s, i) => { const pre = s.slice(0, i).split("\n"); return { line: pre.length, col: pre[pre.length - 1].length + 1 }; };
  const INDENT = { "2": "  ", "3": "   ", "4": "    ", "8": "        ", tab: "\t" };
  const indentUnit = v => INDENT[v] ?? "  ";
  const countLines = s => { let n = 1; for (let i = s.indexOf("\n"); i >= 0; i = s.indexOf("\n", i + 1)) n++; return n; };
  const sizeKb = s => (new Blob([s]).size / 1024).toFixed(1);
  // Excel would drop leading zeros, round >15-digit ids, cut trailing decimals and reformat times → write those as ="…" text.
  const excelExact = v => (/^-?\d+(\.\d+)?$/.test(v) && (String(Number(v)) !== v || v.replace(/\D/g, "").length > 15)) || /^\d{1,2}:\d{2}(:\d{2})?(\.\d+)?$/.test(v);
  return { stripBom, lineCol, indentUnit, countLines, sizeKb, excelExact };
})();
// DOM lookup, HTML escape, clipboard (with fallback), download (revokes Blob URL), file reading, prefixed localStorage.
const $ = id => document.getElementById(id);

const Dom = (() => {
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

  // navigator.clipboard needs a secure context (https, localhost, file://); plain http falls back to execCommand.
  function copy(text) {
    const legacy = () => {
      const ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      let ok = false;
      try { ok = document.execCommand("copy"); } catch { ok = false; }
      ta.remove();
      return ok;
    };
    if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text).then(() => true, legacy);
    return Promise.resolve(legacy());
  }

  function download(text, name, type = "text/plain;charset=utf-8") {
    const url = URL.createObjectURL(new Blob([text], { type }));

const Store = (() => {

  const get = (k, d) => { try { const v = localStorage.getItem(P + k); return v == null ? d : JSON.parse(v); } catch { return d; } };
  const set = (k, v) => { try { localStorage.setItem(P + k, JSON.stringify(v)); return true; } catch { return false; } };
  const del = k => { try { localStorage.removeItem(P + k); } catch { /* storage blocked */ } };
  return { get, set, del };
})();

// Named saves in localStorage (newest first, ≤ 30): 💾 asks a name and saves snapshot() · pick one in the <select> to reopen · 🗑 deletes the open one.
const SavedSessions = ({ select, saveBtn, delBtn, store, key = "saved", snapshot, open, suggestName = () => "", isEmpty = p => !String(p.text || "").trim(), note, keep = () => {} }) => {
  const MAX = 30;
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  let current = null;
  // Stored entries are only trusted after this shape check; the tool's open() still validates its own payload fields.
  const list = () => (store.get(key, []) || []).filter(a => a && typeof a.id === "string" && typeof a.name === "string" && a.payload && typeof a.payload === "object");

  function fill() {
    const items = list(), head = esc(T("📂 Đã lưu ({n})", { n: items.length }));
    select.innerHTML = `<option value="">${head}</option>` +
      items.map(a => `<option value="${esc(a.id)}">${esc(`${a.name} · ${new Date(a.t).toLocaleString(I18n.lang)}`)}</option>`).join("");
    delBtn.hidden = !current;
  }

  function save() {
    const p = snapshot();
    if (isEmpty(p)) return note(T("Chưa có dữ liệu để lưu."), "bad");
    const name = prompt(T("Tên bản lưu (lưu trong trình duyệt này):"), current ? current.name : suggestName());
    if (!name || !name.trim()) return;
    const id = current && current.name === name.trim() ? current.id : Date.now().toString(36);
    const entry = { id, name: name.trim().slice(0, 80), t: Date.now(), payload: p };
    if (!store.set(key, [entry, ...list().filter(a => a.id !== id)].slice(0, MAX))) return note(T("✖ Không lưu được — bộ nhớ trình duyệt đầy hoặc bị chặn."), "bad");
    current = entry;
    fill();
    note(T("✔ Đã lưu “{name}”.", { name: entry.name }), "good");
  }

  function openId(id) {
    const a = list().find(x => x.id === id);
    if (!a) return;
    keep();
    open(a.payload);
    current = a;
    fill();
    note(T("Đã mở “{name}”.", { name: a.name }), "muted");
  }

  function remove() {
    if (!current || !confirm(T("Xoá “{name}” khỏi trình duyệt?", { name: current.name }))) return;
    store.set(key, list().filter(a => a.id !== current.id));
    current = null;
    fill();
  }

  select.onchange = () => { const v = select.value; select.value = ""; if (v) openId(v); };
  saveBtn.onclick = save;
  delBtn.onclick = remove;
  fill();
  return { fill, forget: () => { current = null; fill(); } };
};
// Phone portrait (phone-portrait-layout.css): .pane-switch buttons scroll the .pane-scroller right after them; data-pane-go jumps to a pane; ⋯ opens the header actions.
const PhoneLayout = (() => {
  const switches = [...document.querySelectorAll(".pane-switch")];
  const visible = () => switches.find(sw => sw.offsetParent);

  function sync(sw) {
    const box = sw.nextElementSibling, i = box.clientWidth ? Math.round(box.scrollLeft / box.clientWidth) : 0;
    [...sw.children].forEach((b, k) => b.classList.toggle("on", k === i));
  }
  function go(sw, i) { const box = sw.nextElementSibling; box.scrollLeft = i * box.clientWidth; }

  const showLast = () => { const sw = visible(); if (sw) go(sw, sw.children.length - 1); };

  for (const sw of switches) {
    const box = sw.nextElementSibling;
    box.addEventListener("scroll", () => sync(sw), { passive: true });
    new ResizeObserver(() => sync(sw)).observe(box);
    sw.addEventListener("click", e => { if (e.target !== sw) go(sw, [...sw.children].indexOf(e.target)); });
  }
  document.addEventListener("click", e => { const b = e.target.closest("button[data-pane-go]"); if (b) show(+b.dataset.paneGo); });
  document.addEventListener("change", e => { if (e.target.matches("select[data-pane-go], input[data-pane-go]")) show(+e.target.dataset.paneGo); });

  return { show, showLast };
})();

const WatchParse = (() => {
  const SYM = /^[A-Z0-9]{3,10}$/;
  const isSymbol = s => typeof s === "string" && SYM.test(s);

  function parse(text) {
    const symbols = [], bad = [], seen = new Set();
    for (const raw of String(text ?? "").split(/[\s,;|]+/)) {
      if (!raw) continue;
      const s = raw.toUpperCase();
      if (!SYM.test(s)) { bad.push(raw); continue; }
      if (!seen.has(s)) { seen.add(s); symbols.push(s); }
    }
    return { symbols, bad };
  }

  // Untrusted arrays (share link, storage) → valid unique symbols only, capped so a link cannot flood the feed.
  const clean = (arr, max = 300) => Array.isArray(arr) ? [...new Set(arr.filter(isSymbol))].slice(0, max) : [];

  return { parse, clean, isSymbol };
})();
// Pure VPS datafeed → board model. Prices in thousand VND; volumes stay in the feed's unit (10 shares).
const QuoteModel = (() => {
  const num = v => { const n = parseFloat(v); return Number.isFinite(n) ? n : 0; };
  const cents = x => Math.round(x * 100);
  const EX = { STO: "HOSE", STX: "HNX", UPX: "UPCOM" };

  // "54.2|6850|d" → { p: 54.2, v: 6850 }; ATO/ATC orders keep their label as p.
  function level(s) {
    const [p = "", v = ""] = String(s ?? "").split("|");
    return { p: /^[A-Z]{2,4}$/.test(p) ? p : num(p), v: num(v) };
  }

  function quote(r) {
    const ref = num(r.r), last = num(r.lastPrice);
    const chg = last ? (cents(last) - cents(ref)) / 100 : 0;
    return {
      sym: String(r.sym || ""), ex: EX[r.marketId] || String(r.marketId || ""), type: String(r.sType || "S"),
      ceil: num(r.c), floor: num(r.f), ref,
      bids: [level(r.g1), level(r.g2), level(r.g3)], asks: [level(r.g4), level(r.g5), level(r.g6)],
      last, lastVol: num(r.lastVolume), chg, pct: last && ref ? chg / ref * 100 : 0,
      totVol: num(r.lot), open: num(r.openPrice), high: num(r.highPrice), low: num(r.lowPrice), avg: num(r.avePrice),
      fBuy: num(r.fBVol), fSell: num(r.fSVolume), room: num(r.fRoom),
      cw: r.sType === "W" ? { underlying: String(r.CWUnderlying || ""), issuer: String(r.CWIssuerName || ""), strike: num(r.CWExcersisePrice),
        ratio: String(r.CWExerciseRatio || ""), maturity: String(r.CWMaturityDate || ""), lastTrade: String(r.CWLastTradingDate || "") } : null,
    };
  }

  // Board colour of a price against the symbol's ceiling / floor / reference.
  function tone(p, q) {
    if (typeof p === "string") return "ref";
    if (!p || !q.ref) return "";
    const c = cents(p);
    if (q.ceil && c >= cents(q.ceil)) return "ceil";
    if (q.floor && c <= cents(q.floor)) return "floor";
    return c > cents(q.ref) ? "up" : c < cents(q.ref) ? "down" : "ref";
  }

  const INDEX_CODES = { "10": "VNINDEX", "11": "VN30", "02": "HNX", "03": "UPCOM" };
  // oIndex is the previous close; ot = "chg|pct%|value(million VND)|advancers|decliners|unchanged" (chg/pct unsigned, so recomputed).
  function index(r) {

  }

  const trade = r => ({ time: String(r.time || ""), price: num(r.lastPrice), vol: num(r.lastVol), side: r.side === "B" || r.side === "S" ? r.side : "" });

  // Active buy / sell volume (B = buyer hit the ask, S = seller hit the bid; "" = auction / unknown).
  function tradeSides(trades) {
    const s = { B: 0, S: 0, "": 0 };

  }

  function phase(now = new Date()) {
    const vn = new Date(now.getTime() + 7 * 3600e3), day = vn.getUTCDay(), m = vn.getUTCHours() * 60 + vn.getUTCMinutes();
    if (day === 0 || day === 6) return "closed";
    if (m < 540) return "pre";
    if (m < 555) return "ato";
    if (m < 690) return "open";
    if (m < 780) return "break";
    if (m < 870) return "open";
    if (m < 885) return "atc";
    if (m < 900) return "plo";

  }

  const vnDate = (now = new Date()) => new Date(now.getTime() + 7 * 3600e3).toISOString().slice(0, 10).replace(/-/g, "");

  return { quote, level, tone, index, trade, tradeSides, phase, isLive, vnDate, INDEX_CODES };
})();

  function minuteBars(trades) {

      b.price = t.price; b.vol += t.vol;

    const ticks = [540, 600, 660, 780, 840, 900].map(m => `<text x="${x(m)}" y="${h - 5}" class="ax" text-anchor="middle">${Math.floor(m / 60)}:${String(m % 60).padStart(2, "0")}</text>`).join("");

      + `<line x1="${pad.l}" x2="${w - pad.r}" y1="${y(q.ref)}" y2="${y(q.ref)}" class="refline"/>`
      + `<path d="${line}" class="pl ${tone}"/><g class="vb">${vols}</g>${ticks}`

  }

  return { minuteBars, intraday, spark, toMin };

    for (const q of quotes) {

      if (!q.last) { b.none++; continue; }
      const t = QuoteModel.tone(q.last, q);
      b[t === "ref" ? "same" : t || "none"]++;

  }

    quality: { label: "Chất lượng (ROE > 20%, vốn hoá > 10.000 tỷ)", c: { roeMin: 20, mcapMin: 10000 } },

const AlertRule = (() => {

    const v = +a.value;

    if (a.type === "pctUp") return q.pct >= Math.abs(v);
    return q.pct <= -Math.abs(v);
  }

// Pure watchlist file format: export JSON (tickers + their notes / alerts) and import from that JSON, plain text or CSV.
const WatchFile = (() => {
  const APP = "vn-stock-price-board", VERSION = 1, MAX = 300;

  // { watch, notes: { sym: { text, target } }, alerts: [...] } → pretty JSON; notes / alerts limited to the exported tickers.
  function build({ watch, notes = {}, alerts = [], now = new Date() }) {
    const set = new Set(watch);
    return JSON.stringify({ app: APP, version: VERSION, exported: now.toISOString(), watch,
      notes: Object.fromEntries(Object.entries(notes).filter(([s]) => set.has(s))),
      alerts: alerts.filter(a => set.has(a.sym)).map(({ sym, type, value }) => ({ sym, type, value })) }, null, 2);
  }

  // CSV / TSV (comma, semicolon or tab on several lines) → first cell of each line; otherwise every token.
  function textTokens(text) {
    const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    const tabular = lines.length > 1 && lines.filter(l => /[,;\t]/.test(l)).length >= lines.length / 2;
    return tabular ? lines.map(l => l.split(/[,;\t]/)[0].replace(/^"|"$/g, "").trim()) : [text];
  }

  function parse(text) {

    if (!src) throw new Error("empty");

    if (obj) {
      const list = Array.isArray(obj) ? obj : Array.isArray(obj.watch) ? obj.watch : [];
      const r = WatchParse.parse(list.filter(s => typeof s === "string").join(" "));
      const notes = obj.notes && typeof obj.notes === "object" && !Array.isArray(obj.notes) ? obj.notes : {};

    }

})();

const Feed = (() => {

    try {

      const text = await r.text();

    } finally { clearTimeout(timer); }
  }

  const list = async key => [...new Set(arr(await get("getlistckindex/" + encodeURIComponent(key))).filter(WatchParse.isSymbol))];

  async function quotes(symbols) {
    const parts = [];
    for (let i = 0; i < symbols.length; i += CHUNK) parts.push(get("getliststockdata/" + symbols.slice(i, i + CHUNK).join(",")));

  }

  const indices = async () => arr(await get("getlistindexdetail/" + Object.keys(QuoteModel.INDEX_CODES).join(","))).map(QuoteModel.index);
  // Whole-day match history (FPT ≈ 8k trades / 3.5 MB, not gzipped) → load on demand only.
  const trades = async sym => arr(await get("getliststocktrade/" + sym, 30000)).map(QuoteModel.trade);
  const universe = async () => arr(await get("getlistallstock", 30000));

  return { list, quotes, indices, trades, universe };
})();

const Universe = (() => {
  const KEY = "web_tool.vn-stock-price-board.universe";
  let map = new Map(), pending = null;

  function fill(rows) {
    map = new Map();
    for (const r of rows) if (r && WatchParse.isSymbol(r.stock_code))
      map.set(r.stock_code, { vi: String(r.name_vn || ""), en: String(r.name_en || ""), ex: String(r.post_to || ""), type: String(r.type || "") });
  }

  const load = () => pending ||= loadOnce().catch(e => { pending = null; throw e; });
  async function loadOnce() {
    const day = QuoteModel.vnDate();
    try { const c = JSON.parse(localStorage.getItem(KEY) || "null"); if (c && c.day === day && Array.isArray(c.rows)) { fill(c.rows); return; } } catch { /* storage blocked */ }
    const rows = await Feed.universe();
    fill(rows);
    const slim = rows.map(r => ({ stock_code: r.stock_code, name_vn: r.name_vn, name_en: r.name_en, post_to: r.post_to, type: r.type }));

  return { load, name, ofType, has, ready };

const History = (() => {
  const BASE = "https://dchart-api.vndirect.com.vn/dchart/history", cache = new Map(), TTL = 60e3;

  // res: "1" | "5" | "15" | "30" | "60" | "D" → [{ time (unix s, UTC), open, high, low, close, volume }] ascending.
  async function load(sym, res, from, to) {
    const key = `${sym}|${res}|${from}`, hit = cache.get(key);
    if (hit && Date.now() - hit.at < TTL) return hit.bars;
    const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 30000);
    try {
      const r = await fetch(`${BASE}?resolution=${res}&symbol=${encodeURIComponent(sym)}&from=${from}&to=${to}`, { signal: ctl.signal, cache: "no-store" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      const d = await r.json();
      const bars = [];
      if (d && d.s === "ok" && Array.isArray(d.t)) for (let i = 0; i < d.t.length; i++) {
        const b = { time: +d.t[i], open: +d.o[i], high: +d.h[i], low: +d.l[i], close: +d.c[i], volume: +d.v[i] || 0 };
        if (Number.isFinite(b.time) && [b.open, b.high, b.low, b.close].every(Number.isFinite) && (!bars.length || b.time > bars[bars.length - 1].time)) bars.push(b);
      }
      cache.set(key, { at: Date.now(), bars });
      return bars;
    } finally { clearTimeout(timer); }
  }

  return { load };
})();
// VNDirect finfo API (public, CORS *): valuation ratios, news, financial statements, corporate events, profile, shareholders, analyst calls.
const Finfo = (() => {
  const BASE = "https://api-finfo.vndirect.com.vn/v4/", cache = new Map(), TTL = 5 * 60e3;
  const RATIOS = ["MARKETCAP", "PRICE_TO_EARNINGS", "PRICE_TO_BOOK", "PRICE_TO_SALES", "EPS_TR", "BVPS_CR", "ROAE_TR_AVG5Q", "ROAA_TR_AVG5Q", "ROIC_TR_AVG5Q",
    "DIVIDEND_YIELD", "BETA", "OUTSTANDING_SHARES", "NMVOLUME_AVG_CR_10D", "PRICE_HIGHEST_CR_52W", "PRICE_LOWEST_CR_52W"];

  async function get(path) {
    const hit = cache.get(path);
    if (hit && Date.now() - hit.at < TTL) return hit.v;
    const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 20000);
    try {
      const r = await fetch(BASE + path, { signal: ctl.signal });
      if (!r.ok) throw new Error("HTTP " + r.status);
      const j = await r.json(), v = { data: Array.isArray(j && j.data) ? j.data.filter(x => x && typeof x === "object") : [], total: +(j && j.totalElements) || 0 };
      cache.set(path, { at: Date.now(), v });
      return v;
    } finally { clearTimeout(timer); }
  }
  const q = s => encodeURIComponent(s);

  async function ratios(sym) {
    const r = await get(`ratios/latest?filter=ratioCode:${RATIOS.join(",")}&where=code:${q(sym)}&order=reportDate&fields=ratioCode,value,reportDate`);
    return Object.fromEntries(r.data.filter(x => x && RATIOS.includes(x.ratioCode) && Number.isFinite(+x.value)).map(x => [x.ratioCode, +x.value]));
  }
  // News exists in Vietnamese only (locale EN is empty).
  const news = (sym, page = 1, size = 10) => get(`news?q=tagCodes:${q(sym)}&size=${size}&page=${page}&sort=newsDate:desc~newsTime:desc&fields=newsTitle,newsAbstract,newsSource,newsDate,newsTime,newsUrl,dstockUrl`);
  const events = (sym, locale) => get(`events?q=code:${q(sym)}~locale:${locale === "en" ? "EN_GB" : "VN"}&size=40&sort=disclosureDate:desc`).then(r => r.data);
  const profile = sym => get(`company_profiles?q=code:${q(sym)}`).then(r => r.data[0] || null);
  const shareholders = sym => get(`shareholders?q=code:${q(sym)}&size=15&sort=ownershipPct:desc`).then(r => r.data);
  const recommendations = sym => get(`recommendations?q=code:${q(sym)}&size=30&sort=reportDate:desc`).then(r => r.data);

  // Statement line items of every model this ticker uses (bank / securities / insurance / normal companies differ).
  const models = sym => get(`financial_models?q=codeList:${q(sym)}&size=3000&sort=displayOrder:asc&fields=modelType,modelTypeName,note,formType,itemCode,itemVnName,itemEnName,displayLevel,displayOrder`).then(r => r.data);
  const values = (sym, modelType, period, since) =>
    get(`financial_statements?q=code:${q(sym)}~reportType:${period === "year" ? "ANNUAL" : "QUARTER"}~modelType:${modelType}~fiscalDate:gte:${since}&size=6000&fields=itemCode,numericValue,fiscalDate`).then(r => r.data);

  // Selected line items across all models (codes are shared: 23000 NPAT parent, 14400 total assets…); report: "ANNUAL" | "QUARTER" | "ESTIMATION".
  const items = (sym, report, codes, since) =>
    get(`financial_statements?q=code:${q(sym)}~reportType:${report}~itemCode:${codes.join(",")}~fiscalDate:gte:${since}&size=2000&sort=fiscalDate:desc&fields=itemCode,numericValue,fiscalDate`).then(r => r.data);
  // Daily ratio history, e.g. PRICE_TO_EARNINGS + PRICE_TO_BOOK for 5 years → { CODE: [{ date, value }] ascending }.
  async function ratioHistory(sym, codes, since) {
    const r = await get(`ratios?q=code:${q(sym)}~ratioCode:${codes.join(",")}~reportDate:gte:${since}&sort=reportDate:asc&size=5000&fields=ratioCode,reportDate,value`);
    const out = Object.fromEntries(codes.map(c => [c, []]));
    for (const x of r.data) if (out[x.ratioCode] && Number.isFinite(+x.value)) out[x.ratioCode].push({ date: String(x.reportDate), value: +x.value });
    return out;
  }
  const foreigns = (sym, size = 120) => get(`foreigns?q=code:${q(sym)}&size=${size}&sort=tradingDate:desc&fields=tradingDate,netVal,netVol,buyVal,sellVal,currentRoom,totalRoom`).then(r => r.data);
  // Cash dividends (đ/share per payment) — Vietnamese locale carries the numbers regardless of UI language.
  const dividends = sym => get(`events?q=code:${q(sym)}~locale:VN~type:DIVIDEND&size=100&sort=effectiveDate:desc&fields=dividend,divYear,divPeriod,effectiveDate,ratio`).then(r => r.data);

  // ICB sectors of one level (1: 10 industries · 2: 19 supersectors · 3: 42 sectors), each with its ticker list.
  const industries = level => get(`industry_classification?q=industryLevel:${level}&size=500&fields=industryCode,vietnameseName,englishName,codeList,higherLevelCode`).then(r => r.data);
  // Latest ratios of many tickers in one call (≤ ~100 codes keeps the URL short and the reply fast).
  const ratiosBulk = (codes, ratioCodes) => get(`ratios/latest?filter=ratioCode:${ratioCodes.join(",")}&where=code:${codes.map(q).join(",")}&order=reportDate&size=1000&fields=code,ratioCode,value`).then(r => r.data);

  return { ratios, news, events, profile, shareholders, recommendations, models, values, items, ratioHistory, foreigns, dividends, industries, ratiosBulk };
})();
// Whole-market data for the market / screener / sector tabs: listed tickers, ICB sectors, bulk valuation ratios (cached per Vietnam date).
const Market = (() => {
  const KEY = "web_tool.vn-stock-price-board.market.", RATIOS = ["MARKETCAP", "PRICE_TO_EARNINGS", "PRICE_TO_BOOK", "ROAE_TR_AVG5Q", "DIVIDEND_YIELD"];
  const CHUNK = 100, PARALLEL = 6;
  let all = null, sectors = null, sectorsP = null, ratios = null, ratiosP = null, progress = null;
  const listeners = [];

  const cacheGet = k => { try { const c = JSON.parse(localStorage.getItem(KEY + k) || "null"); return c && c.day === QuoteModel.vnDate() ? c.v : null; } catch { return null; } };
  const cacheSet = (k, v) => { try { localStorage.setItem(KEY + k, JSON.stringify({ day: QuoteModel.vnDate(), v })); } catch { /* quota → refetch next visit */ } };

  async function allSymbols() {
    if (all) return all;
    const lists = await Promise.all(["hose", "hnx", "upcom"].map(Feed.list));
    if (lists.some(l => !l.length)) throw new Error("empty exchange list");
    return (all = [...new Set(lists.flat())]);
  }

  // { levels: { 1: [...], 2: [...], 3: [...] } as { code, vi, en, parent, codes[] }, of: sym → { 1, 2, 3 } sector codes }.
  function sectorsLoad() {
    return sectorsP ||= (async () => {
      let raw = cacheGet("sectors");
      if (!raw) {
        raw = await Promise.all([1, 2, 3].map(Finfo.industries));
        if (raw.some(l => !l.length)) throw new Error("empty ICB level");
        cacheSet("sectors", raw);
      }
      const levels = {}, of = new Map();
      raw.forEach((rows, i) => {
        levels[i + 1] = rows.filter(r => r && r.industryCode).map(r => ({ code: String(r.industryCode), vi: String(r.vietnameseName || ""), en: String(r.englishName || ""),
          parent: String(r.higherLevelCode || ""), codes: String(r.codeList || "").split(",").filter(WatchParse.isSymbol) }));
        for (const s of levels[i + 1]) for (const c of s.codes) (of.get(c) || of.set(c, {}).get(c))[i + 1] = s.code;
      });
      return (sectors = { levels, of });
    })().catch(e => { sectorsP = null; throw e; });
  }

  const sectorName = (code, lang) => { for (const l of [1, 2, 3]) { const s = sectors?.levels[l].find(x => x.code === code); if (s) return lang === "en" && s.en ? s.en : s.vi; } return code; };
  const sectorCodes = async code => { await sectorsLoad(); for (const l of [1, 2, 3]) { const s = sectors.levels[l].find(x => x.code === code); if (s) return s.codes.slice().sort(); } return []; };

  // sym → { mcap, pe, pb, roe, dy } for the given tickers, fetched in chunks with a small worker pool; onStep(done, total).
  async function ratiosFor(codes, onStep) {
    const chunks = [];
    for (let i = 0; i < codes.length; i += CHUNK) chunks.push(codes.slice(i, i + CHUNK));
    const out = new Map();
    let next = 0, done = 0, failed = 0;
    const worker = async () => {
      while (next < chunks.length) {
        const rows = await Finfo.ratiosBulk(chunks[next++], RATIOS).catch(e => { console.warn("Market.ratiosFor - chunk fail", e); return []; });
        if (!rows.length) failed++;
        for (const r of rows) {
          if (!WatchParse.isSymbol(r.code) || !Number.isFinite(+r.value)) continue;
          const o = out.get(r.code) || out.set(r.code, {}).get(r.code), k = { MARKETCAP: "mcap", PRICE_TO_EARNINGS: "pe", PRICE_TO_BOOK: "pb", ROAE_TR_AVG5Q: "roe", DIVIDEND_YIELD: "dy" }[r.ratioCode];
          if (k) o[k] = +r.value;
        }
        if (onStep) onStep(++done, chunks.length);
      }
    };
    await Promise.all(Array.from({ length: Math.min(PARALLEL, chunks.length) }, worker));
    if (chunks.length && failed === chunks.length) throw new Error("all ratio chunks failed");
    out.partial = failed > 0;
    return out;
  }

  // Whole market once per day (~1,500 tickers, ~15–30 s the first time); listeners get progress and completion.
  function ratiosAll() {

    return ratiosP ||= (async () => {
      const cached = cacheGet("ratios");
      if (cached) return (ratios = new Map(Object.entries(cached)));
      const syms = await allSymbols();
      const m = await ratiosFor(syms, (d, n) => { progress = { done: d, total: n }; listeners.forEach(f => f()); });

      progress = null;
      // Partial data is shown now but the next market / screener visit fetches again.
      if (m.partial) ratiosP = null;
      return (ratios = m);
    })().catch(e => { ratiosP = null; progress = null; throw e; }).finally(() => listeners.forEach(f => f()));
  }

  return { allSymbols, sectorsLoad, sectorName, sectorCodes, ratiosFor, ratiosAll, sectors: () => sectors, ratios: () => ratios, progress: () => progress,
    onChange: f => listeners.push(f) };
})();

// ★ watchlist + board options in localStorage (prefixed per tool); every access survives blocked storage.
const Prefs = (() => {
  const P = "web_tool.vn-stock-price-board.";
  const get = (k, d) => { try { const v = localStorage.getItem(P + k); return v == null ? d : JSON.parse(v); } catch { return d; } };
  const set = (k, v) => { try { localStorage.setItem(P + k, JSON.stringify(v)); return true; } catch { return false; } };
  return { get, set };
})();

const Watch = (() => {
  const DEFAULT = ["VNM", "FPT", "HPG", "VCB", "MWG", "SSI"];
  let list = WatchParse.clean(Prefs.get("watch", DEFAULT));
  let backup = Prefs.get("watchBackup", null);
  const listeners = [];
  const changed = () => { Prefs.set("watch", list); listeners.forEach(f => f()); };

  const all = () => [...list];
  const has = s => list.includes(s);
  function add(symbols) { const fresh = symbols.filter(s => !list.includes(s)); list = list.concat(fresh); if (fresh.length) changed(); return fresh; }
  function remove(symbols) { const n = list.length; list = list.filter(s => !symbols.includes(s)); if (list.length !== n) changed(); }
  const toggle = s => has(s) ? (remove([s]), false) : (add([s]), true);

  // Demo / share link replace the list but keep the previous one for "↶ Khôi phục danh mục trước".
  function replace(symbols) {
    const next = WatchParse.clean(symbols);
    if (next.join() === list.join()) return false;
    // Keep the user's own list across several samples / links and across reloads.
    if (!backup) { backup = list; Prefs.set("watchBackup", backup); }
    list = next; changed();
    return true;
  }
  function undo() { if (!backup) return; list = WatchParse.clean(backup); backup = null; Prefs.set("watchBackup", null); changed(); }

  return { all, has, add, remove, toggle, replace, undo, hasBackup: () => !!backup, onChange: f => listeners.push(f) };
})();
// Personal data kept in this browser only: price alerts and per-ticker notes + own target price.
const Alerts = (() => {
  const MAX = 100;
  const id = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const clean = arr => Array.isArray(arr) ? arr.filter(a => AlertRule.valid(a) && WatchParse.isSymbol(a.sym)).slice(0, MAX)
    .map(a => ({ id: /^[a-z0-9]{4,20}$/.test(a.id || "") ? a.id : id(), sym: a.sym, type: a.type, value: +a.value, fired: /^\d{8}$/.test(a.fired || "") ? a.fired : "" })) : [];
  let list = clean(Prefs.get("alerts", []));
  const listeners = [];
  const changed = () => { Prefs.set("alerts", list); listeners.forEach(f => f()); };
  // Another tab may have changed the saved list → re-read before every write and follow its storage events.
  const reload = () => { list = clean(Prefs.get("alerts", [])); };
  addEventListener("storage", e => { if (e.key && e.key.endsWith(".alerts")) { reload(); listeners.forEach(f => f()); } });

  function add(sym, type, value) {
    reload();
    const a = { id: id(), sym, type, value: +value, fired: "" };
    // Indices / typos would be polled forever without ever firing.
    if (!AlertRule.valid(a) || !WatchParse.isSymbol(sym) || (Universe.ready() && !Universe.has(sym)) || list.length >= MAX) return false;
    list = [...list, a]; changed();
    return true;
  }
  const remove = aid => { reload(); list = list.filter(a => a.id !== aid); changed(); };
  const symbols = () => [...new Set(list.map(a => a.sym))];

  // Called after every poll with all fetched quotes; returns the alerts that just fired.
  function check(quotes) {
    reload();
    const r = AlertRule.check(list, quotes, QuoteModel.vnDate());
    if (r.hits.length) { list = r.list; changed(); }
    return r.hits;
  }

  return { add, remove, symbols, check, all: () => list.slice(), onChange: f => listeners.push(f) };
})();

const Notes = (() => {
  const clean = raw => {
    const out = {};
    if (raw && typeof raw === "object") for (const [k, v] of Object.entries(raw)) {
      if (!WatchParse.isSymbol(k) || !v || typeof v !== "object") continue;
      const text = typeof v.text === "string" ? v.text.slice(0, 2000) : "", target = Number.isFinite(+v.target) && +v.target > 0 ? +v.target : null;
      if (text || target) out[k] = { text, target };
    }
    return out;
  };
  let all = clean(Prefs.get("notes", {}));
  addEventListener("storage", e => { if (e.key && e.key.endsWith(".notes")) all = clean(Prefs.get("notes", {})); });

  const get = sym => all[sym] || { text: "", target: null };
  // Empty text + no target removes the entry.
  function set(sym, text, target) {
    const c = clean({ [sym]: { text, target } })[sym];
    all = clean(Prefs.get("notes", {}));
    if (c) all[sym] = c; else delete all[sym];
    Prefs.set("notes", all);
  }
  // Board column support: copy the own target onto each quote object (quotes are rebuilt every poll).
  const decorate = quotes => { for (const q of quotes) q.target = all[q.sym]?.target ?? null; };

  return { get, set, decorate, entries: () => ({ ...all }) };
})();
// Price table: grouped 2-row header, rows keyed by symbol, per-cell updates that flash only the cells whose text changed.
const BoardView = (() => {
  let table, h = {}, cols = [], opts = {}, members = "", rows = new Map(), sel = "", sort = { key: "", dir: 0 };

  const cellCls = (i, c) => [cols[i].cls, c.c].filter(Boolean).join(" ");
  const arrow = c => sort.key === c.sort && c.sort ? (sort.dir > 0 ? " ▲" : " ▼") : "";
  const th = (c, extra = "") => `<th${extra} class="${[c.cls, c.sort ? "so" : ""].filter(Boolean).join(" ")}"${c.sort ? ` data-sort="${c.sort}"` : ""}>${Dom.esc(T(c.h, { n: c.n }))}${arrow(c)}</th>`;

  function head() {
    const g = [`<th rowspan="2" class="st" title="${Dom.esc(T("Thêm / bỏ khỏi danh mục"))}">★</th>`], row2 = [];
    for (let i = 0; i < cols.length;) {
      const c = cols[i];
      if (!c.g) { g.push(th(c, ' rowspan="2"')); i++; continue; }
      let n = 0;
      while (i + n < cols.length && cols[i + n].g === c.g) row2.push(th(cols[i + n++]));
      g.push(`<th colspan="${n}" class="grp${c.cls === "mt" ? " mt" : ""}">${Dom.esc(T(c.g))}</th>`);
      i += n;
    }
    return `<thead><tr>${g.join("")}</tr><tr>${row2.join("")}</tr></thead>`;
  }

  function star(sym) {
    const on = Watch.has(sym), tip = on ? T("Bỏ khỏi danh mục") : T("Thêm vào danh mục");
    return `<button class="star${on ? " on" : ""}" title="${Dom.esc(tip)}">${on ? "★" : "☆"}</button>`;
  }

  function rowHtml(q) {
    const cells = BoardCols.rowCells(q, opts).map((c, i) => `<td class="${cellCls(i, c)}"${i ? "" : ` title="${Dom.esc(h.name(q.sym))}"`}>${Dom.esc(c.t)}</td>`);
    return `<tr data-sym="${Dom.esc(q.sym)}"${q.sym === sel ? ' class="sel"' : ""}><td class="st">${star(q.sym)}</td>${cells.join("")}</tr>`;
  }

  function rebuild(list) {
    table.innerHTML = head() + `<tbody>${list.map(rowHtml).join("")}</tbody>`;
    rows = new Map([...table.tBodies[0].rows].map(tr => [tr.dataset.sym, tr]));
  }

  function update(list) {
    const body = table.tBodies[0], flashed = [];
    if ([...body.rows].some((tr, i) => tr.dataset.sym !== list[i].sym)) body.append(...list.map(q => rows.get(q.sym)));
    for (const q of list) {
      const tr = rows.get(q.sym);
      BoardCols.rowCells(q, opts).forEach((c, i) => {
        const td = tr.cells[i + 1], cls = cellCls(i, c);
        if (td.textContent !== c.t) { td.textContent = c.t; td.className = cls; if (c.t) flashed.push(td); }
        else if (td.className !== cls && !td.classList.contains("fl")) td.className = cls;
      });
    }
    flashed.forEach(td => td.classList.add("fl"));
    if (flashed.length) setTimeout(() => flashed.forEach(td => td.classList.remove("fl")), 900);
  }

  // force: columns / language / sort changed → new header and rows.
  function render(quotes, o, force = false) {
    const list = BoardCols.sortQuotes(quotes, sort.key, sort.dir), m = quotes.map(q => q.sym).sort().join();
    if (force || m !== members || o !== opts) { opts = o; cols = BoardCols.visible(o); members = m; rebuild(list); }
    else update(list);
  }

  function message(text) {
    members = ""; rows = new Map();
    table.innerHTML = `<tbody><tr><td class="empty">${Dom.esc(text)}</td></tr></tbody>`;
  }

  function select(sym) {
    sel = sym;
    for (const [s, tr] of rows) tr.classList.toggle("sel", s === sym);
    const tr = rows.get(sym);
    if (tr) tr.scrollIntoView({ block: "nearest" });
  }

  const refreshStars = () => { for (const [s, tr] of rows) tr.cells[0].innerHTML = star(s); };
  const order = () => [...(table.tBodies[0]?.rows || [])].map(tr => tr.dataset.sym).filter(Boolean);

  // Sort cycle per column: descending → ascending → feed order (symbols ascend first since A→Z is the natural start).
  function cycleSort(key) {
    const first = key === "sym" ? 1 : -1;
    sort = sort.key !== key ? { key, dir: first } : sort.dir === first ? { key, dir: -first } : { key: "", dir: 0 };
  }

  function init(el, handlers) {
    table = el; h = handlers;
    table.addEventListener("click", e => {
      const s = e.target.closest("th[data-sort]");
      if (s) { cycleSort(s.dataset.sort); h.onSort(); return; }
      const tr = e.target.closest("tr[data-sym]");
      if (!tr) return;
      if (e.target.closest("button.star")) h.onStar(tr.dataset.sym);
      else h.onSelect(tr.dataset.sym, true);
    });
  }

  return { init, render, message, select, refreshStars, order, getSort: () => ({ ...sort }), setSort: s => { sort = s; } };
})();
// Index cards (VNINDEX, VN30, HNX, UPCOM): value, change, breadth and a sparkline built from the polls seen today.
const IndexStrip = (() => {

  function remember(list) {
    for (const x of list) {
      const m = ChartSvg.toMin(x.time), pts = points[x.code] ||= [];
      if (m < 540 || !x.value || (pts.length && pts[pts.length - 1].m >= m)) continue;
      pts.push({ m, v: x.value });
    }
    try { sessionStorage.setItem(KEY, JSON.stringify({ day: QuoteModel.vnDate(), pts: points })); } catch { /* blocked */ }
  }

  const tone = x => x.chg > 0 ? "up" : x.chg < 0 ? "down" : "ref";

  function card(x) {
    const pts = points[x.code] || [];
    const sp = ChartSvg.spark(pts.length > 1 ? pts : [{ m: 540, v: x.ref }, { m: Math.max(541, ChartSvg.toMin(x.time)), v: x.value }], x.ref);
    return `<div class="ix ${tone(x)}"><div class="ix-h"><b>${Dom.esc(x.name)}</b><span class="ix-v">${Fmt.en(x.value, 2)}</span></div>`
      + `<div class="ix-c">${Fmt.signed(x.chg)} (${Fmt.signed(x.pct)}%)</div>${sp}`
      + `<div class="ix-f"><span>${Dom.esc(T("{v} tỷ", { v: Fmt.en(x.valueMil / 1000) }))}</span>`
      + `<span class="br" title="${Dom.esc(T("Số mã tăng / đứng giá / giảm"))}"><i class="up">▲${x.up}</i> <i class="ref">■${x.same}</i> <i class="down">▼${x.down}</i></span></div></div>`;
  }

  function render(list) {
    if (list) { last = list; remember(list); }
    el.innerHTML = last.length ? last.map(card).join("") : `<div class="ix empty">${Dom.esc(T("Đang tải chỉ số…"))}</div>`;
  }

  return { init: node => { el = node; render(); }, render };
})();
// Detail pane for the selected symbol: price, stats, 3-level order book, intraday chart, active buy/sell and match history.
const DetailView = (() => {
  let top, overview, bottom;
  const TRADE_ROWS = 150;

  const stat = (label, val, cls = "") => `<div><span>${Dom.esc(T(label))}</span><b class="${cls}">${Dom.esc(val)}</b></div>`;
  const ymd = s => /^\d{8}$/.test(s) ? `${s.slice(6)}/${s.slice(4, 6)}/${s.slice(0, 4)}` : s;

  function stats(q, unit) {
    const p = v => Fmt.price(v) || "—", tone = v => QuoteModel.tone(v, q);
    const out = [stat("Trần", p(q.ceil), "ceil"), stat("Sàn", p(q.floor), "floor"), stat("Tham chiếu", p(q.ref), "ref"),
      stat("Mở cửa", p(q.open), tone(q.open)), stat("Cao", p(q.high), tone(q.high)), stat("Thấp", p(q.low), tone(q.low)),
      stat("Trung bình", p(q.avg), tone(q.avg)), stat("Tổng KL", Fmt.vol(q.totVol, unit) || "0"),
      stat("NN mua", Fmt.vol(q.fBuy, unit) || "0"), stat("NN bán", Fmt.vol(q.fSell, unit) || "0"), stat("Room NN", Fmt.big(q.room) || "—")];
    if (q.cw) out.push(stat("CK cơ sở", q.cw.underlying || "—"), stat("Giá thực hiện", q.cw.strike ? Fmt.en(q.cw.strike, 2) : "—"),
      stat("Tỷ lệ chuyển đổi", q.cw.ratio || "—"), stat("Ngày GD cuối", ymd(q.cw.lastTrade) || "—"), stat("Ngày đáo hạn", ymd(q.cw.maturity) || "—"));
    return `<div class="stats">${out.join("")}</div>`;
  }

  function book(q, unit) {
    const max = Math.max(1, ...q.bids.map(l => l.v), ...q.asks.map(l => l.v));
    const bar = (v, side) => `<i class="vbar ${side}" style="width:${Math.round(v / max * 100)}%"></i>`;
    const rows = [0, 1, 2].map(i => {
      const b = q.bids[i], a = q.asks[i];
      return `<tr><td class="bv">${bar(b.v, "b")}<span>${Fmt.vol(b.v, unit)}</span></td><td class="${QuoteModel.tone(b.p, q)}">${Fmt.price(b.p)}</td>`
        + `<td class="${QuoteModel.tone(a.p, q)}">${Fmt.price(a.p)}</td><td class="av">${bar(a.v, "a")}<span>${Fmt.vol(a.v, unit)}</span></td></tr>`;
    }).join("");
    return `<table class="book"><thead><tr><th>${Dom.esc(T("KL mua"))}</th><th>${Dom.esc(T("Giá mua"))}</th><th>${Dom.esc(T("Giá bán"))}</th><th>${Dom.esc(T("KL bán"))}</th></tr></thead><tbody>${rows}</tbody></table>`;
  }

  function sides(trades, unit) {
    const s = QuoteModel.tradeSides(trades), tot = s.B + s.S || 1;
    return `<div class="sides"><div class="sbar"><i class="up" style="width:${(s.B / tot * 100).toFixed(1)}%"></i><i class="down" style="width:${(s.S / tot * 100).toFixed(1)}%"></i></div>`
      + `<span class="up">${Dom.esc(T("Mua chủ động {v}", { v: Fmt.vol(s.B, unit) || "0" }))}</span><span class="down">${Dom.esc(T("Bán chủ động {v}", { v: Fmt.vol(s.S, unit) || "0" }))}</span></div>`;
  }

  function tradeList(trades, q, unit) {
    const rows = trades.slice(-TRADE_ROWS).reverse().map(t => {
      const tone = QuoteModel.tone(t.price, q), side = t.side === "B" ? T("M") : t.side === "S" ? T("B") : "";
      return `<tr><td>${Dom.esc(t.time)}</td><td class="${tone}">${Fmt.price(t.price)}</td><td class="${tone}">${Fmt.signed((Math.round(t.price * 100) - Math.round(q.ref * 100)) / 100)}</td>`
        + `<td>${Fmt.vol(t.vol, unit)}</td><td class="${t.side === "B" ? "up" : t.side === "S" ? "down" : ""}">${Dom.esc(side)}</td></tr>`;
    }).join("");
    return `<table class="trades"><thead><tr><th>${Dom.esc(T("Giờ"))}</th><th>${Dom.esc(T("Giá"))}</th><th>+/-</th><th>${Dom.esc(T("KL"))}</th><th>${Dom.esc(T("M/B"))}</th></tr></thead><tbody>${rows}</tbody></table>`
      + (trades.length > TRADE_ROWS ? `<p class="muted">${Dom.esc(T("Hiện {n} / {total} lệnh khớp gần nhất.", { n: TRADE_ROWS, total: Fmt.en(trades.length) }))}</p>` : "");
  }

  // s = { q, name, watched, unit, trades: array | null, tradeState: "loading" | "error" | "ok" }
  function render(s) {
    if (!s.q) { top.innerHTML = `<p class="muted pad">${Dom.esc(T("Chọn 1 mã trong bảng giá để xem chi tiết."))}</p>`; overview.innerHTML = ""; bottom.innerHTML = ""; return; }
    const q = s.q, tone = QuoteModel.tone(q.last || q.ref, q), tip = s.watched ? T("Bỏ khỏi danh mục") : T("Thêm vào danh mục");
    const head = `<div class="dh"><div><b class="dsym ${tone}">${Dom.esc(q.sym)}</b> <span class="badge">${Dom.esc(q.ex)}</span>`
      + `<button id="dStar" class="star${s.watched ? " on" : ""}" title="${Dom.esc(tip)}">${s.watched ? "★" : "☆"}</button>`
      + `<button id="dChart" class="chart-btn" title="${Dom.esc(T("Mở biểu đồ kỹ thuật toàn màn hình"))}">📈 ${Dom.esc(T("Biểu đồ"))}</button>`
      + `<button id="dAlert" class="bell" title="${Dom.esc(T("Đặt cảnh báo giá cho mã này"))}">🔔</button>`
      + `<div class="muted dname">${Dom.esc(s.name)}</div></div>`
      + `<div class="dp ${tone}"><b>${Fmt.price(q.last || q.ref)}</b><span>${Fmt.chg(q, q.chg)} ${Fmt.pct(q, q.pct)}</span></div></div>`;
    let tail;
    if (s.tradeState === "loading") tail = `<p class="muted pad">${Dom.esc(T("Đang tải lịch sử khớp lệnh…"))}</p>`;
    else if (s.tradeState === "error") tail = `<p class="bad pad">${Dom.esc(T("Không tải được lịch sử khớp lệnh."))}</p>`;
    else if (!s.trades || !s.trades.length) tail = `<p class="muted pad">${Dom.esc(T("Chưa có lệnh khớp trong ngày."))}</p>`;
    else tail = ChartSvg.intraday(s.trades, q) + sides(s.trades, s.unit) + tradeList(s.trades, q, s.unit);
    top.innerHTML = head;
    overview.innerHTML = stats(q, s.unit) + book(q, s.unit);
    bottom.innerHTML = `<div class="dsec"><b>${Dom.esc(T("Diễn biến trong ngày"))}</b><button id="dReload" title="${Dom.esc(T("Tải lại lịch sử khớp lệnh"))}">↻</button></div>` + tail;
  }

  return { init: (t, o, b) => { top = t; overview = o; bottom = b; }, render };
})();

  return { desc, interp, tipHtml, eventText, short, major, TITLE };

  const num = v => Number.isFinite(v) ? v.toFixed(1) : "";

})();
// "Khuyến nghị" tab head: the tool's own buy / sell timing, buy zone · take-profit · stop for today / medium / long term, and other key notes.
const TradePlanView = (() => {

  const f2 = v => Number.isFinite(v) ? Fmt.en(v, 2) : "—";
  const sp = v => Number.isFinite(v) ? Fmt.signed(v, 1) + "%" : "—";
  const ACTION = { buy: "Mua", buyDip: "Canh mua khi điều chỉnh", probe: "Mua thăm dò", hold: "Nắm giữ, chưa mua đuổi", watch: "Quan sát, chờ phá vỡ",
    avoid: "Đứng ngoài", sellRally: "Bán khi hồi", sell: "Bán / hạ tỷ trọng" };
  const WHY = {
    buy: "Xu hướng tuần và ngày cùng tăng, chưa quá mua — có thể mua trong vùng giá bên dưới, ưu tiên nhịp chỉnh trong phiên.",

    probe: "Khung tuần đi ngang, khung ngày bắt đầu tăng — mua thăm dò tỷ trọng nhỏ, mua thêm khi giá vượt kháng cự tuần.",
    hold: "Xu hướng tăng nhưng RSI ngày đã quá mua — người đang có hàng tiếp tục nắm giữ, người chưa có chờ điều chỉnh, không mua đuổi.",
    watch: "Cả tuần và ngày đều đi ngang — chờ giá phá vỡ khỏi vùng tích luỹ (kèm khối lượng) rồi mới hành động.",
    avoid: "Xu hướng chưa ủng hộ (đi ngang / giảm, có thể quá bán) — đứng ngoài, chờ tín hiệu đảo chiều rõ ràng.",
    sellRally: "Xu hướng tuần giảm, khung ngày chỉ đang hồi kỹ thuật — tận dụng nhịp hồi để bán / hạ tỷ trọng, không mua mới.",
    sell: "Xu hướng tuần và ngày cùng giảm — ưu tiên bán / hạ tỷ trọng, chưa bắt đáy.",
  };

  function timingHtml(t, D, W, today, med, sigs) {
    const buyWhen = [
      today && T("Vùng mua hôm nay {a} – {b}; đặt lệnh giới hạn (LO) gần {a} thay vì mua đuổi.", { a: f2(today.lo), b: f2(today.hi) }),
      med && T("Trung hạn: mua dần khi giá về {a} – {b} (hỗ trợ khung tuần) và có nến rút chân / MACD ngày cắt lên.", { a: f2(med.lo), b: f2(med.hi) }),
      Number.isFinite(D.resistance) && T("Mua theo đà khi giá đóng cửa vượt {r} (đỉnh 20 phiên) với khối lượng > trung bình 20 phiên.", { r: f2(D.resistance) }),
    ].filter(Boolean);
    const sellWhen = [
      today && T("Chốt lời ngắn hạn từng phần ở {a}{b}.", { a: f2(today.t1), b: today.t2 ? " → " + f2(today.t2) : "" }),
      med && T("Cắt lỗ khi giá đóng cửa dưới {s} (kế hoạch trung hạn) — không bình quân giá xuống.", { s: f2(med.stop) }),
      W && Number.isFinite(W.support) && T("Bán khi khung tuần thủng hỗ trợ {s} hoặc MACD tuần cắt xuống đường tín hiệu.", { s: f2(W.support) }),
    ].filter(Boolean);
    const sig = sigs.length ? `<ul class="checks">${sigs.slice(0, 6).map(x => `<li><i class="${x.tone === "warn" ? "na" : x.tone === "up" ? "ok" : "no"}">●</i> ${e(T(ChartCrossUI.TITLE[x.kind]))} — ${e(x.ago ? T("{n} phiên trước", { n: x.ago }) : T("phiên gần nhất"))}</li>`).join("")}</ul>`
      : `<p class="muted pad">${e(T("Không có giao cắt quan trọng trong 10 phiên gần nhất."))}</p>`;
    const frames = T("Tuần: {w} · Ngày: {d}", { w: W ? T(W.label) + " " + Fmt.signed(W.score, 0) : "—", d: T(D.label) + " " + Fmt.signed(D.score, 0) });
    const list = (title, items, cls) => `<div class="tcard"><b class="${cls}">${e(title)}</b><ul class="checks">${items.map(s => `<li>${e(s)}</li>`).join("")}</ul></div>`;

      + `<div class="tcards">${list(T("Khi nào mua"), buyWhen, "up")}${list(T("Khi nào bán"), sellWhen, "down")}`
      + `<div class="tcard"><b>${e(T("Tín hiệu giao cắt 10 phiên gần nhất"))}</b>${sig}</div></div>`;

      : T("Lãi / lỗ tính từ giữa vùng mua; R:R = lãi kỳ vọng ÷ rủi ro tới mức dừng lỗ, nên ≥ 2.");
    const cell = x => x ? `<td><b>${f2(x.lo)} – ${f2(x.hi)}</b></td><td class="up">${f2(x.t1)}${x.t2 ? ` → ${f2(x.t2)}` : ""}</td><td class="down">${f2(x.stop)}</td>`
      + `<td><span class="up">${sp(x.upPct)}</span> / <span class="down">${sp(x.stopPct)}</span>${Number.isFinite(x.rr) ? ` · R:R ${Fmt.en(x.rr, 1)}` : ""}</td>` : `<td colspan="4" class="muted">${e(T("chưa đủ dữ liệu"))}</td>`;
    return `<div class="dsec"><b>${e(T("Khuyến nghị giá mua / bán (nghìn đồng)"))}</b></div><div class="fscroll"><table class="dtable plan"><thead><tr><th>${e(T("Kỳ"))}</th><th>${e(T("Vùng mua"))}</th>`

      + rows.map(([name, how, x]) => `<tr><td><b>${e(T(name))}</b><div class="muted">${e(how)}</div></td>${cell(x)}</tr>`).join("") + `</tbody></table></div>`

  function notes(x) {
    const out = [], add = (tone, text) => out.push(`<li><i class="${tone}">${tone === "ok" ? "▲" : tone === "no" ? "▼" : "•"}</i> ${e(text)}</li>`);
    if (Number.isFinite(x.pos)) add("na", T("Tỷ trọng gợi ý tối đa ~{p}% vốn cho kế hoạch trung hạn (rủi ro 1% vốn, dừng lỗ {s}).", { p: Fmt.en(x.pos, 0), s: sp(x.med.stopPct) }));
    if (Number.isFinite(x.liq)) add(x.liq < 1 ? "no" : "ok", T(x.liq < 1 ? "Thanh khoản thấp ({v} tỷ/phiên): khó mua bán khối lượng lớn — dùng lệnh giới hạn, chia nhỏ lệnh." : "Thanh khoản {v} tỷ/phiên (TB 20 phiên).", { v: Fmt.en(x.liq, 1) }));
    if (x.L && x.L.vol > 45) add("no", T("Biến động cao ({v}%/năm): giảm tỷ trọng, chấp nhận dừng lỗ rộng hơn.", { v: Fmt.en(x.L.vol, 0) }));
    if (Number.isFinite(x.fair)) add(x.fairUp >= 15 ? "ok" : x.fairUp <= -10 ? "no" : "na", T("Giá hợp lý TB {f} ({u} so với giá hiện tại).", { f: f2(x.fair), u: sp(x.fairUp) }));
    if (x.pe && Number.isFinite(x.pe.percentile) && (x.pe.percentile >= 80 || x.pe.percentile <= 20)) add(x.pe.percentile >= 80 ? "no" : "ok", T(x.pe.percentile >= 80 ? "P/E cao hơn {p}% số ngày trong 5 năm — đắt so với lịch sử." : "P/E chỉ cao hơn {p}% số ngày trong 5 năm — rẻ so với lịch sử.", { p: Fmt.en(x.pe.percentile, 0) }));

    return `<div class="dsec"><b>${e(T("Lưu ý quan trọng khác"))}</b></div><ul class="checks pad">${out.join("")}</ul>`;

      + `<p class="muted pad">${e(T("Khuyến nghị do tool tự tính theo quy tắc từ giá lịch sử, chỉ báo kỹ thuật, định giá và giá mục tiêu CTCK — không phải tư vấn đầu tư; luôn tự quyết định và quản lý rủi ro."))}</p>`;

  // Analyst calls from the last 12 months: counts by side and their average target.
  function consensus(list, price) {
    const since = new Date(Date.now() - 365 * 864e5).toISOString().slice(0, 10), recent = (list || []).filter(x => (x.reportDate || "") >= since && +x.targetPrice > 0);
    if (!recent.length) return null;
    const side = x => { const c = String(x.type || "").toUpperCase(); return /BUY|OUTPERFORM|OVERWEIGHT|ADD|ACCUM/.test(c) ? 1 : /SELL|UNDER|REDUCE/.test(c) ? -1 : 0; };

  }

})();

  const dlg = () => document.getElementById("indHelpDlg");

      + `<span class="muted">${i + 1}/${list.length}</span><button data-g="next" title="${e(T("Chỉ báo sau"))}">›</button><button data-g="close" title="${e(T("Đóng"))}">✕</button></div>`

// Toolbar markup for the technical chart: compact (detail pane) and full (dialog) variants + indicator chips. Events: data-c attribute.
const ChartBar = (() => {
  const TYPES = [["candle", "Nến"], ["ha", "Heikin-Ashi"], ["bar", "OHLC"], ["line", "Đường"], ["area", "Vùng"], ["baseline", "Baseline"]];
  const SCALES = [["normal", "Thang giá"], ["log", "Thang log"], ["pct", "Thang % thay đổi"]];
  const TOOLS = [["h", "─", "Đường ngang: bấm 1 điểm"], ["t", "╱", "Đường xu hướng: bấm 2 điểm"], ["f", "Fib", "Fibonacci thoái lui: bấm đỉnh/đáy rồi điểm còn lại"], ["m", "📏", "Đo % thay đổi giữa 2 điểm"]];
  const e = s => Dom.esc(s);
  const opts = (list, v) => list.map(([k, label]) => `<option value="${k}"${k === v ? " selected" : ""}>${e(T(label))}</option>`).join("");
  const intervalOpts = s => ChartRange.INTERVALS.map(i => `<option value="${i.k}"${i.k === s.interval ? " selected" : ""}${ChartRange.valid(s.range, i.k) ? "" : " disabled"}>${i.k}</option>`).join("");

  function compact(s) {
    return `<select data-c="range" title="${e(T("Khoảng thời gian"))}">${ChartRange.RANGES.map(r => `<option value="${r.k}"${r.k === s.range ? " selected" : ""}>${e(T(r.label))}</option>`).join("")}</select>`
      + `<select data-c="interval" title="${e(T("Khung nến"))}">${intervalOpts(s)}</select>`
      + `<select data-c="type" title="${e(T("Kiểu biểu đồ"))}">${opts(TYPES, s.type)}</select>`
      + `<button data-c="open" class="chart-btn" title="${e(T("Mở biểu đồ kỹ thuật toàn màn hình"))}">📊 Full</button>`;
  }

  function full(s, tool) {
    const seg = (key, list, cur, ok = () => true) => `<span class="seg" role="group">${list.map(([k, label]) =>
      `<button data-c="${key}" data-v="${k}"${k === cur ? ' class="on"' : ""}${ok(k) ? "" : " disabled"}>${Dom.esc(label)}</button>`).join("")}</span>`;
    return seg("range", ChartRange.RANGES.map(r => [r.k, r.k === "ALL" ? T(r.label) : r.k]), s.range)
      + seg("interval", ChartRange.INTERVALS.map(i => [i.k, i.k]), s.interval, k => ChartRange.valid(s.range, k))
      + `<select data-c="type" title="${e(T("Kiểu biểu đồ"))}">${opts(TYPES, s.type)}</select>`
      + `<select data-c="scale" title="${e(T("Thang giá"))}">${opts(SCALES, s.scale)}</select>`
      + `<label class="chk"><input type="checkbox" data-c="volume"${s.volume ? " checked" : ""}>${e(T("Khối lượng"))}</label>`
      + `<label class="chk" title="${e(T("So sánh tối đa 5 mã hoặc chỉ số, cách nhau bằng dấu phẩy (thang % thay đổi)"))}">${e(T("So sánh"))}<input type="text" class="cmpin" data-c="cmp" value="${e(s.cmp.join(", "))}" placeholder="VNINDEX, VCB…" spellcheck="false" autocomplete="off"></label>`
      + `<details class="indmenu"><summary title="${e(T("Bật / tắt chỉ báo kỹ thuật"))}">${e(T("+ Chỉ báo…"))}</summary><div class="indpanel">`
      + `<span class="indnote">★ ${e(T("Chỉ báo quan trọng, dùng phổ biến nhất"))}</span><label title="${e(T("Hiện / ẩn nhãn Đỉnh, Đáy trên biểu đồ giá"))}"><input type="checkbox" data-c="peaks"${s.peaks ? " checked" : ""}> ${e(T("Đánh dấu Đỉnh / Đáy"))}</label>`
      + `<label title="${e(T("Chấm tại chỗ các đường cắt nhau (MA, MACD, RSI 70/30, +DI/−DI…); rê chuột hoặc chạm vào chấm để xem giải thích"))}"><input type="checkbox" data-c="crosses"${s.crosses ? " checked" : ""}> <span class="xdot">●</span> ${e(T("Điểm giao cắt quan trọng"))}</label><b>${e(T("Trên biểu đồ giá"))}</b>${addOpts("main", s.ind)}<b>${e(T("Khung riêng"))}</b>${addOpts("own", s.ind)}</div></details>`
      + `<span class="seg tools">${TOOLS.map(([k, icon, tip]) => `<button data-c="tool" data-v="${k}" title="${e(T(tip))}"${k === tool ? ' class="on"' : ""}>${icon}</button>`).join("")}`
      + `<button data-c="clearDraw" title="${e(T("Xoá mọi hình vẽ"))}">🗑</button></span>`
      + `<button data-c="fit" title="${e(T("Xem toàn bộ dữ liệu"))}">⤢</button>`
      + `<button data-c="png" title="${e(T("Tải ảnh PNG của biểu đồ"))}">📷 PNG</button>`;
  }
  // Checked = shown on the chart; (n) when the same indicator is on with several parameter sets.
  const addOpts = (pane, list) => Object.entries(Indicators.DEFS).filter(([, d]) => d.pane === pane).map(([k, d]) => {
    const n = list.filter(x => x.id === k).length, core = Indicators.CORE.includes(k);
    return `<div class="indrow${core ? " core" : ""}" title="${e(ChartHelp.desc(k))}"><label><input type="checkbox" data-c="toggleInd" value="${k}"${n ? " checked" : ""}> <b>${core ? "★ " : ""}${Dom.esc(d.name)}</b>${n > 1 ? ` (${n})` : ""} <span class="muted">${e(T(d.label))}</span></label>`
      + `<button type="button" class="qbtn" data-c="indHelp" data-v="${k}" title="${e(T("Hướng dẫn chi tiết: cách đọc, ví dụ, cách phối hợp"))}">?</button></div>`;
  }).join("");

  function chips(list) {
    return list.map((x, i) => {
      const d = Indicators.DEFS[x.id];
      const inputs = d.params.map(q => `<input type="number" data-c="param" data-i="${i}" data-k="${q.k}" value="${x.p[q.k]}" min="${q.min}" max="${q.max}" step="${q.step}" title="${Dom.esc(q.k)}">`).join("");
      return `<span class="ichip" title="${e(T(d.label))}"><b>${Dom.esc(d.name)}</b>${inputs}<button data-c="rm" data-i="${i}" title="${e(T("Bỏ chỉ báo"))}">✕</button></span>`;
    }).join("");
  }

  return { compact, full, chips };
})();
// Technical chart controller: one shared state (Prefs "chart") for the detail-pane mini chart and the full-screen dialog.
const ChartCtl = (() => {
  const TYPES = ["candle", "ha", "bar", "line", "area", "baseline"], SCALES = ["normal", "log", "pct"];
  let st, sym = "", active = false, quote = null, data = { key: "", bars: [], cmp: null }, seq = 0, mini, full, dlgOpen = false, note = null;
  const draw = ChartDraw.create();

  function clean(raw) {
    const r = raw && typeof raw === "object" ? raw : {};
    const range = ChartRange.RANGES.some(x => x.k === r.range) ? r.range : "1Y";
    return { range, interval: ChartRange.fix(range, ChartRange.INTERVALS.some(x => x.k === r.interval) ? r.interval : "1D"),
      type: TYPES.includes(r.type) ? r.type : "candle", scale: SCALES.includes(r.scale) ? r.scale : "normal",
      volume: r.volume !== false, peaks: r.peaks === true, crosses: r.crosses !== false, ind: Indicators.clean(r.ind),
      // Up to 5 overlay tickers; older saves / links carried compare: true for VNINDEX only.

  }

  function say(id, key, p) { const el = $(id); el.hidden = !key; el.textContent = key ? T(key, p) : ""; }
  function msg(key) { say("miniMsg", key); say("fullMsg", key); }
  function bars() {
    $("miniBar").innerHTML = ChartBar.compact(st);
    // Keep the indicator menu open while ticking several boxes (the toolbar is rebuilt on every change).
    const open = !!$("fullBar").querySelector("details.indmenu[open]");
    $("fullBar").innerHTML = ChartBar.full(st, draw.tool());
    if (open) $("fullBar").querySelector("details.indmenu").open = true;
    $("fullChips").innerHTML = ChartBar.chips(st.ind);
  }
  function head() {
    const q = quote && quote.sym === sym ? quote : null, tone = q ? QuoteModel.tone(q.last || q.ref, q) : "";
    $("dlgTitle").innerHTML = `<b class="${tone}">${Dom.esc(sym)}</b> <span class="muted">${Dom.esc(Universe.name(sym, I18n.lang))}</span>`
      + (q ? ` <b class="${tone}">${Fmt.price(q.last || q.ref)}</b> <span class="${tone}">${Fmt.chg(q, q.chg)} ${Fmt.pct(q, q.pct)}</span>` : "");
    $("dlgClose").title = T("Đóng (Esc)");
    $("fullStatus").textContent = note ? T(note.key, note.p) : draw.tool() ? T(draw.needsTwo() ? "Bấm 2 điểm trên biểu đồ." : "Bấm 1 điểm trên biểu đồ.") : T("Kéo để cuộn, lăn chuột / chụm 2 ngón để phóng to, bấm đúp trục giá để tự co giãn.")
      + (full.scrolls() ? " " + T("Nhiều khung chỉ báo: lăn chuột trên khung chỉ báo hoặc vuốt dọc để cuộn xem hết.") : "");
  }

  // Only fetch while the chart is on screen (detail tab "Kỹ thuật" or the dialog).
  async function load() {
    if (!sym || (!active && !dlgOpen)) return;
    const my = ++seq, key = `${sym}|${st.range}|${st.interval}|${st.cmp.join()}`;
    if (data.key !== key) {
      msg("Đang tải dữ liệu biểu đồ…");
      try {
        const w = ChartRange.windowOf(st.range, st.interval);
        const others = st.cmp.filter(c => c !== sym);
        const [raw, ...cmp] = await Promise.all([History.load(sym, w.res, w.from, w.to), ...others.map(c => History.load(c, w.res, w.from, w.to).catch(() => []))]);
        if (my !== seq) return;
        data = { key, bars: ChartRange.shape(raw, st.interval), cmp: others.map((name, i) => ({ name, bars: ChartRange.shape(cmp[i], st.interval) })).filter(c => c.bars.length) };
      } catch (e) {
        if (my !== seq) return;
        console.warn("ChartCtl.load - get OHLC history fail", sym, e);
        data = { key: "", bars: [], cmp: null };

        msg("Không tải được dữ liệu biểu đồ (VNDirect). Thử lại sau.");

      }
    }

  }

  function render(keep) {
    if (!data.bars.length) { [mini, full].forEach(v => v.destroy()); msg("Không có dữ liệu cho khoảng thời gian / khung nến này."); return; }
    msg(null);
    const intra = ChartRange.intraday(st.interval);
    const inds = Indicators.compute(st.ind.filter(x => !Indicators.DEFS[x.id].intraday || intra), data.bars);
    const s = { bars: data.bars, type: st.type, scale: data.cmp && data.cmp.length ? "pct" : st.scale, volume: st.volume, peaks: st.peaks, crosses: st.crosses, inds, intraday: intra, keep,

  }

  // Board poll → refresh the header and the last daily candle with the live quote.
  function onQuote(q) {
    if (!q || q.sym !== sym) return;
    quote = q;
    if (dlgOpen) head();
    if (st.interval !== "1D" || !q.last || !data.bars.length) return;
    const d = QuoteModel.vnDate(), time = Date.UTC(+d.slice(0, 4), +d.slice(4, 6) - 1, +d.slice(6)) / 1000;
    const bar = { time, open: q.open || q.last, high: Math.max(q.high, q.last), low: Math.min(q.low || q.last, q.last), close: q.last, volume: q.totVol * 10 };

  function openDialog() {

    bars(); head();
    // Data may not be loaded yet (mini chart only loads while its tab is open) → load() fetches if needed, then renders.

  }

  function act(c, el) {
    const v = el.dataset.v ?? el.value;
    if (c === "range") { st.range = v; st.interval = ChartRange.fix(v, st.interval); }
    else if (c === "interval") { if (!ChartRange.valid(st.range, v)) return; st.interval = v; }
    else if (c === "type" || c === "scale") st[c] = v;
    else if (["volume", "peaks", "crosses"].includes(c)) st[c] = el.checked;
    else if (c === "cmp") st.cmp = WatchParse.parse(el.value).symbols.slice(0, 5);
    else if (c === "toggleInd") { if (!Object.hasOwn(Indicators.DEFS, v)) return; st.ind = el.checked ? Indicators.add(st.ind, v) : st.ind.filter(x => x.id !== v); }

    else if (c === "tool") { draw.setTool(v); note = null; bars(); head(); return; }
    else if (c === "clearDraw") { draw.clear(); note = null; head(); render(true); return; }

  const guideHooks = { on: id => st.ind.some(x => x.id === id), toggle: (id, show) => act("toggleInd", { dataset: { v: id }, checked: show }) };

  function png() {
    const canvas = full.screenshot();
    if (!canvas) return;
    const a = document.createElement("a");
    a.href = canvas.toDataURL("image/png"); a.download = `${sym}-${st.interval}-${QuoteModel.vnDate()}.png`;
    document.body.appendChild(a); a.click(); a.remove();
  }

  function wire(box) {
    box.addEventListener("click", e => { const b = e.target.closest("button[data-c]"); if (b && !b.disabled) act(b.dataset.c, b); });
    box.addEventListener("change", e => { const el = e.target.closest("[data-c]"); if (el && el.tagName !== "BUTTON") act(el.dataset.c, el); });
  }

  function init() {
    // The menu may sit near the dialog's right edge → flip the panel to open leftwards instead of being clipped.
    $("fullBar").addEventListener("toggle", e => {
      const d = e.target;
      if (!d.matches || !d.matches("details.indmenu") || !d.open) return;
      const pn = d.querySelector(".indpanel");
      pn.style.left = "0"; pn.style.right = "auto";
      if (pn.getBoundingClientRect().right > $("chartDlg").getBoundingClientRect().right - 8) { pn.style.left = "auto"; pn.style.right = "0"; }
    }, true);
    document.addEventListener("click", e => { const m = $("fullBar").querySelector("details.indmenu[open]"); if (m && !m.contains(e.target) && !e.composedPath().includes($("indHelpDlg"))) m.open = false; });
    IndGuide.init();
    // Every visit opens at 1 year × 1D; type / scale / indicators are remembered, share links still set their own range.
    st = clean({ ...Prefs.get("chart", {}), range: "1Y", interval: "1D" });

    full = TechChart.create($("fullHost"), { legend: $("fullLegend"), tip: $("fullTip"), onClick: pt => { const r = draw.click(pt, data.bars); if (!r) return; note = r; head(); if (r.redraw) render(true); } });
