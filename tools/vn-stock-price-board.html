})();
// "Kỹ thuật" tab: rule-based read per timeframe (day / week / month / year) + outlook for tomorrow → long term with this ticker's historical odds.
const OutlookView = (() => {
  const e = s => Dom.esc(s ?? "");
  const f2 = v => Number.isFinite(v) ? Fmt.en(v, 2) : "—";
  const pct = (v, d = 1) => Number.isFinite(v) ? `<span class="${v > 0 ? "up" : v < 0 ? "down" : "ref"}">${Fmt.signed(v, d)}%</span>` : "—";
  const tone = b => b > 0 ? "up" : b < 0 ? "down" : "ref";
  const TF = { D: "Ngày", W: "Tuần", M: "Tháng" };

  async function load(sym) {
    const now = Math.floor(Date.now() / 1000), daily = await History.load(sym, "D", now - 11 * 366 * 86400, now);
    if (daily.length < 60) return { empty: true };
    return { D: TechOutlook.frame(daily, "D", [1, 5]), W: TechOutlook.frame(ChartRange.shape(daily, "1W"), "W", [1, 4]),
      M: TechOutlook.frame(ChartRange.shape(daily, "1M"), "M", [1, 12]), L: TechOutlook.longTerm(daily), bars: daily };
  }

  // One readable sentence per signal (Vietnamese source keys, translated via T).
  function sigText(s, tf) {

    switch (s.key) {
      case "aboveFast": return T(up ? "Giá trên MA{n}" : "Giá dưới MA{n}", { n: nf });
      case "aboveMid": return T(up ? "Giá trên MA{n}" : "Giá dưới MA{n}", { n: nm });
      case "aboveSlow": return T(up ? "Giá trên MA{n}" : "Giá dưới MA{n}", { n: ns });
      case "maOrder": return T(s.vote > 0 ? "MA xếp tăng (ngắn > vừa > dài)" : s.vote < 0 ? "MA xếp giảm (ngắn < vừa < dài)" : "Các đường MA đan xen");
      case "slope": return T(up ? "MA{n} đang đi lên" : "MA{n} đang đi xuống", { n: nm });
      case "rsi": return v >= 70 ? T("RSI {v}: quá mua, dễ điều chỉnh", { v: f2(v) }) : v <= 30 ? T("RSI {v}: quá bán, dễ hồi phục", { v: f2(v) }) : T(v >= 50 ? "RSI {v}: trên 50, phe mua nhỉnh hơn" : "RSI {v}: dưới 50, phe bán nhỉnh hơn", { v: f2(v) });
      case "macd": return T(up ? "MACD nằm trên đường tín hiệu" : "MACD nằm dưới đường tín hiệu");
      case "macdHist": return T(up ? "Động lượng MACD đang tăng" : "Động lượng MACD đang giảm");
      case "adx": return s.vote === 0 ? T("ADX {v}: chưa có xu hướng rõ", { v: f2(v) }) : T(up ? "ADX {v}: xu hướng mạnh, phe mua chiếm ưu thế" : "ADX {v}: xu hướng mạnh, phe bán chiếm ưu thế", { v: f2(v) });
      case "bb": return T(s.vote < 0 ? "Giá vượt dải Bollinger trên (căng, dễ điều chỉnh)" : s.vote > 0 ? "Giá thủng dải Bollinger dưới (quá bán)" : "Giá nằm trong dải Bollinger");
      case "volume": return s.vote === 0 ? T("Khối lượng bình thường ({v}× TB 20)", { v: f2(v) }) : T(up ? "Khối lượng {v}× TB 20, xác nhận đà tăng" : "Khối lượng {v}× TB 20, xác nhận đà giảm", { v: f2(v) });

  function card(fr) {
    if (!fr) return "";

      + `<div class="tc-r">${e(T("Hỗ trợ {s} · kháng cự {r}", { s: f2(fr.support), r: f2(fr.resistance) }))}</div>`
      + `<details><summary>${e(T("{n} tín hiệu", { n: fr.signals.length }))}</summary><ul class="checks">`

  }

  function yearCard(L) {

    return `<div class="tcard"><div class="tc-h"><b>${e(T("Năm"))}</b><span class="tag ${tone(t)}">${e(T(label))}</span></div>`
      + `<ul class="checks"><li>${e(T("12 tháng qua"))}: ${pct(L.ret1y)}</li><li>${e(ma)}</li>`
      + `<li>${e(T("Cách đỉnh 52 tuần"))}: ${pct(L.fromHi52)} · ${e(T("cách đáy"))}: ${pct(L.fromLo52)}</li><li>${e(T("Biến động năm (σ)"))}: ${f2(L.vol)}%</li></ul></div>`;
  }

  const oddsCell = o => !o || !o.n ? `<span class="muted">${e(T("chưa đủ mẫu"))}</span>`
    : `${e(T("{u}% số lần tăng · trung vị", { u: Fmt.en(o.up, 0) }))} ${pct(o.median)}`
      + ` <span class="muted">(${o.n >= 8 ? e(T("{a}…{b}", { a: Fmt.signed(o.p25, 1) + "%", b: Fmt.signed(o.p75, 1) + "%" })) + ", " : ""}n=${o.n}${o.broad ? " · " + e(T("gộp mọi mức cùng chiều")) : ""}${o.n < 20 ? " · " + e(T("ít mẫu")) : ""})</span>`;
  const range = (c, w) => Number.isFinite(c) && Number.isFinite(w) ? `${f2(c - w)} – ${f2(c + w)}` : "—";

  function outlook(d) {
    const { D, W, M, L } = d;
    const row = (name, fr, rng, o, extra = "") => `<tr><td><b>${e(T(name))}</b></td><td>${fr ? `<span class="tag ${tone(fr.bucket)}">${e(T(fr.label))}</span>` : "—"}</td>`
      + `<td>${rng}${extra}</td><td>${oddsCell(o)}</td></tr>`;
    const longText = [L.cagr5 != null ? T("Tăng trưởng bình quân 5 năm {v}%/năm", { v: Fmt.signed(L.cagr5, 1) }) : L.cagr3 != null ? T("Tăng trưởng bình quân 3 năm {v}%/năm", { v: Fmt.signed(L.cagr3, 1) }) : "",
      T("sụt giảm tối đa 5 năm {v}%", { v: Fmt.en(L.mdd5, 1) }), T("cách đỉnh lịch sử {v}%", { v: Fmt.signed(L.fromAth, 1) })].filter(Boolean).join(" · ");
    const longBias = (L.cagr5 ?? L.cagr3 ?? 0) > 5 && L.aboveMa250 ? 1 : (L.cagr5 ?? L.cagr3 ?? 0) < 0 && !L.aboveMa250 ? -1 : 0;
    const longLabel = longBias > 0 ? T("Tích cực") : longBias < 0 ? T("Tiêu cực") : T("Trung tính");
    return `<div class="dsec"><b>${e(T("Phán đoán (dựa trên quy tắc + thống kê lịch sử của mã)"))}</b></div>`
      + `<div class="fscroll"><table class="dtable outlook"><thead><tr><th>${e(T("Kỳ"))}</th><th>${e(T("Xu hướng"))}</th><th>${e(T("Vùng giá dự kiến"))}</th><th>${e(T("Lịch sử khi tín hiệu tương tự"))}</th></tr></thead><tbody>`
      + row("Ngày mai", D, range(D?.close, D?.atr), D?.odds[1], D ? `<div class="muted">${e(T("Pivot {p} · S1 {s} · R1 {r}", { p: f2(D.pivots.p), s: f2(D.pivots.s1), r: f2(D.pivots.r1) }))}</div>` : "")
      + row("Tuần tới", W, range(W?.close, W?.atr), W?.odds[1], W ? `<div class="muted">${e(T("Pivot {p} · S1 {s} · R1 {r}", { p: f2(W.pivots.p), s: f2(W.pivots.s1), r: f2(W.pivots.r1) }))}</div>` : "")
      + row("Tháng tới", M, range(M?.close, M?.atr), M?.odds[1])
      + row("Năm tới", M, L.band1y ? `${f2(L.band1y[0])} – ${f2(L.band1y[1])}` : "—", M?.odds[12], `<div class="muted">${e(T("±1σ biến động năm"))}</div>`)
      + `<tr><td><b>${e(T("Dài hạn"))}</b></td><td><span class="tag ${tone(longBias)}">${e(longLabel)}</span></td><td colspan="2">${e(longText)}</td></tr>`
      + `</tbody></table></div>`;
  }

  function summary(d) {
    const lab = fr => fr ? T(fr.label).toLowerCase() : "—";
    return `<p class="pad tsum">${e(T("Tóm tắt: ngắn hạn (ngày) {d}, trung hạn (tuần) {w}, dài hơn (tháng) {m}.", { d: lab(d.D), w: lab(d.W), m: lab(d.M) }))}`
      + (d.D && d.W && d.D.bucket * d.W.bucket < 0 ? ` ${e(T("Khung ngày và tuần đang ngược chiều — tín hiệu ngắn hạn kém tin cậy."))}` : "") + `</p>`;
  }

  function html(d) {
    if (!d || d.empty || !d.D) return TabHtml.empty(T("Chưa đủ dữ liệu giá để phân tích (cần ít nhất 60 phiên)."));
    return `<div class="dsec"><b>${e(T("Nhận định kỹ thuật tự động"))}</b></div>` + summary(d)
      + `<div class="tcards">${card(d.D)}${card(d.W)}${card(d.M)}${yearCard(d.L)}</div>` + outlook(d)
      + `<p class="muted pad">${e(T("Nhận định do tool tự tính từ chỉ báo kỹ thuật (MA, RSI, MACD, ADX, Bollinger, khối lượng) và thống kê giá quá khứ của chính mã trên dữ liệu VNDirect; không phải khuyến nghị đầu tư — quá khứ không đảm bảo tương lai."))}</p>`;
  }

  return { load, html };
})();
// HTML for the detail tabs fed by VNDirect finfo: ratios, news, events, profile + shareholders, analyst calls, financial statements.
const TabHtml = (() => {
  const e = s => Dom.esc(s ?? "");
  const dmy = s => /^\d{4}-\d{2}-\d{2}/.test(s || "") ? `${s.slice(8, 10)}/${s.slice(5, 7)}/${s.slice(0, 4)}` : "";
  const url = u => /^https?:\/\//i.test(u || "") ? u : "";
  const link = (u, text) => url(u) ? `<a href="${e(url(u))}" target="_blank" rel="noopener noreferrer">${e(text)}</a>` : e(text);
  const num = (v, d = 2) => Number.isFinite(v) ? Fmt.en(v, d) : "—";
  const pct = v => Number.isFinite(v) ? Fmt.en(v * 100, 2) + "%" : "—";
  const stat = (label, val, cls = "") => `<div><span>${e(label)}</span><b class="${cls}">${e(val)}</b></div>`;
  const empty = text => `<p class="muted pad">${e(text)}</p>`;

  function ratios(r) {
    if (!r || !Object.keys(r).length) return empty(T("Chưa có chỉ số định giá cho mã này."));
    return `<div class="dsec"><b>${e(T("Chỉ số cơ bản"))}</b></div><div class="stats">`
      + stat(T("Vốn hoá (tỷ)"), num(r.MARKETCAP / 1e9, 0)) + stat(T("P/E"), num(r.PRICE_TO_EARNINGS)) + stat(T("P/B"), num(r.PRICE_TO_BOOK)) + stat(T("P/S"), num(r.PRICE_TO_SALES))
      + stat(T("EPS (đ)"), num(r.EPS_TR, 0)) + stat(T("BVPS (đ)"), num(r.BVPS_CR, 0)) + stat(T("ROE"), pct(r.ROAE_TR_AVG5Q)) + stat(T("ROA"), pct(r.ROAA_TR_AVG5Q))
      + stat(T("ROIC"), pct(r.ROIC_TR_AVG5Q)) + stat(T("Tỷ suất cổ tức"), pct(r.DIVIDEND_YIELD)) + stat(T("Beta"), num(r.BETA)) + stat(T("CP lưu hành"), Fmt.big(r.OUTSTANDING_SHARES || 0) || "—")
      + stat(T("KL TB 10 phiên"), Fmt.big(r.NMVOLUME_AVG_CR_10D || 0) || "—") + stat(T("Cao nhất 52 tuần"), num(r.PRICE_HIGHEST_CR_52W / 1000)) + stat(T("Thấp nhất 52 tuần"), num(r.PRICE_LOWEST_CR_52W / 1000))
      + `</div>`;
  }

  function news(list, more) {
    if (!list.length) return empty(T("Chưa có tin tức cho mã này."));
    return list.map(n => `<article class="nitem"><b>${link(n.newsUrl || n.dstockUrl, String(n.newsTitle || "").trim())}</b>`
      + `<div class="muted">${e(n.newsSource)} · ${dmy(n.newsDate)} ${e(String(n.newsTime || "").slice(0, 5))}</div>`
      + (n.newsAbstract ? `<p>${e(String(n.newsAbstract).trim())}</p>` : "") + `</article>`).join("")
      + (more ? `<button class="more" data-act="moreNews">${e(T("Xem thêm tin"))}</button>` : "")
      + `<p class="muted pad">${e(T("Tin tổng hợp từ VNDirect (tiếng Việt); bấm tiêu đề để đọc bài gốc."))}</p>`;
  }

  function events(list) {
    if (!list.length) return empty(T("Chưa có sự kiện quyền nào."));
    return `<table class="dtable"><thead><tr><th>${e(T("Công bố"))}</th><th>${e(T("Sự kiện"))}</th><th>${e(T("GDKHQ"))}</th><th>${e(T("Thực hiện"))}</th></tr></thead><tbody>`
      + list.map(x => `<tr><td>${dmy(x.disclosureDate)}</td><td><b>${e(x.typeDesc)}</b>${x.note ? `<div class="muted">${e(x.note)}</div>` : ""}</td>`
        + `<td>${dmy(x.effectiveDate)}</td><td>${dmy(x.actualDate)}</td></tr>`).join("") + `</tbody></table>`;
  }

  function profile(p, holders, lang) {
    if (!p) return empty(T("Chưa có hồ sơ doanh nghiệp."));
    const en = lang === "en";
    const row = (k, v) => v ? `<tr><th>${e(k)}</th><td>${v}</td></tr>` : "";
    const summary = (en && p.enSummary) || p.vnSummary;
    const info = `<table class="dtable kv"><tbody>${row(T("Tên công ty"), e(en ? p.enName || p.vnName : p.vnName))}${row(T("Sàn niêm yết"), e(p.floor))}`
      + `${row(T("Ngày thành lập"), dmy(p.foundDate))}${row(T("Mã số thuế"), e(p.taxCode))}${row(T("Địa chỉ"), e(en && p.enAddress ? p.enAddress : p.vnAddress))}`
      + `${row(T("Điện thoại"), e(p.phone))}${row(T("Website"), link(p.website, p.website))}${row(T("Email"), e(p.email))}`
      + `${row(T("Số nhân viên"), Number.isFinite(+p.employees) && +p.employees ? Fmt.en(+p.employees) : "")}</tbody></table>`;
    const hold = holders.length ? `<div class="dsec"><b>${e(T("Cổ đông lớn"))}</b></div><table class="dtable"><thead><tr><th>${e(T("Cổ đông"))}</th><th>${e(T("Số CP"))}</th><th>${e(T("Tỷ lệ"))}</th></tr></thead><tbody>`
      + holders.map(h => `<tr><td>${e(h.shareholderName)}<div class="muted">${e(en ? h.enRoleType || h.roleType : h.roleType)} · ${dmy(h.effectiveDate)}</div></td>`
        + `<td>${Fmt.en(+h.numberOfShares || 0)}</td><td>${Number.isFinite(+h.ownershipPct) ? Fmt.en(+h.ownershipPct, 2) + "%" : "—"}</td></tr>`).join("") + `</tbody></table>` : "";
    return info + (summary ? `<p class="pad summary">${e(String(summary).trim())}</p>` : "") + hold;
  }

  const CALL = { BUY: "Mua", STRONG_BUY: "Mua mạnh", OUTPERFORM: "Khả quan", OVERWEIGHT: "Khả quan", ADD: "Mua thêm", ACCUMULATE: "Tích luỹ",
    HOLD: "Nắm giữ", NEUTRAL: "Trung lập", MARKET_PERFORM: "Trung lập", UNDERPERFORM: "Kém khả quan", UNDERWEIGHT: "Kém khả quan", REDUCE: "Giảm tỷ trọng", SELL: "Bán" };
  const callTone = c => /BUY|OUTPERFORM|OVERWEIGHT|ADD|ACCUM/.test(c) ? "up" : /SELL|UNDER|REDUCE/.test(c) ? "down" : "ref";

  function recs(list, last) {
    if (!list.length) return empty(T("Chưa có khuyến nghị của công ty phân tích."));
    const avg = +list[0].avgTargetPrice, up = v => last && v ? (v / last - 1) * 100 : null;
    const head = Number.isFinite(avg) && avg ? `<div class="stats">${stat(T("Giá mục tiêu TB"), num(avg))}${stat(T("Tiềm năng"), up(avg) == null ? "—" : Fmt.signed(up(avg)) + "%", up(avg) > 0 ? "up" : "down")}`
      + `${stat(T("Số khuyến nghị"), String(list.length))}</div>` : "";
    return head + `<table class="dtable"><thead><tr><th>${e(T("Ngày"))}</th><th>${e(T("Đơn vị"))}</th><th>${e(T("Đánh giá"))}</th><th>${e(T("Giá mục tiêu"))}</th><th>${e(T("Tiềm năng"))}</th></tr></thead><tbody>`
      + list.map(x => { const c = String(x.type || "").toUpperCase().replace(/\s+/g, "_"), u = up(+x.targetPrice);
        return `<tr><td>${dmy(x.reportDate)}</td><td>${e(x.firm)}</td><td class="${callTone(c)}">${e(CALL[c] ? T(CALL[c]) : x.type)}</td>`
          + `<td>${num(+x.targetPrice)}</td><td class="${u > 0 ? "up" : u < 0 ? "down" : ""}">${u == null ? "—" : Fmt.signed(u) + "%"}</td></tr>`; }).join("")
      + `</tbody></table><p class="muted pad">${e(T("Tiềm năng = giá mục tiêu so với giá khớp hiện tại. Nguồn: VNDirect / Bloomberg."))}</p>`;
  }

  // Cash dividends per year (đ/share summed over payments), yield on today's price, and the unbroken streak up to the latest year.
  function dividends(list, last) {
    const per = {};
    for (const d of list || []) { const y = +d.divYear, v = +d.dividend; if (y > 1990 && v > 0) per[y] = (per[y] || 0) + v; }
    const years = Object.keys(per).map(Number).sort((a, b) => b - a);
    if (!years.length) return "";
    let streak = 0;
    for (let y = years[0]; per[y]; y--) streak++;
    const rows = years.slice(0, 8).map(y => `<tr><td>${y}</td><td>${Fmt.en(per[y])}</td><td>${last ? Fmt.en(per[y] / (last * 1000) * 100, 2) + "%" : "—"}</td></tr>`).join("");
    const head = e(T("Cổ tức tiền mặt theo năm · trả liên tục {n} năm", { n: streak }));
    return `<div class="dsec"><b>${head}</b></div><table class="dtable num"><thead><tr><th>${e(T("Năm"))}</th><th>${e(T("Cổ tức (đ/cp)"))}</th><th>${e(T("Tỷ suất theo giá hiện tại"))}</th></tr></thead><tbody>${rows}</tbody></table>`;
  }

  return { ratios, news, events, dividends, profile, recs, empty, url };
})();
// Financial statements tab: balance sheet / income / cash flow × quarter / year as a table or a bar chart, plus this year's estimate vs actual.
const FinView = (() => {
  const KINDS = [["is", "Kết quả kinh doanh"], ["bs", "Cân đối kế toán"], ["cf", "Lưu chuyển tiền tệ"]];
  const PERIOD = [["quarter", "Quý"], ["year", "Năm"]];
  const MODE = [["table", "Bảng"], ["chart", "Biểu đồ"]];
  // Chart series by item code (first code found wins: banks report total operating income 421701 instead of net sales 21001).
  const SERIES = { is: [[[21001, 421701], "barA"], [[23000], "barB"]], bs: [[[14400], "barA"], [[13000], "barC"], [[14000], "barB"]], cf: [[[32000], "barA"], [[33000], "barC"], [[34000], "barB"]] };
  const clean = raw => ({ kind: KINDS.some(k => k[0] === raw?.kind) ? raw.kind : "is", period: raw?.period === "year" ? "year" : "quarter", mode: raw?.mode === "chart" ? "chart" : "table" });
  let st = clean(Prefs.get("fin", {}));
  const e = s => Dom.esc(s ?? "");

  const seg = (act, list, cur) => `<span class="seg">${list.map(([k, l]) => `<button data-act="${act}" data-v="${k}"${k === cur ? ' class="on"' : ""}>${e(T(l))}</button>`).join("")}</span>`;

  function tableHtml(table, lang) {
    const head = `<tr><th>${e(T("Chỉ tiêu (tỷ đồng)"))}</th>${table.periods.map(p => `<th>${FinTable.label(p, table.period)}</th>`).join("")}</tr>`;
    const rows = table.lines.map(l => {
      const name = lang === "en" && l.en ? l.en : l.vi;
      const cells = l.values.map((v, i) => {
        const g = FinTable.growth(l.values, i), tip = g == null ? "" : ` title="${e(T("{g}% so với kỳ trước", { g: Fmt.signed(g) }))}"`;
        return `<td class="${v < 0 ? "down" : ""}"${tip}>${FinTable.fmt(v, l)}</td>`;
      }).join("");
      return `<tr class="lv${l.level}"><th title="${e(name)}">${e(name)}</th>${cells}</tr>`;
    }).join("");
    return `<div class="fscroll"><table class="ftable"><thead>${head}</thead><tbody>${rows}</tbody></table></div>`
      + `<p class="muted pad">${e(T("Nguồn: VNDirect. Rê chuột lên ô để xem % thay đổi so với kỳ trước; EPS tính bằng đồng."))}</p>`;
  }

  function chartHtml(table, lang) {
    const found = SERIES[table.kind].map(([codes, cls]) => ({ cls, line: codes.map(c => table.lines.find(l => l.code === c)).find(Boolean) })).filter(s => s.line);
    if (!found.length) return `<p class="muted pad">${e(T("Chưa có số liệu để vẽ biểu đồ."))}</p>`;
    const labels = table.periods.map(p => FinTable.label(p, table.period)).reverse();
    const series = found.map(s => ({ cls: s.cls, values: s.line.values.map(v => v == null ? null : v / 1e9).reverse() }));
    let line = null;
    if (table.kind === "is" && found.length === 2) line = { cls: "acc", values: found[0].line.values.map((r, i) => r && found[1].line.values[i] != null ? found[1].line.values[i] / r * 100 : null).reverse() };
    const legend = found.map(s => `<span><i class="sw ${s.cls}"></i>${e(lang === "en" && s.line.en ? s.line.en : s.line.vi)}</span>`).join("")
      + (line ? `<span><i class="sw acc"></i>${e(T("Biên LNST (%)"))}</span>` : "");
    return `<div class="legend pad">${legend}</div>${VSvg.bars(labels, series, line)}<p class="muted pad">${e(T("Đơn vị: tỷ đồng."))}</p>`;
  }

  function estHtml(est) {
    if (!est || (!est.rev && !est.np)) return "";
    const row = (label, plan, act) => plan ? `<tr><td>${e(T(label))}</td><td>${Fmt.en(plan / 1e9, 0)}</td><td>${act != null ? Fmt.en(act / 1e9, 0) : "—"}</td>`
      + `<td>${act != null ? `<b class="${act / plan >= 1 ? "up" : "ref"}">${Fmt.en(act / plan * 100, 1)}%</b>` : "—"}</td></tr>` : "";
    const rows = row("Doanh thu", est.rev, est.revAct) + row("LNST công ty mẹ", est.np, est.npAct);
    return `<div class="dsec"><b>${e(T("Dự phóng {y} của VNDirect vs thực hiện ({q} quý)", { y: est.year, q: est.quarters }))}</b></div>`
      + `<table class="dtable num"><thead><tr><th></th><th>${e(T("Dự phóng (tỷ)"))}</th><th>${e(T("Luỹ kế (tỷ)"))}</th><th>${e(T("Hoàn thành"))}</th></tr></thead>`
      + `<tbody>${rows}</tbody></table>`;
  }

  // table: load() result, or null while loading / on error (message shown instead).
  function html(table, lang, message) {
    const bar = `<div class="cbar">${seg("kind", KINDS, st.kind)}${seg("period", PERIOD, st.period)}${seg("mode", MODE, st.mode)}</div>`;
    if (message) return bar + `<p class="muted pad">${e(message)}</p>`;
    const est = table ? estHtml(table.est) : "";
    if (!table || !table.lines.length) return est + bar + `<p class="muted pad">${e(T("Chưa có báo cáo tài chính cho mã này."))}</p>`;
    return est + bar + (st.mode === "chart" ? chartHtml(table, lang) : tableHtml(table, lang));
  }

  // Estimate for the current calendar year vs the sum of its reported quarters; failures only hide this block.
  async function loadEst(sym) {
    const y = new Date().getUTCFullYear(), codes = [21001, 421701, 23000];
    try {
      const [est, q] = await Promise.all([Finfo.items(sym, "ESTIMATION", codes, `${y}-01-01`), Finfo.items(sym, "QUARTER", codes, `${y}-01-01`)]);
      const plan = Health.byYear(est).find(r => r.year === y);
      if (!plan) return null;
      const sum = c => { const v = q.filter(r => +r.itemCode === c).map(r => +r.numericValue).filter(Number.isFinite); return v.length ? v.reduce((s, x) => s + x, 0) : null; };
      const quarters = new Set(q.map(r => r.fiscalDate)).size;
      return { year: y, quarters, rev: plan.v[21001] ?? plan.v[421701] ?? null, np: plan.v[23000] ?? null, revAct: sum(21001) ?? sum(421701), npAct: sum(23000) };
    } catch (err) { console.warn("FinView.loadEst - get estimates fail", sym, err); return null; }
  }

  async function load(sym) {
    // Labels follow the period the table was fetched with, not the (maybe already changed) current choice.
    const { kind, period } = st, [models, est] = await Promise.all([Finfo.models(sym), loadEst(sym)]), model = FinTable.pickModel(models, kind);
    if (!model) return { periods: [], lines: [], kind, period, est };
    return { ...FinTable.build(model, await Finfo.values(sym, model.modelType, period, FinTable.since(period))), kind, period, est };
  }

  // "reload" when kind / period changed (new data), "render" for table ↔ chart, false when nothing changed.
  function act(el) {
    const a = el.dataset.act, v = el.dataset.v;
    if (!["kind", "period", "mode"].includes(a) || st[a] === v) return false;
    st = clean({ ...st, [a]: v });
    Prefs.set("fin", st);
    return a === "mode" ? "render" : "reload";
  }

  return { html, load, act, get: () => ({ ...st }), set: raw => { st = clean(raw); Prefs.set("fin", st); } };
})();
// HTML for the "Định giá" tab: snowflake + criteria, fair-price table with editable DCF assumptions, P/E–P/B bands, Piotroski / Altman.
const ValHtml = (() => {
  const e = s => Dom.esc(s ?? "");
  const DIMS = { value: "Định giá", future: "Tương lai", past: "Quá khứ", health: "Sức khoẻ", dividend: "Cổ tức" };
  const CHECKS = {
    peBand: "P/E thấp hơn trung vị 5 năm", pbBand: "P/B thấp hơn trung vị 5 năm", fair: "Giá thấp hơn giá hợp lý trung bình", pe15: "P/E dưới 15", peg: "PEG dưới 1",
    estRev: "Dự phóng doanh thu năm nay tăng > 10%", estNp: "Dự phóng LNST năm nay tăng > 10%", estNpHigh: "Dự phóng LNST năm nay tăng > 20%",
    roe: "ROE trên 15%", roa: "ROA cao (> 7%; ngân hàng, CK, bảo hiểm > 1%)", npUp: "LNST năm gần nhất tăng", cagr3: "LNST tăng bình quân > 10%/năm trong 3 năm", cagr5: "LNST tăng trong 5 năm",
    eqRatio: "Vốn chủ sở hữu / tổng tài sản > 7%", profit: "Có lãi năm gần nhất", current: "Thanh toán hiện hành > 1", de: "Nợ vay / vốn chủ sở hữu < 1",
    cover: "EBIT / chi phí lãi vay > 3", cfoPos: "Dòng tiền kinh doanh dương", altman: "Altman Z ở vùng an toàn", piotroski: "Piotroski F-score ≥ 6",
    yield2: "Tỷ suất cổ tức > 2%", yield4: "Tỷ suất cổ tức > 4%", streak: "Trả cổ tức tiền 3 năm liền", stable: "Cổ tức năm gần nhất không giảm", payout: "Tỷ lệ chi trả 0–80% lợi nhuận",
  };
  const PIO = { roa: "ROA dương", cfo: "Dòng tiền kinh doanh dương", droa: "ROA tăng so với năm trước", accrual: "Dòng tiền kinh doanh lớn hơn LNST",
    dlev: "Nợ dài hạn / tài sản không tăng", dcr: "Thanh toán hiện hành tăng", dil: "Không phát hành thêm cổ phiếu", dgm: "Biên lãi gộp tăng", dat: "Vòng quay tài sản tăng" };
  const METHODS = { graham: "Graham (√22,5 × EPS × BVPS)", pe: "P/E trung vị 5 năm × EPS", pb: "P/B trung vị 5 năm × BVPS", dcf: "DCF dòng tiền tự do" };
  const DCF_INPUTS = [["g", "Tăng trưởng 5 năm (%)"], ["wacc", "WACC (%)"], ["tg", "Tăng trưởng dài hạn (%)"]];
  const PCT = new Set(["fair", "estRev", "estNp", "estNpHigh", "roe", "roa", "npUp", "cagr3", "cagr5", "eqRatio", "yield2", "yield4", "payout"]);

  const mark = p => p === null ? `<i class="na">–</i>` : p ? `<i class="ok">✔</i>` : `<i class="no">✖</i>`;
  const val = (k, v) => !Number.isFinite(v) ? "" : PCT.has(k) ? ` (${Fmt.en(v, 1)}%)` : k === "streak" ? "" : ` (${Fmt.en(v, 2)})`;
  const sec = title => `<div class="dsec"><b>${e(title)}</b></div>`;
  const pct = v => Number.isFinite(v) ? `<span class="${v > 0 ? "up" : v < 0 ? "down" : ""}">${Fmt.signed(v, 1)}%</span>` : "—";

  function snowflake(dims) {
    const radar = VSvg.radar(dims.map(d => ({ label: T(DIMS[d.key]), score: d.score })));
    const lists = dims.map(d => `<details><summary><b>${e(T(DIMS[d.key]))}</b> <span class="muted">${d.score ?? "–"}/6</span></summary><ul class="checks">`
      + d.checks.map(c => `<li>${mark(c.pass)} ${e(T(CHECKS[c.key]))}${val(c.key, c.v)}</li>`).join("") + `</ul></details>`).join("");
    return sec(T("Snowflake — 5 khía cạnh (0–6)")) + `<div class="snowbox">${radar}<div class="snowlist">${lists}</div></div>`;
  }

  function fair(f, a, price) {
    const rows = f.methods.map(m => `<tr><td>${e(T(METHODS[m.key]))}</td><td>${m.value ? Fmt.en(m.value, 2) : "—"}</td><td>${pct(m.upside)}</td></tr>`).join("");
    const inputs = a ? `<div class="dcfin">${DCF_INPUTS.map(([k, l]) =>
      `<label>${e(T(l))}<input type="number" data-act="dcf" data-k="${k}" value="${a[k]}" step="0.5" min="-10" max="40"></label>`).join("")}</div>`
      + `<p class="muted pad">${e(T("FCF bình quân 3 năm: {f} tỷ · nợ vay ròng: {d} tỷ", { f: Fmt.en((a.fcf0 || 0) / 1e9, 0), d: Fmt.en((a.netDebt || 0) / 1e9, 0) }))}</p>`
      : `<p class="muted pad">${e(T("DCF không áp dụng cho ngân hàng, chứng khoán, bảo hiểm hoặc khi dòng tiền tự do âm."))}</p>`;
    return sec(T("Giá hợp lý (nghìn đồng)")) + `<table class="dtable"><thead><tr><th>${e(T("Phương pháp"))}</th><th>${e(T("Giá"))}</th><th>${e(T("So với giá {p}", { p: Fmt.price(price) }))}</th></tr></thead>`
      + `<tbody>${rows}<tr class="sum"><td><b>${e(T("Trung bình"))}</b></td><td><b>${f.average ? Fmt.en(f.average, 2) : "—"}</b></td><td>${pct(f.upside)}</td></tr></tbody></table>`
      + inputs + `<p class="muted pad">${e(T("Chỉ để tham khảo, không phải khuyến nghị đầu tư."))}</p>`;
  }

  function bands(hist, b) {
    const one = (code, name) => {
      const st = b[code];
      if (st && !(st.current > 0)) return `<p class="pad"><b>${name}</b> ${e(T("hiện âm hoặc chưa có (doanh nghiệp lỗ) — không so được với lịch sử."))}</p>`;
      if (!st) return `<p class="muted pad">${e(T("Chưa đủ dữ liệu {n} lịch sử.", { n: name }))}</p>`;
      return `<div class="bandhead"><b>${name}</b> ${e(T("hiện tại {c} · TB {m} · thấp nhất {lo} · cao nhất {hi}", { c: Fmt.en(st.current, 2), m: Fmt.en(st.mean, 2), lo: Fmt.en(st.min, 2), hi: Fmt.en(st.max, 2) }))}`
        + ` · <span class="${st.percentile < 35 ? "up" : st.percentile > 65 ? "down" : "ref"}">${e(T("cao hơn {p}% số phiên trong 5 năm", { p: Fmt.en(st.percentile, 0) }))}</span></div>`
        + VSvg.band(hist[code], st, T("TB"));
    };
    return sec(T("Định giá lịch sử 5 năm")) + one("pe", "P/E") + one("pb", "P/B");
  }

  function health(pio, alt) {
    if (!pio && !alt) return sec(T("Điểm sức khoẻ tài chính")) + `<p class="muted pad">${e(T("Piotroski và Altman Z không áp dụng cho ngân hàng, chứng khoán, bảo hiểm (hoặc thiếu 2 năm báo cáo)."))}</p>`;
    const zone = { safe: ["up", "An toàn"], grey: ["ref", "Vùng xám"], distress: ["down", "Nguy cơ"] };
    return sec(T("Điểm sức khoẻ tài chính"))
      + (pio ? `<details open><summary><b>Piotroski F-score ${pio.score}/9</b>${pio.known < 9 ? ` <span class="muted">${e(T("({n} tiêu chí thiếu dữ liệu)", { n: 9 - pio.known }))}</span>` : ""}</summary><ul class="checks">${pio.checks.map(c => `<li>${mark(c.pass)} ${e(T(PIO[c.key]))}</li>`).join("")}</ul></details>` : "")
      + (alt ? `<p class="pad">Altman Z = <b class="${zone[alt.zone][0]}">${Fmt.en(alt.z, 2)} — ${e(T(zone[alt.zone][1]))}</b> <span class="muted">${e(T("(> 2,99 an toàn · 1,81–2,99 vùng xám · < 1,81 nguy cơ)"))}</span></p>` : "");
  }

  // Top 10 peers by market cap (the ticker itself always listed) + sector median.
  function peers(p, sym, lang) {
    if (!p || p.list.length < 2) return "";
    const shown = p.list.slice(0, 10);
    if (!shown.some(x => x.sym === sym)) { const me = p.list.find(x => x.sym === sym); if (me) shown.push(me); }
    const med = k => Valuation.median(p.list.map(x => x[k]).filter(v => Number.isFinite(v) && (k !== "pe" || v > 0)));
    const f = (v, d = 2, mul = 1) => Number.isFinite(v) ? Fmt.en(v * mul, d) : "—";
    const row = (x, cls = "") => `<tr${x.sym ? ` data-sym="${e(x.sym)}"` : ""} class="${cls}"><td><b>${e(x.sym || T("Trung vị ngành"))}</b></td><td>${f(x.mcap, 0, 1e-9)}</td>`
      + `<td>${f(x.pe)}</td><td>${f(x.pb)}</td><td>${f(x.roe, 1, 100)}</td><td>${f(x.dy, 1, 100)}</td></tr>`;
    return sec(T("So sánh cùng ngành: {s} ({n} mã)", { s: Market.sectorName(p.code, lang), n: p.list.length }))
      + `<table class="dtable num peers"><thead><tr><th>${e(T("Mã"))}</th><th>${e(T("Vốn hoá (tỷ)"))}</th><th>P/E</th><th>P/B</th><th>ROE %</th><th>${e(T("Cổ tức %"))}</th></tr></thead><tbody>`
      + shown.map(x => row(x, x.sym === sym ? "me" : "")).join("") + row({ mcap: med("mcap"), pe: med("pe"), pb: med("pb"), roe: med("roe"), dy: med("dy") }, "sum") + `</tbody></table>`;
  }

  return { snowflake, fair, bands, health, peers };
})();
// "Định giá" tab: load ratios + 5-year P/E–P/B history + annual statements + estimates + dividends, compute scores, keep DCF assumptions editable.
const ValTab = (() => {
  const PE = "PRICE_TO_EARNINGS", PB = "PRICE_TO_BOOK";
  const ymd = d => d.toISOString().slice(0, 10);
  const yearsAgo = n => { const d = new Date(); d.setUTCFullYear(d.getUTCFullYear() - n); return ymd(d); };

  async function load(sym) {
    // Only ratios + annual statements are essential; history / estimates / dividends fall back to empty on failure.
    const safe = (p, fb) => p.catch(err => { console.warn("ValTab.load - optional part fail", sym, err); return fb; });
    const [r, hist, annual, est, divs, peers] = await Promise.all([
      Finfo.ratios(sym), safe(Finfo.ratioHistory(sym, [PE, PB], yearsAgo(5)), { [PE]: [], [PB]: [] }),
      Finfo.items(sym, "ANNUAL", Health.CODES, `${new Date().getUTCFullYear() - 7}-01-01`),
      safe(Finfo.items(sym, "ESTIMATION", [21001, 421701, 23000], `${new Date().getUTCFullYear() - 1}-01-01`), []), safe(Finfo.dividends(sym), []), safe(loadPeers(sym), null),
    ]);
    const years = Health.byYear(annual), y0 = years[0];
    if (peers) peers.sym = sym;
    // Estimate for the year after the latest audited one; dividends summed per year, newest complete year first.
    const nextYear = y0 ? y0.year + 1 : new Date().getUTCFullYear(), estRows = Health.byYear(est).find(y => y.year === nextYear);
    const perYear = {};
    for (const d of divs) if (+d.divYear > 1990 && +d.dividend > 0) perYear[+d.divYear] = (perYear[+d.divYear] || 0) + +d.dividend;
    const divYears = y0 ? [0, 1, 2, 3].map(i => perYear[y0.year - i] || 0) : [];
    return { r, hist: { pe: hist[PE], pb: hist[PB] }, years, est: estRows ? { rev: estRows.v[21001] ?? estRows.v[421701] ?? null, np: estRows.v[23000] ?? null } : null,
      divs: divYears, dcf: Health.dcfInputs(years, r.OUTSTANDING_SHARES), peers, sym };
  }

  // Same ICB level-3 sector (level 2 when level 3 has < 3 tickers); reuses the whole-market ratios when already loaded.
  async function loadPeers(sym) {
    const sec = await Market.sectorsLoad(), mine = sec.of.get(sym);
    if (!mine) return null;
    const pick = [3, 2].map(l => sec.levels[l].find(x => x.code === mine[l])).find(g => g && g.codes.length >= 3);
    if (!pick) return null;
    const codes = pick.codes.slice(0, 300), all = Market.ratios(), m = all || await Market.ratiosFor(codes);
    const list = codes.map(c => ({ sym: c, ...(m.get(c) || {}) })).filter(x => x.mcap > 0).sort((a, b) => b.mcap - a.mcap);
    return { code: pick.code, list };
  }

  // Everything below is recomputed on render so DCF edits and live price changes apply without refetching.
  function compute(d, price) {
    const band = { pe: Valuation.band(d.hist.pe), pb: Valuation.band(d.hist.pb) };
    const dcf = d.dcf && d.dcf.fcf0 > 0 ? d.dcf : null;
    const fair = Valuation.fairValues({ price, eps: d.r.EPS_TR, bvps: d.r.BVPS_CR, peMedian: band.pe?.median, pbMedian: band.pb?.median, dcf });
    const pio = Health.piotroski(d.years), alt = Health.altman(d.years, d.r.MARKETCAP);
    const dims = Health.snowflake({ r: d.r, band, fair, years: d.years, est: d.est, divs: d.divs, pio, alt, price });
    return { band, fair, pio, alt, dims, dcf };
  }

  function html(d, price) {
    if (!d.years.length && !Object.keys(d.r).length) return TabHtml.empty(T("Chưa có dữ liệu định giá cho mã này."));
    const c = compute(d, price);
    return ValHtml.snowflake(c.dims) + ValHtml.fair(c.fair, c.dcf, price) + ValHtml.bands(d.hist, c.band) + ValHtml.health(c.pio, c.alt) + ValHtml.peers(d.peers, d.sym, I18n.lang)
      + `<p class="muted pad">${Dom.esc(T("Điểm tự tính từ BCTC năm và chỉ số của VNDirect; công thức ghi trong tài liệu tool."))}</p>`;
  }

  // DCF input edit → returns true when the data changed (caller re-renders).
  function edit(d, el) {
    const k = el.dataset.k, v = parseFloat(el.value);
    if (!d || !d.dcf || !["g", "wacc", "tg"].includes(k) || !Number.isFinite(v)) return false;
    const next = { ...d.dcf, [k]: Math.max(k === "wacc" ? 1 : -10, Math.min(40, v)) };
    next.tg = Math.min(next.tg, next.wacc - 0.5);
    d.dcf = next;
    return true;
  }

  return { load, html, edit, compute };
})();
// Overview extras: price performance by period vs VNINDEX (daily candles) and foreign investors' net flow (20 / 60 / 120 sessions).
const OverviewExtra = (() => {
  const FLOW_N = [20, 60, 120];
  const LABEL = { "1W": "1 tuần", "1M": "1 tháng", "3M": "3 tháng", YTD: "Từ đầu năm", "1Y": "1 năm", "3Y": "3 năm", "5Y": "5 năm" };
  let flowN = 20;
  const e = s => Dom.esc(s ?? "");

  async function load(sym) {
    const now = Math.floor(Date.now() / 1000), from = now - 6 * 366 * 86400;
    // Each part degrades on its own: a failed candle or flow request leaves that block empty instead of failing the tab.
    const safe = p => p.catch(err => { console.warn("OverviewExtra.load - part fail", sym, err); return null; });
    const [bars, idx, flows] = await Promise.all([safe(History.load(sym, "D", from, now)), safe(History.load("VNINDEX", "D", from, now)), safe(Finfo.foreigns(sym, 120))]);
    return { perf: bars ? Valuation.perf(bars) : null, idx: idx ? Valuation.perf(idx) : null, flows: flows ? flows.slice().reverse() : null };
  }

  const pct = v => Number.isFinite(v) ? `<span class="${v > 0 ? "up" : v < 0 ? "down" : "ref"}">${Fmt.signed(v, 1)}%</span>` : "—";

  function perfHtml(p, idx) {
    if (!p) return "";
    const rows = Valuation.PERIODS.map(([k]) => {
      const rel = Number.isFinite(p[k]) && idx && Number.isFinite(idx[k]) ? p[k] - idx[k] : null;
      return `<tr><td>${e(T(LABEL[k]))}</td><td>${pct(p[k])}</td><td>${idx ? pct(idx[k]) : "—"}</td><td>${pct(rel)}</td></tr>`;
    }).join("");
    return `<div class="dsec"><b>${e(T("Hiệu suất giá"))}</b></div><table class="dtable num"><thead><tr><th>${e(T("Kỳ"))}</th><th>${e(T("Mã"))}</th><th>VNINDEX</th><th>${e(T("Chênh lệch"))}</th></tr></thead><tbody>${rows}</tbody></table>`;
  }

  function flowHtml(list) {
    if (!list || !list.length) return "";
    const last = list.slice(-flowN), net = last.reduce((s, x) => s + (+x.netVal || 0), 0), cur = list[list.length - 1];
    const room = +cur.totalRoom > 0 ? +cur.currentRoom / +cur.totalRoom * 100 : null;
    const seg = `<span class="seg">${FLOW_N.map(n => `<button data-act="flow" data-v="${n}"${n === flowN ? ' class="on"' : ""}>${n}</button>`).join("")}</span>`;
    return `<div class="dsec"><b>${e(T("Khối ngoại mua/bán ròng"))}</b>${seg}</div>`
      + VSvg.flows(last.map(x => +x.netVal / 1e9))
      + `<p class="pad">${e(T("{n} phiên: ròng {v} tỷ", { n: last.length, v: Fmt.signed(net / 1e9, 1) }))}`
      + (room != null ? ` · ${e(T("room còn {r}%", { r: Fmt.en(room, 1) }))}` : "") + `</p>`;
  }

  // Returns true when the click changed the view.
  function act(el) {
    if (el.dataset.act !== "flow") return false;
    const n = +el.dataset.v;
    if (!FLOW_N.includes(n) || n === flowN) return false;
    flowN = n;
    return true;
  }

  return { load, html: x => x ? perfHtml(x.perf, x.idx) + flowHtml(x.flows) : "", act };
})();
// "Thị trường" tab → buy / sell ideas: on demand, fetch 2 years of daily candles per ticker in the chosen universe, score them, rank with Picks.
const PicksView = (() => {
  const UNIS = [["VN30", "VN30"], ["VN100", "VN100"], ["VN100+HNX30", "VN100 + HNX30"], ["watch", "★ Danh mục"]];
  const HORIZON = [["Short", "Ngắn hạn (1–2 tuần)"], ["Medium", "Trung hạn (1–3 tháng)"], ["Long", "Dài hạn (trên 1 năm)"]];
  const e = s => Dom.esc(s ?? "");
  let uni = UNIS.some(u => u[0] === Prefs.get("picksUni")) ? Prefs.get("picksUni") : "VN100", result = cached(), progress = null, seq = 0, error = false;
  const listeners = [];
  const changed = () => listeners.forEach(f => f());

  function cached() {
    const c = Prefs.get("picks", null);
    return c && c.day === QuoteModel.vnDate() && c.uni === Prefs.get("picksUni", "VN100") && c.picks ? c : null;
  }

  async function universe() {
    if (uni === "watch") return Watch.all();
    if (uni === "VN100+HNX30") return [...new Set([...(await Feed.list("VN100")), ...(await Feed.list("HNX30"))])];
    return Feed.list(uni);
  }

  // One ticker → ranking row (technical scores from its own candles, valuation vs. sector median P/E).
  function row(sym, bars, r, secPe, q) {
    const d = TechOutlook.frame(bars, "D", []), w = TechOutlook.frame(ChartRange.shape(bars, "1W"), "W", []), c = bars.map(b => b.close), last = c[c.length - 1];
    const ma200 = c.length >= 200 ? c.slice(-200).reduce((s, x) => s + x, 0) / 200 : null, yAgo = bars.find(b => b.time >= bars[bars.length - 1].time - 365 * 86400);
    return { sym, price: q?.last || q?.ref || last, d: d?.score, rsi: d?.rsi, w: w?.score, above200: ma200 ? last > ma200 : null, ret1y: yAgo ? (last / yAgo.close - 1) * 100 : null,
      pe: r?.pe, pb: r?.pb, roe: Number.isFinite(r?.roe) ? r.roe * 100 : null, dy: Number.isFinite(r?.dy) ? r.dy * 100 : null, secPe, value: q ? Mkt.value(q) / 1e9 : null };
  }

  async function run() {
    const my = ++seq;
    error = false; progress = { done: 0, total: 0 }; changed();
    try {
      const syms = (await universe()).slice(0, 300);
      progress.total = syms.length; changed();
      const sec = await Market.sectorsLoad(), all = await Market.ratiosAll().catch(() => null), ratios = all || await Market.ratiosFor(syms);
      const secMed = Picks.sectorPe([...ratios].map(([s, r]) => ({ sector: sec.of.get(s)?.[2], pe: r.pe })));
      const now = Math.floor(Date.now() / 1000), rows = [], quotes = Board.state().quotes;
      let next = 0;
      const worker = async () => {
        while (next < syms.length && my === seq) {
          const s = syms[next++];
          try { const bars = await History.load(s, "D", now - 2 * 366 * 86400, now); if (bars.length >= 60) rows.push(row(s, bars, ratios.get(s), secMed.get(sec.of.get(s)?.[2]), quotes.get(s))); }
          catch (err) { console.warn("PicksView.run - candles fail", s, err); }
          progress.done++;
          if (progress.done % 10 === 0) changed();
        }
      };
      await Promise.all(Array.from({ length: 6 }, worker));
      if (my !== seq) return;
      result = { day: QuoteModel.vnDate(), uni, at: Date.now(), n: rows.length, picks: Picks.rank(rows) };
      Prefs.set("picks", result);
    } catch (err) { console.warn("PicksView.run - fail", err); if (my === seq) error = true; }
    if (my === seq) { progress = null; changed(); }
  }

  const sg = v => Fmt.signed(v, 0);
  const REASON = { day: v => T("Ngày {v}", { v: sg(v) }), week: v => T("Tuần {v}", { v: sg(v) }), rsi: v => T("RSI {v}", { v: Fmt.en(v, 0) }), above200: () => T("Trên MA200"),
    below200: () => T("Dưới MA200"), pe: v => T("P/E {v}", { v: Fmt.en(v, 1) }), secPe: v => T("P/E ngành {v}", { v: Fmt.en(v, 1) }), roe: v => T("ROE {v}%", { v: Fmt.en(v, 0) }),
    dy: v => T("Cổ tức {v}%", { v: Fmt.en(v, 1) }), cheap: () => T("Rẻ hơn ngành"), dear: () => T("Đắt hơn ngành") };

  function list(items, side) {
    if (!items.length) return `<p class="muted pad">${e(T("Không có mã nào đạt tiêu chí."))}</p>`;
    return `<table class="dtable picks-t">${items.map(x => `<tr data-sym="${e(x.sym)}"><td><b class="${side === "buy" ? "up" : "down"}">${e(x.sym)}</b></td><td>${Fmt.price(x.price)}</td>`
      + `<td>${x.reasons.map(r => `<span class="rchip">${e(REASON[r.key] ? REASON[r.key](r.v) : r.key)}</span>`).join("")}</td></tr>`).join("")}</table>`;
  }

  function html() {
    const opts = UNIS.map(([k, l]) => `<option value="${k}"${k === uni ? " selected" : ""}>${e(T(l))}</option>`).join("");
    const state = progress ? T("Đang phân tích {d}/{n} mã…", { d: progress.done, n: progress.total || "…" }) : error ? T("Phân tích lỗi — thử lại sau.")
      : result ? T("Phân tích lúc {t} · {n} mã", { t: new Date(result.at).toLocaleTimeString(I18n.lang === "en" ? "en-GB" : "vi-VN", { hour12: false }), n: result.n }) : "";
    const head = `<div class="dsec"><b>${e(T("Gợi ý mua / bán"))}</b><select data-picks="uni" title="${e(T("Phạm vi mã được phân tích"))}">${opts}</select>`
      + `<button data-picks="run"${progress ? " disabled" : ""}>🔍 ${e(T("Phân tích"))}</button><span class="muted">${e(state)}</span></div>`;
    if (!result) return head + `<p class="muted pad">${e(T("Bấm “Phân tích” để chấm điểm các mã trong phạm vi (tải lịch sử giá 2 năm từng mã, khoảng 10–40 giây)."))}</p>`;
    const side = (s, title) => `<div class="pick-col ${s}"><h4>${e(T(title))}</h4>` + HORIZON.map(([h, l]) => `<div class="pick-h">${e(T(l))}</div>${list(result.picks[s + h] || [], s)}`).join("") + `</div>`;
    const buy = side("buy", "Nên cân nhắc mua"), sell = side("sell", "Nên cân nhắc bán / tránh");
    return head + `<div class="picks">${buy}${sell}</div>`
      + `<p class="muted pad">${e(T("Gợi ý tự động theo quy tắc: ngắn hạn = điểm kỹ thuật ngày + RSI, trung hạn = điểm tuần + MA200, dài hạn = P/E so với trung vị ngành, ROE, cổ tức. Một mã có thể vừa đáng mua dài hạn (rẻ, lãi tốt) vừa nên tránh ngắn hạn (xu hướng đang giảm). Không phải khuyến nghị đầu tư; tự kiểm tra trước khi giao dịch."))}</p>`;
  }

  // Returns true when the market view should re-render.
  function act(el, ev) {
    if (ev === "change" && el.dataset.picks === "uni" && UNIS.some(u => u[0] === el.value)) { uni = el.value; Prefs.set("picksUni", uni); result = cached(); seq++; progress = null; return true; }
    if (ev === "click" && el.dataset.picks === "run" && !progress) { run(); return true; }
    return false;
  }

  return { html, act, onChange: f => listeners.push(f) };
})();
// "Thị trường" tab: breadth per exchange, heatmap (ICB industry → tickers, area = market cap, colour = % change), sector strength, top lists.
const MarketView = (() => {
  const EX = ["HOSE", "HNX", "UPCOM"], SIZES = [100, 200, 400];
  let heatEx = [...EX, "ALL"].includes(Prefs.get("heatEx")) ? Prefs.get("heatEx") : "HOSE", heatN = SIZES.includes(Prefs.get("heatN")) ? Prefs.get("heatN") : 200;
  const e = s => Dom.esc(s ?? "");
  const bn = v => Fmt.en(v / 1e9, 0);

  // −7 % … 0 … +7 % → red … grey … green; ceiling / floor keep the board colours.
  function color(q) {
    const t = q.last ? QuoteModel.tone(q.last, q) : "";
    if (t === "ceil") return "#a21caf";
    if (t === "floor") return "#0284c7";
    const p = Math.max(-7, Math.min(7, q.last ? q.pct : 0)) / 7, base = [71, 85, 105];
    const to = p >= 0 ? [22, 163, 74] : [220, 38, 38], k = Math.abs(p) ** 0.7;
    return `rgb(${base.map((b, i) => Math.round(b + (to[i] - b) * k)).join(",")})`;
  }

  function breadthHtml(quotes) {
    return `<div class="mk-breadth">` + EX.map(ex => {
      const b = Mkt.breadth(quotes.filter(q => q.ex === ex)), n = b.ceil + b.up + b.same + b.down + b.floor || 1;
      const seg = (k, cls) => b[k] ? `<i class="${cls}" style="width:${(b[k] / n * 100).toFixed(1)}%"></i>` : "";
      return `<div class="mk-card"><b>${ex}</b><div class="mk-bar">${seg("ceil", "ceil")}${seg("up", "up")}${seg("same", "ref")}${seg("down", "down")}${seg("floor", "floor")}</div>`
        + `<div class="mk-nums"><span class="ceil">${b.ceil}</span> <span class="up">▲${b.up}</span> <span class="ref">■${b.same}</span> <span class="down">▼${b.down}</span> <span class="floor">${b.floor}</span>`
        + ` · ${e(T("{v} tỷ", { v: bn(b.value) }))}</div></div>`;
    }).join("") + `</div>`;
  }

  function heatmapSvg(quotes, lang) {
    const sec = Market.sectors(), r = Market.ratios(), W = 1000, H = 560;
    const pool = quotes.filter(q => (heatEx === "ALL" || q.ex === heatEx) && q.ref);
    const weight = q => (r && r.get(q.sym)?.mcap) || Mkt.value(q);
    const chosen = pool.filter(q => weight(q) > 0).sort((a, b) => weight(b) - weight(a)).slice(0, heatN);
    if (!chosen.length) return `<p class="muted pad">${e(T("Chưa có dữ liệu để vẽ heatmap."))}</p>`;
    const groups = new Map();
    for (const q of chosen) { const code = sec?.of.get(q.sym)?.[1] || "other"; (groups.get(code) || groups.set(code, []).get(code)).push(q); }
    const boxes = Mkt.treemap([...groups].map(([key, list]) => ({ key, w: list.reduce((s, q) => s + weight(q), 0) })), 0, 0, W, H);
    let out = "";
    for (const b of boxes) {
      const list = groups.get(b.key), head = b.h > 30 && b.w > 60 ? 14 : 0;
      out += `<rect class="mk-sector" x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}"/>`;
      if (head) out += `<text class="mk-sname" x="${b.x + 3}" y="${b.y + 11}">${e(b.key === "other" ? T("Khác") : Market.sectorName(b.key, lang))}</text>`;
      for (const c of Mkt.treemap(list.map(q => ({ key: q.sym, w: weight(q) })), b.x + 1, b.y + head + 1, b.w - 2, b.h - head - 2)) {
        const q = list.find(x => x.sym === c.key), big = c.w > 34 && c.h > 20;
        out += `<g data-sym="${e(q.sym)}"><title>${e(q.sym)} ${Fmt.pct(q, q.pct)}</title><rect x="${c.x.toFixed(1)}" y="${c.y.toFixed(1)}" width="${Math.max(0, c.w - 1).toFixed(1)}" height="${Math.max(0, c.h - 1).toFixed(1)}" fill="${color(q)}"/>`
          + (big ? `<text x="${(c.x + c.w / 2).toFixed(1)}" y="${(c.y + c.h / 2).toFixed(1)}" text-anchor="middle" class="mk-sym" style="font-size:${Math.min(22, Math.max(9, Math.min(c.w / 4, c.h / 2.6))).toFixed(0)}px">${e(q.sym)}`
            + (c.h > 34 ? `<tspan x="${(c.x + c.w / 2).toFixed(1)}" dy="1.15em" class="mk-pct">${Fmt.pct(q, q.pct)}</tspan>` : "") + `</text>` : "") + `</g>`;
      }
    }
    return `<svg viewBox="0 0 ${W} ${H}" class="heatmap" role="img">${out}</svg>`;
  }

  function sectorsHtml(quotes, lang) {
    const sec = Market.sectors(), r = Market.ratios();
    if (!sec) return "";
    const perf = Mkt.sectorPerf(quotes, s => sec.of.get(s)?.[2], s => r?.get(s)?.mcap);
    const max = Math.max(1, ...perf.map(p => Math.abs(p.pct)));
    return `<div class="dsec"><b>${e(T("Sức mạnh ngành hôm nay (ICB cấp 2, theo vốn hoá)"))}</b></div><div class="mk-sectors">` + perf.map(p =>
      `<button class="mk-srow" data-tab="icb:${e(p.code)}" title="${e(T("Mở bảng giá ngành"))}"><span>${e(Market.sectorName(p.code, lang))}</span>`
      + `<i class="${p.pct >= 0 ? "upb" : "downb"}" style="width:${(Math.abs(p.pct) / max * 45).toFixed(1)}%"></i><b class="${p.pct > 0 ? "up" : p.pct < 0 ? "down" : "ref"}">${Fmt.signed(p.pct)}%</b>`
      + `<em>▲${p.up} ▼${p.down}</em></button>`).join("") + `</div>`;
  }

  function topTable(title, list, cell) {
    return `<div class="mk-top"><b>${e(title)}</b><table class="dtable num">${list.map(q => `<tr data-sym="${e(q.sym)}"><td><b>${e(q.sym)}</b></td>`
      + `<td class="${QuoteModel.tone(q.last, q)}">${Fmt.price(q.last)}</td><td>${cell(q)}</td></tr>`).join("")}</table></div>`;
  }

  function topsHtml(quotes) {
    const pct = q => `<span class="${QuoteModel.tone(q.last, q)}">${Fmt.pct(q, q.pct)}</span>`, val = q => Fmt.en(Mkt.value(q) / 1e9, 1), fn = q => Fmt.signed(Mkt.foreignNet(q) / 1e9, 1);
    const liquid = quotes.filter(q => Mkt.value(q) > 1e9);
    return `<div class="mk-tops">` + topTable(T("Tăng mạnh nhất"), Mkt.top(liquid, q => q.pct), pct) + topTable(T("Giảm mạnh nhất"), Mkt.top(liquid, q => q.pct, 10, true), pct)
      + topTable(T("GTGD lớn nhất (tỷ)"), Mkt.top(quotes, Mkt.value), val) + topTable(T("NN mua ròng (tỷ)"), Mkt.top(quotes, Mkt.foreignNet), fn)
      + topTable(T("NN bán ròng (tỷ)"), Mkt.top(quotes, Mkt.foreignNet, 10, true), fn) + `</div>`;
  }

  function html(quotes, lang) {
    const p = Market.progress(), seg = (k, list, cur) => `<span class="seg">${list.map(([v, l]) => `<button data-${k}="${v}"${String(v) === String(cur) ? ' class="on"' : ""}>${e(l)}</button>`).join("")}</span>`;
    return (p ? `<p class="mk-progress">${e(T("Đang tải vốn hoá toàn thị trường {d}/{n}…", { d: p.done, n: p.total }))}</p>` : "")
      + breadthHtml(quotes) + PicksView.html()
      + `<div class="dsec"><b>Heatmap</b>${seg("heatex", [...EX.map(x => [x, x]), ["ALL", T("Tất cả")]], heatEx)}${seg("heatn", SIZES.map(n => [n, "Top " + n]), heatN)}</div>`
      + heatmapSvg(quotes, lang) + `<p class="muted pad">${e(T("Ô = vốn hoá (khi chưa có vốn hoá: giá trị giao dịch), màu = % thay đổi; bấm ô để xem chi tiết mã."))}</p>`
      + sectorsHtml(quotes, lang) + topsHtml(quotes);
  }

  // Returns true when a heatmap option changed.
  function act(el) {
    if (el.dataset.heatex && [...EX, "ALL"].includes(el.dataset.heatex)) { heatEx = el.dataset.heatex; Prefs.set("heatEx", heatEx); return true; }
    if (SIZES.includes(+el.dataset.heatn)) { heatN = +el.dataset.heatn; Prefs.set("heatN", heatN); return true; }
    return false;
  }

  return { html, act };
})();
// "Bộ lọc" tab: whole-market screener (exchange, sector, market cap, P/E, P/B, ROE, dividend yield, % change, traded value) with presets.
const ScreenView = (() => {
  const INPUTS = [["mcapMin", "Vốn hoá ≥ (tỷ)"], ["peMin", "P/E từ"], ["peMax", "P/E đến"], ["pbMax", "P/B ≤"], ["roeMin", "ROE ≥ (%)"], ["dyMin", "Cổ tức ≥ (%)"],
    ["pctMin", "% hôm nay từ"], ["pctMax", "% hôm nay đến"], ["valueMin", "GTGD ≥ (tỷ)"]];
  const COLS = [["sym", "Mã"], ["ex", "Sàn"], ["price", "Giá"], ["pct", "%"], ["value", "GTGD (tỷ)"], ["mcap", "Vốn hoá (tỷ)"], ["pe", "P/E"], ["pb", "P/B"], ["roe", "ROE %"], ["dy", "Cổ tức %"]];
  const MAX_ROWS = 300;
  const clean = raw => {
    const c = {}, src = raw && typeof raw.c === "object" ? raw.c : {};
    for (const k of Mkt.FIELDS) c[k] = Number.isFinite(parseFloat(src[k])) ? String(parseFloat(src[k])) : "";
    c.ex = ["HOSE", "HNX", "UPCOM"].includes(src.ex) ? src.ex : "";
    c.sector = /^\d{4}$/.test(src.sector || "") ? src.sector : "";
    const sk = COLS.some(x => x[0] === raw?.sort?.key) ? raw.sort.key : "mcap";
    return { c, sort: { key: sk, dir: raw?.sort?.dir === 1 ? 1 : -1 } };
  };
  let st = clean(Prefs.get("scr", { c: Mkt.PRESETS.value.c })), last = [];
  const e = s => Dom.esc(s ?? "");
  const save = () => Prefs.set("scr", st);

  function form(lang) {
    const sec = Market.sectors(), opt = (v, l, cur) => `<option value="${e(v)}"${v === cur ? " selected" : ""}>${e(l)}</option>`;
    const sectors = sec ? sec.levels[2].map(s => [s.code, lang === "en" && s.en ? s.en : s.vi]).sort((a, b) => a[1].localeCompare(b[1])) : [];
    return `<div class="cbar"><select data-scr="preset"><option value="">${e(T("Bộ lọc mẫu…"))}</option>${Object.entries(Mkt.PRESETS).map(([k, p]) => opt(k, T(p.label), "")).join("")}</select>`
      + `<select data-scr="ex">${opt("", T("Mọi sàn"), st.c.ex)}${["HOSE", "HNX", "UPCOM"].map(x => opt(x, x, st.c.ex)).join("")}</select>`
      + `<select data-scr="sector">${opt("", T("Mọi ngành"), st.c.sector)}${sectors.map(([c, n]) => opt(c, n, st.c.sector)).join("")}</select>`
      + `<button data-scr="reset">${e(T("Xoá điều kiện"))}</button></div>`
      + `<div class="scr-form">${INPUTS.map(([k, l]) => `<label>${e(T(l))}<input type="number" step="any" data-scr-f="${k}" value="${e(st.c[k])}"></label>`).join("")}</div>`
      + `<div id="scrResults"></div>`;
  }

  // quotes: the market tab's live quotes; ratios may still be loading (then ratio criteria match nothing yet).
  function results(quotes) {
    if (quotes) last = quotes;
    const sec = Market.sectors(), r = Market.ratios(), p = Market.progress();
    const rows = last.map(q => Mkt.row(q, r?.get(q.sym), sec?.of.get(q.sym)?.[2] || ""));
    const { key, dir } = st.sort, val = x => x[key] ?? (dir > 0 ? Infinity : -Infinity);
    const hit = Mkt.screen(rows, st.c).sort((a, b) => (key === "sym" || key === "ex" ? String(a[key]).localeCompare(String(b[key])) : val(a) - val(b)) * dir);
    const f = (v, d = 2) => v == null ? "—" : Fmt.en(v, d);
    const head = COLS.map(([k, l]) => `<th data-sort="${k}">${e(T(l))}${k === key ? (dir > 0 ? " ▲" : " ▼") : ""}</th>`).join("") + "<th>★</th>";
    const body = hit.slice(0, MAX_ROWS).map(x => `<tr data-sym="${e(x.sym)}"><td><b>${e(x.sym)}</b></td><td>${e(x.ex)}</td><td>${Fmt.price(x.price)}</td>`
      + `<td class="${x.pct > 0 ? "up" : x.pct < 0 ? "down" : "ref"}">${Fmt.signed(x.pct)}%</td><td>${f(x.value, 1)}</td><td>${f(x.mcap, 0)}</td><td>${f(x.pe)}</td><td>${f(x.pb)}</td>`
      + `<td>${f(x.roe, 1)}</td><td>${f(x.dy, 1)}</td><td><button class="star${Watch.has(x.sym) ? " on" : ""}" data-scr="star">${Watch.has(x.sym) ? "★" : "☆"}</button></td></tr>`).join("");
    const el = $("scrResults");
    if (!el) return hit;
    el.innerHTML = (p ? `<p class="mk-progress">${e(T("Đang tải chỉ số toàn thị trường {d}/{n}…", { d: p.done, n: p.total }))}</p>` : "")
      + `<div class="cbar"><b>${e(T("{n} mã khớp", { n: hit.length }))}</b>${hit.length > MAX_ROWS ? ` <span class="muted">${e(T("(hiện {m} mã đầu)", { m: MAX_ROWS }))}</span>` : ""}`
      + `<button data-scr="addAll"${hit.length ? "" : " disabled"}>${e(T("★ Thêm tất cả vào danh mục"))}</button><button data-scr="csv"${hit.length ? "" : " disabled"}>⬇ CSV</button></div>`
      + `<div class="fscroll"><table class="dtable num scr">${`<thead><tr>${head}</tr></thead>`}<tbody>${body}</tbody></table></div>`;
    return hit;
  }

  function csv(hit) {
    const cell = v => v == null ? "" : /[",\n]/.test(String(v)) ? `"${String(v).replace(/"/g, '""')}"` : String(v);
    const lines = [COLS.map(([, l]) => cell(T(l))).join(","), ...hit.map(x => COLS.map(([k]) => cell(typeof x[k] === "number" ? +x[k].toFixed(4) : x[k])).join(","))];
    Dom.download(String.fromCharCode(0xfeff) + lines.join("\r\n"), `${T("bo-loc")}-${QuoteModel.vnDate()}.csv`, "text/csv;charset=utf-8");
  }

  // Returns "form" (rebuild form + results), "results", or false.
  function act(el, ev) {
    const a = el.dataset.scr, f = el.dataset.scrF;
    if (f && ev === "change") { st.c[f] = Number.isFinite(parseFloat(el.value)) ? String(parseFloat(el.value)) : ""; save(); return "results"; }
    if (ev === "change" && (a === "ex" || a === "sector")) { st.c[a] = el.value; st = clean(st); save(); return "results"; }
    if (ev === "change" && a === "preset" && Mkt.PRESETS[el.value]) { st = clean({ c: { ...Mkt.PRESETS[el.value].c, ex: st.c.ex, sector: st.c.sector }, sort: st.sort }); save(); return "form"; }
    if (ev !== "click") return false;
    if (a === "reset") { st = clean({ sort: st.sort }); save(); return "form"; }
    if (a === "addAll") { const syms = results().map(x => x.sym).slice(0, 300); if (!confirm(T("Thêm {n} mã vào danh mục ★?", { n: syms.length }))) return false; const n = Watch.add(syms).length; Controls.say("good", "✔ Đã thêm {n} mã vào danh mục.", { n }); return "results"; }
    if (a === "csv") { csv(results()); return false; }
    if (a === "star") { Watch.toggle(el.closest("tr").dataset.sym); return "results"; }
    const th = el.closest("th[data-sort]");
    if (th) { const k = th.dataset.sort; st.sort = { key: k, dir: st.sort.key === k ? -st.sort.dir : k === "sym" || k === "ex" ? 1 : -1 }; save(); return "results"; }
    return false;
  }

  return { form, results, act, get: () => JSON.parse(JSON.stringify(st)), set: raw => { st = clean(raw); save(); } };
})();
// "Thị trường" / "Bộ lọc" tabs: swap the price table for the market view, start the whole-market loads, route clicks and inputs.
const MarketTabs = (() => {
  const SPECIAL = new Set(["market", "screener"]);
  let tab = "", quotes = [];
  const is = t => SPECIAL.has(t);
  const view = () => $("marketView");

  function rebuild() {
    if (!tab) return;
    if (tab === "screener") { view().innerHTML = ScreenView.form(I18n.lang); ScreenView.results(quotes); }
    else view().innerHTML = MarketView.html(quotes, I18n.lang);
  }

  function show(t) {
    tab = is(t) ? t : "";
    $("boardBox").hidden = !!tab;
    view().hidden = !tab;
    if (!tab) return;
    Market.sectorsLoad().then(rebuild, err => console.warn("MarketTabs.show - load sectors fail", err));
    Market.ratiosAll().catch(err => { console.warn("MarketTabs.show - load market ratios fail", err); Controls.say("bad", "Không tải được chỉ số toàn thị trường từ VNDirect. Thử lại sau."); });
    rebuild();
  }

  function render(t, qs) {
    quotes = qs;
    if (t !== tab) return;
    if (tab === "screener") ScreenView.results(qs); else view().innerHTML = MarketView.html(qs, I18n.lang);
  }

  function init() {
    view().addEventListener("click", e => {
      const el = e.target.closest("button, th, [data-sym], [data-tab]");
      if (!el) return;
      if (tab === "screener") {
        const r = ScreenView.act(el, "click");
        if (r === "form") rebuild(); else if (r === "results") ScreenView.results();
        if (r || el.closest("button")) return;
      } else if (PicksView.act(el, "click") || MarketView.act(el)) { rebuild(); return; }
      if (el.dataset.tab) { Board.setBad([]); Board.setTab(el.dataset.tab); return; }
      const row = el.closest("[data-sym]");
      if (row) Board.select(row.dataset.sym, true);
    });
    view().addEventListener("change", e => {
      if (tab === "market") { if (PicksView.act(e.target, "change")) rebuild(); return; }
      if (tab !== "screener") return;
      const r = ScreenView.act(e.target, "change");
      if (r === "form") rebuild(); else if (r === "results") ScreenView.results();
    });
    Market.onChange(() => { if (tab) render(tab, quotes); });
    PicksView.onChange(() => { if (tab === "market") render(tab, quotes); });
    I18n.onChange(rebuild);
    Watch.onChange(() => { if (tab === "screener") ScreenView.results(); });
  }

  return { init, show, render, is };
})();
// Personal tools: 🔔 price alerts dialog + firing, 📅 watchlist event calendar, notes / own target block in the "Định giá" tab.
const PersonalUI = (() => {
  const TYPES = [["above", "Giá ≥"], ["below", "Giá ≤"], ["pctUp", "Tăng ≥ (%)"], ["pctDown", "Giảm ≥ (%)"]];
  const CAL_MAX = 40;
  const e = s => Dom.esc(s ?? "");
  const dlg = () => $("toolDlg");
  const typeLabel = t => T((TYPES.find(x => x[0] === t) || ["", t])[1]);
  const dmy = s => /^\d{4}-\d{2}-\d{2}/.test(s || "") ? `${s.slice(8, 10)}/${s.slice(5, 7)}/${s.slice(0, 4)}` : "";
  const canNotify = () => "Notification" in globalThis;
  const head = title => `<div class="dlg-head"><b>${e(title)}</b><button data-x="close" title="${e(T("Đóng (Esc)"))}">✕</button></div>`;

  function alertsHtml(sym) {

    const perm = canNotify() && Notification.permission !== "granted"
      ? `<button data-x="perm">${e(T("Bật thông báo trình duyệt"))}</button>` : "";
    const fired = a => a.fired === day ? T("Đã báo hôm nay") : T("Đang chờ");

    return head("🔔 " + T("Cảnh báo giá"))
      + `<div class="cbar"><input type="text" id="alSym" value="${e(sym)}" placeholder="${e(T("Mã"))}" spellcheck="false" autocomplete="off">`
      + `<select id="alType">${TYPES.map(([k, l]) => `<option value="${k}">${e(T(l))}</option>`).join("")}</select>`
      + `<input type="number" id="alVal" step="any" placeholder="${e(T("Giá trị"))}"><button class="main" data-x="add">${e(T("Thêm"))}</button>${perm}</div>`
      + `<p class="muted pad">${e(T("Giá tính bằng nghìn đồng. Chỉ báo khi trang này đang mở; mỗi cảnh báo báo tối đa 1 lần mỗi ngày; lưu trong trình duyệt này."))}</p>`
      + (rows ? `<table class="dtable"><tbody>${rows}</tbody></table>` : `<p class="muted pad">${e(T("Chưa có cảnh báo nào."))}</p>`);
  }

  function openAlerts(sym = "") {
    dlg().dataset.kind = "alerts";
    dlg().innerHTML = alertsHtml(sym);
    if (!dlg().open) dlg().showModal();
    $("alVal").focus();
  }

  // Re-render the open alerts dialog, keeping the half-filled form.
  function refreshAlerts() {
    const v = { s: $("alSym")?.value || "", t: $("alType")?.value, n: $("alVal")?.value || "" };
