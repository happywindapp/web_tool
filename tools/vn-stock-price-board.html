  // Unsaved note text / target of the ticker on screen (null when the block belongs to another ticker).
  const noteDraft = sym => { const box = document.querySelector(".notes[data-sym]"); return box && box.dataset.sym === sym ? { t: $("noteText").value, g: $("noteTarget").value } : null; };
  const restoreDraft = d => { if (d && $("noteText")) { $("noteText").value = d.t; $("noteTarget").value = d.g; } };

  async function openCalendar() {
    const syms = Watch.all().slice(0, CAL_MAX), my = (openCalendar.seq = (openCalendar.seq || 0) + 1);
    dlg().dataset.kind = "calendar";
    dlg().innerHTML = head("📅 " + T("Lịch sự kiện danh mục")) + `<p class="muted pad">${e(T("Đang tải sự kiện của {n} mã…", { n: syms.length }))}</p>`;
    if (!dlg().open) dlg().showModal();
    const today = new Date(Date.now() + 7 * 3600e3 - 3 * 86400e3).toISOString().slice(0, 10), rows = [];
    let next = 0;
    const worker = async () => {
      while (next < syms.length) {
        const s = syms[next++];
        try { for (const x of await Finfo.events(s, I18n.lang)) if ((x.effectiveDate || "") >= today) rows.push({ ...x, sym: s }); }
        catch (err) { console.warn("PersonalUI.openCalendar - get events fail", s, err); }
      }
    };
    await Promise.all(Array.from({ length: 6 }, worker));
    if (my !== openCalendar.seq || dlg().dataset.kind !== "calendar") return;
    rows.sort((a, b) => String(a.effectiveDate).localeCompare(String(b.effectiveDate)));
    dlg().innerHTML = head("📅 " + T("Lịch sự kiện danh mục"))
      + `<p class="muted pad">${e(T("Sự kiện có ngày GDKHQ / hiệu lực từ 3 ngày trước trở đi của các mã trong ★ Danh mục (tối đa {n} mã).", { n: CAL_MAX }))}</p>`
      + (rows.length ? `<table class="dtable"><thead><tr><th>${e(T("GDKHQ"))}</th><th>${e(T("Mã"))}</th><th>${e(T("Sự kiện"))}</th><th>${e(T("Thực hiện"))}</th></tr></thead><tbody>`
        + rows.map(x => `<tr data-sym="${e(x.sym)}"><td>${dmy(x.effectiveDate)}</td><td><b>${e(x.sym)}</b></td><td>${e(x.typeDesc)}${x.note ? `<div class="muted">${e(x.note)}</div>` : ""}</td><td>${dmy(x.actualDate)}</td></tr>`).join("")
        + `</tbody></table>` : `<p class="muted pad">${e(T("Không có sự kiện sắp tới."))}</p>`);
  }

  // Fired alerts → status line + browser notification when allowed.
  function onHits(hits, quotes) {
    for (const a of hits) {
      const q = quotes.get(a.sym), msg = T("🔔 {s}: {c} {v} — giá {p} ({pct})", { s: a.sym, c: typeLabel(a.type), v: Fmt.en(a.value, 2), p: Fmt.price(q.last), pct: Fmt.pct(q, q.pct) });
      Controls.say("warn", msg);
      if (canNotify() && Notification.permission === "granted") { try { new Notification(T("Cảnh báo giá"), { body: msg, tag: a.id }); } catch { /* some mobile browsers only allow service-worker notifications */ } }
    }
    if (hits.length && dlg().open && dlg().dataset.kind === "alerts") refreshAlerts();
  }

  function notesHtml(sym, price) {
    const n = Notes.get(sym), up = AlertRule.upside(n.target, price);
    return `<div class="dsec"><b>${e(T("Ghi chú & giá mục tiêu của bạn"))}</b></div><div class="notes pad" data-sym="${e(sym)}">`
      + `<label>${e(T("Giá mục tiêu (nghìn đồng)"))} <input type="number" step="any" id="noteTarget" value="${n.target ?? ""}"></label>`
      + (up != null ? ` <b class="${up > 0 ? "up" : "down"}">${Fmt.signed(up, 1)}%</b>` : "")
      + `<textarea id="noteText" rows="3" maxlength="2000" placeholder="${e(T("Luận điểm đầu tư, điều kiện mua/bán… (lưu trong trình duyệt này)"))}">${e(n.text)}</textarea>`
      + `<button data-act="saveNote">${e(T("Lưu ghi chú"))}</button></div>`;
  }

  function init() {
    $("alertsBtn").onclick = () => openAlerts(Board.state().sel);
    $("calBtn").onclick = openCalendar;
    dlg().addEventListener("click", ev => {
      const b = ev.target.closest("button[data-x]"), tr = ev.target.closest("tr[data-sym]");
      if (!b) { if (tr && dlg().dataset.kind === "calendar") { dlg().close(); Board.select(tr.dataset.sym, true); } return; }
      const x = b.dataset.x;
      if (x === "close") dlg().close();
      if (x === "perm") Notification.requestPermission().then(refreshAlerts);
      if (x === "del") { Alerts.remove(b.dataset.id); refreshAlerts(); }
      if (x === "add") {
        const sym = String($("alSym").value || "").trim().toUpperCase(), v = parseFloat($("alVal").value);
        if (!Alerts.add(sym, $("alType").value, v)) { Controls.say("bad", "Nhập mã đang niêm yết (không dùng chỉ số) và giá trị số cho cảnh báo."); return; }
        openAlerts(sym);
      }
    });
    const label = () => { const n = Alerts.all().length; $("alertsBtn").textContent = "🔔 " + T("Cảnh báo") + (n ? ` (${n})` : ""); };
    Alerts.onChange(label);
    I18n.onChange(label);
    label();
  }

  return { init, openAlerts, openCalendar, onHits, notesHtml, noteDraft, restoreDraft };
})();
// ★ watchlist management: named saves (💾 / 📂 / 🗑, shared SavedSessions), ⬇ export JSON, ⬆ import JSON / TXT / CSV.
const WatchIO = (() => {
  const say = (msg, cls) => Controls.say(cls === "muted" ? "muted" : cls || "good", msg);

  function exportFile() {
    const watch = Watch.all();
    if (!watch.length) { Controls.say("warn", "Danh mục trống."); return; }
    const json = WatchFile.build({ watch, notes: Notes.entries(), alerts: Alerts.all() });
    Dom.download(json, `${T("danh-muc")}-${QuoteModel.vnDate()}.json`, "application/json;charset=utf-8");
  }

  // Imported notes / alerts are untrusted: Notes.set and Alerts.add re-validate every field.
  function importText(name, text) {
    if (text == null) { Controls.say("bad", "Không đọc được file."); return; }
    let r;
    try { r = WatchFile.parse(text); } catch { Controls.say("bad", "File không có mã chứng khoán nào."); return; }
    // Free text can contain ordinary words that look like tickers → keep only listed tickers once the directory is loaded.
    if (Universe.ready()) { r.bad = r.bad.concat(r.symbols.filter(x => !Universe.has(x))); r.symbols = r.symbols.filter(x => Universe.has(x)); }
    if (!r.symbols.length) { Controls.say("bad", "File không có mã chứng khoán nào."); return; }
    let notes = 0, alerts = 0;
    for (const [sym, n] of Object.entries(r.notes)) if (r.symbols.includes(sym) && n && typeof n === "object") { Notes.set(sym, String(n.text || ""), +n.target); notes++; }
    const have = new Set(Alerts.all().map(a => `${a.sym}|${a.type}|${a.value}`));
    for (const a of r.alerts) if (!have.has(`${a.sym}|${a.type}|${+a.value}`) && Alerts.add(a.sym, a.type, a.value)) alerts++;
    Watch.replace(r.symbols);
    Board.setBad(r.bad);
    Board.setTab("watch");
    Controls.say("good", "✔ Đã nhập {n} mã từ {f} ({x} ghi chú, {a} cảnh báo).", { n: r.symbols.length, f: name, x: notes, a: alerts });
  }

  function init() {
    const saved = SavedSessions({ select: $("savedLists"), saveBtn: $("saveList"), delBtn: $("delList"), store: Prefs, key: "lists",
      snapshot: () => ({ watch: Watch.all() }), isEmpty: p => !p.watch.length, note: say,
      suggestName: () => T("Danh mục {d}", { d: new Date().toLocaleDateString(I18n.lang) }),
      open: p => { Watch.replace(WatchParse.clean(p.watch)); Board.setTab("watch"); } });
    I18n.onChange(() => saved.fill());
    $("exportList").onclick = exportFile;
    $("importList").onchange = e => { const f = e.target.files[0]; e.target.value = ""; if (f) Dom.readFile(f, importText); };
  }

  return { init, importText };
})();
// Detail pane tabs: switch panels, lazy-load each tab's data once per symbol, drop stale responses after a symbol change.
const DetailTabs = (() => {
  const TABS = [["overview", "Tổng quan"], ["valuation", "Định giá"], ["chart", "Kỹ thuật"], ["trades", "Khớp lệnh"], ["news", "Tin tức"], ["finance", "Tài chính"],
    ["events", "Sự kiện"], ["profile", "Hồ sơ"], ["recs", "Khuyến nghị"]];
  const IDS = new Set(TABS.map(x => x[0]));
  const PANEL = { overview: "dRatios", valuation: "dValuation", chart: "dOutlook", news: "dNews", finance: "dFinance", events: "dEvents", profile: "dProfile", recs: "dRecs" };
  let tab = IDS.has(Prefs.get("dtab")) ? Prefs.get("dtab") : "overview", sym = "", seq = 0, last = 0, quote = null, data = {}, loaded = {}, newsBusy = false;
  const req = {};

  function bar() {
    $("dTabs").innerHTML = TABS.map(([k, l]) => `<button data-dtab="${k}"${k === tab ? ' class="on"' : ""}>${Dom.esc(T(l))}</button>`).join("");
    document.querySelectorAll("#detail .dpanel").forEach(p => { p.hidden = p.dataset.tab !== tab; });
  }

  function render(k) {
    const el = $(PANEL[k]), d = data[k], lang = I18n.lang;
    if (!el) return;
    if (d === undefined) el.innerHTML = k === "finance" ? FinView.html(null, lang, T("Đang tải…")) : TabHtml.empty(T("Đang tải…"));
    else if (d === null && k === "valuation") el.innerHTML = PersonalUI.notesHtml(sym, last) + TabHtml.empty(T("Không tải được dữ liệu từ VNDirect. Thử lại sau."));
    else if (d === null) el.innerHTML = k === "finance" ? FinView.html(null, lang, T("Không tải được dữ liệu từ VNDirect. Thử lại sau.")) : TabHtml.empty(T("Không tải được dữ liệu từ VNDirect. Thử lại sau."));
    else if (k === "chart") el.innerHTML = OutlookView.html(d);
    else if (k === "overview") el.innerHTML = TabHtml.ratios(d.r) + OverviewExtra.html(d.x);
    else if (k === "valuation") { const keep = PersonalUI.noteDraft(sym); el.innerHTML = PersonalUI.notesHtml(sym, last) + ValTab.html(d, last); PersonalUI.restoreDraft(keep); }
    else if (k === "news") el.innerHTML = TabHtml.news(d.list, d.list.length < d.total);
    else if (k === "finance") el.innerHTML = FinView.html(d, lang);
    else if (k === "events") el.innerHTML = TabHtml.dividends(d.divs, last) + TabHtml.events(d.list);
    else if (k === "profile") el.innerHTML = TabHtml.profile(d.p, d.h, lang);
    else if (k === "recs") el.innerHTML = TradePlanView.html(d, quote) + TabHtml.recs(d.list, last);
  }

  const FETCH = {
    overview: async s => { const [r, x] = await Promise.all([Finfo.ratios(s), OverviewExtra.load(s)]); return { r, x }; },
    valuation: s => ValTab.load(s),
    chart: s => OutlookView.load(s),
    news: async s => { const r = await Finfo.news(s, 1); return { list: r.data, total: r.total, page: 1 }; },
    finance: s => FinView.load(s),
    events: async s => { const [list, divs] = await Promise.all([Finfo.events(s, I18n.lang), Finfo.dividends(s).catch(() => [])]); return { list, divs }; },
    profile: async s => { const [p, h] = await Promise.all([Finfo.profile(s), Finfo.shareholders(s)]); return { p, h }; },
    // Reuses the Kỹ thuật / Định giá data when those tabs were opened; only the analyst list is required.
    recs: async s => {
      const opt = (v, f) => v ? Promise.resolve(v) : f(s).catch(err => { console.warn("DetailTabs.recs - optional part fail", s, err); return null; });
      const [list, tech, val] = await Promise.all([Finfo.recommendations(s), opt(data.chart, OutlookView.load), opt(data.valuation, ValTab.load)]);
      return { list, tech, val };
    },
  };

  async function load(k = tab, force = false) {
    if (!sym || !FETCH[k] || (!force && loaded[k] === sym)) return;
    // seq: symbol changed; req[k]: a newer load of the same tab (quick kind/period clicks, language switch) was started.
    const my = seq, s = sym, tok = req[k] = (req[k] || 0) + 1;
    loaded[k] = s; delete data[k]; render(k);
    let v;
    try { v = await FETCH[k](s); } catch (err) { console.warn("DetailTabs.load - get finfo fail", k, s, err); v = null; }
    if (my !== seq || tok !== req[k]) return;
    data[k] = v;
    if (v === null) loaded[k] = "";
    render(k);
  }

  async function moreNews() {
    const d = data.news, my = seq;
    if (!d || newsBusy) return;
    newsBusy = true;
    try {
      const r = await Finfo.news(sym, d.page + 1);
      if (my !== seq) return;
      Object.assign(d, { list: d.list.concat(r.data), total: r.total, page: d.page + 1 });
    } catch (err) { console.warn("DetailTabs.moreNews - get news fail", sym, err); }
    finally { newsBusy = false; }
    if (my === seq) render("news");
  }

  function show(k) {
    if (!IDS.has(k)) return;
    tab = k; Prefs.set("dtab", k); bar();
    ChartCtl.setActive(k === "chart");
    load(k);
  }

  function setSymbol(s) {
    if (s === sym) return;
    sym = s; seq++; data = {}; loaded = {}; last = 0; quote = null;
    load("overview");
    if (tab !== "overview") load(tab);
  }

  function init() {
    bar();
    ChartCtl.setActive(tab === "chart");
    $("dTabs").addEventListener("click", e => { const b = e.target.closest("button[data-dtab]"); if (b) show(b.dataset.dtab); });
    $("dFinance").addEventListener("click", e => { const b = e.target.closest("button[data-act]"), r = b && FinView.act(b); if (r === "reload") load("finance", true); else if (r === "render") render("finance"); });
    $("dRatios").addEventListener("click", e => { const b = e.target.closest("button[data-act]"); if (b && data.overview && OverviewExtra.act(b)) render("overview"); });
    $("dValuation").addEventListener("click", e => {
      if (e.target.closest('[data-act="saveNote"]')) { Notes.set(sym, $("noteText").value, parseFloat($("noteTarget").value)); render("valuation"); Board.draw(true); Controls.say("good", "✔ Đã lưu ghi chú."); return; }
      const tr = e.target.closest("tr[data-sym]"); if (tr && tr.dataset.sym !== sym) Board.select(tr.dataset.sym, false);
    });
    $("dValuation").addEventListener("change", e => { const el = e.target.closest('input[data-act="dcf"]'); if (el && ValTab.edit(data.valuation, el)) render("valuation"); });
    $("dNews").addEventListener("click", e => { if (e.target.closest('[data-act="moreNews"]')) moreNews(); });
    // Events come per locale → refetch; the rest only re-render from memory.
    I18n.onChange(() => { bar(); delete data.events; loaded.events = ""; Object.keys(data).forEach(render); if (tab === "events") load("events"); });
  }

  return { init, show, setSymbol, reload: k => load(k, true), onQuote: q => { if (q && q.sym === sym) { last = q.last || q.ref; quote = q; } }, get: () => tab, IDS };
})();
// 🔗 share link (#pako: payload = tab + watchlist + options + sort + selected symbol), ?data= / ?demo= / ?tab= intake, demo dropdown.
const ShareDemo = (() => {
  const SORT_KEYS = new Set(BoardCols.COLS.map(c => c.sort).filter(Boolean));

  async function copyLink(payload, say) {
    let url;
    try { url = location.href.split(/[?#]/)[0] + "#" + await ShareCodec.encode(payload); }
    catch { say("bad", "Trình duyệt không hỗ trợ nén link (cần Chrome/Edge/Firefox/Safari mới)."); return; }
    const ok = await Dom.copy(url);
    if (!ok) { prompt(T("Chép link này:"), url); return; }
    say("good", location.protocol === "file:" ? "✔ Đã chép link ({n} ký tự) — mở bằng file:// nên link chỉ dùng được trên máy này." : "✔ Đã chép link ({n} ký tự).", { n: Fmt.en(url.length) });
  }

  // Untrusted payload → only known fields with the right types.
  function sanitize(p, tabs) {
    if (!p || typeof p !== "object") return null;
    const out = {};
    if (typeof p.tab === "string" && Board.validTab(p.tab)) out.tab = p.tab;
    if (Array.isArray(p.watch)) out.watch = WatchParse.clean(p.watch);
    if (p.opts && typeof p.opts === "object") out.opts = p.opts;
    if (p.sort && SORT_KEYS.has(p.sort.key) && (p.sort.dir === 1 || p.sort.dir === -1)) out.sort = { key: p.sort.key, dir: p.sort.dir };
    if (WatchParse.isSymbol(p.sym)) out.sym = p.sym;
    if (p.chart && typeof p.chart === "object") out.chart = p.chart;
    if (typeof p.dtab === "string" && DetailTabs.IDS.has(p.dtab)) out.dtab = p.dtab;
    if (p.fin && typeof p.fin === "object") out.fin = p.fin;
    return out;
  }

  const fromText = text => { const r = WatchParse.parse(text); return { tab: "watch", watch: r.symbols, bad: r.bad }; };

  // Reads hash / query once, then strips them so F5 does not re-apply. Returns { tab?, watch?, opts?, sort?, sym?, bad? } or { error }.
  async function readIncoming(tabs) {
    const q = new URLSearchParams(location.search), hash = location.hash.slice(1);
    let res = null;
    try {
      if (hash) res = sanitize(await ShareCodec.decode(decodeURIComponent(hash)), tabs) || { error: true };
      else if (q.has("data")) { const d = q.get("data"); res = sanitize(await ShareCodec.decode(d), tabs) || fromText(d); }
      else if (q.has("demo")) res = Object.hasOwn(DEMOS, q.get("demo")) ? fromText(DEMOS[q.get("demo")].text) : { error: true };
      if (q.has("tab") && Board.validTab(q.get("tab"))) (res ||= {}).tab ||= q.get("tab");
    } catch { res = { error: true }; }
    if (hash || q.has("data") || q.has("demo") || q.has("tab")) history.replaceState(null, "", location.pathname);
    return res;
  }


  return { copyLink, readIncoming, fromText };
})();
// App state + polling loop: resolve the tab's symbols, poll quotes + indices, feed the views, load trades for the selected symbol.
const Board = (() => {
  const TABS = [
    { id: "watch", label: "★ Danh mục" }, { id: "market", label: "Thị trường" }, { id: "screener", label: "Bộ lọc" }, { id: "VN30" }, { id: "VN100" }, { id: "hose", label: "HOSE" }, { id: "hnx", label: "HNX" },
    { id: "HNX30" }, { id: "upcom", label: "UPCOM" }, { id: "ETF" }, { id: "CW", label: "Chứng quyền" },
  ];
  const MORE = ["VNMID", "VNSML", "VNDIAMOND", "VNFINLEAD", "VNX50"];
  const TAB_IDS = new Set([...TABS.map(t => t.id), ...MORE]);
  const validTab = t => TAB_IDS.has(t) || /^icb:\d{4}$/.test(t);
  const S = { tab: "watch", syms: [], quotes: new Map(), sel: "", selQuote: null, missing: [], bad: [], gen: 0, seq: 0, timer: 0, at: null, error: false, loading: true, trades: null };
  const lists = new Map();
  let opts = {}, filterText = "";

  async function symbolsFor(tab) {
    if (tab === "watch") return Watch.all();
    if (MarketTabs.is(tab)) return Market.allSymbols();
    if (tab.startsWith("icb:")) return Market.sectorCodes(tab.slice(4));
    if (lists.has(tab)) return lists.get(tab);
    let syms;
    if (tab === "ETF" || tab === "CW") {
      if (!Universe.ready()) await Universe.load();
      syms = Universe.ofType(tab === "ETF" ? "E" : "W");
      // The directory keeps expired warrants → keep only those still trading.
      if (tab === "CW") { const today = QuoteModel.vnDate(); syms = (await Feed.quotes(syms)).filter(q => q.cw && q.cw.lastTrade >= today).map(q => q.sym).sort(); }
    } else syms = await Feed.list(tab);
    if (syms.length) lists.set(tab, syms);
    return syms;
  }

  async function setTab(tab) {
    S.tab = validTab(tab) ? tab : "watch";
    Prefs.set("tab", S.tab);
    const gen = ++S.gen;
    clearTimeout(S.timer);
    Object.assign(S, { quotes: new Map(), missing: [], loading: true, syms: [] });
    Controls.tabChanged(S.tab);
    MarketTabs.show(S.tab);
    BoardView.message(T("Đang tải danh sách mã…"));
    try {
      const syms = await symbolsFor(S.tab);
      if (gen !== S.gen) return;
      S.syms = syms;
    } catch (e) {
      if (gen !== S.gen) return;
      console.warn("setTab - load symbol list fail", S.tab, e);
      S.error = true;
    }
    await tick();
  }

  // seq: only the latest poll may write state (a watchlist edit can start a 2nd tick while one is in flight).
  async function tick() {
    clearTimeout(S.timer);
    const gen = S.gen, seq = ++S.seq;
    try {
      // A symbol list that failed to load (network down on tab switch) is retried on every poll.
      if (!S.syms.length && S.tab !== "watch") { const syms = await symbolsFor(S.tab); if (gen !== S.gen || seq !== S.seq) return; S.syms = syms; }
      // Alert tickers outside the current tab ride along in the same poll (not shown in the table).
      const want = [...new Set([...S.syms, ...Alerts.symbols()])];
      const [qs, idx] = await Promise.all([want.length ? Feed.quotes(want) : [], Feed.indices()]);
      if (gen !== S.gen || seq !== S.seq) return;
      Object.assign(S, { quotes: new Map(qs.map(q => [q.sym, q])), at: new Date(), error: false, loading: false });
      S.missing = S.tab === "watch" ? S.syms.filter(s => !S.quotes.has(s)) : [];
      IndexStrip.render(idx);
      checkAlerts(S.quotes);
      const first = BoardCols.sortQuotes(visibleQuotes(), BoardView.getSort().key, BoardView.getSort().dir)[0];
      if (S.quotes.has(S.sel) && !S.trades) select(S.sel, false);
      else if (!S.quotes.has(S.sel) && first) select(first.sym, false);
      draw();
      refreshTrades();
      ChartCtl.onQuote(S.quotes.get(S.sel));
      DetailTabs.onQuote(S.quotes.get(S.sel));
    } catch (e) {
      if (gen !== S.gen || seq !== S.seq) return;
      console.warn("tick - poll VPS datafeed fail", e);
      Object.assign(S, { error: true, loading: false });
      if (!S.quotes.size) BoardView.message(T("Không tải được dữ liệu từ VPS. Kiểm tra kết nối mạng — tool sẽ tự thử lại."));
    }
    Controls.status();
    schedule();
  }

  // Alerts fire only while prices are live (session or lunch break): pre-open / evening / weekend quotes are yesterday's.
  function checkAlerts(quotes) {
    const ph = QuoteModel.phase();
    if (QuoteModel.isLive(ph) || ph === "break") PersonalUI.onHits(Alerts.check(quotes), quotes);
  }
  // Hidden page: no board redraws, but alert tickers are still polled every 60 s so notifications can fire.
  async function alertTick() {
    try { const qs = await Feed.quotes(Alerts.symbols()); checkAlerts(new Map(qs.map(q => [q.sym, q]))); }
    catch (e) { console.warn("alertTick - poll alert tickers fail", e); }
    schedule();
  }

  function schedule() {
    clearTimeout(S.timer);
    if (opts.rate === "off") return;
    if (document.hidden) { if (Alerts.symbols().length) S.timer = setTimeout(alertTick, 60000); return; }
    // Whole-market tabs poll ~1,500 quotes (≈1.5 MB) → at most every 30 s.
    const ms = Math.max((+opts.rate || 5) * 1000, QuoteModel.isLive(QuoteModel.phase()) ? 0 : 60000, MarketTabs.is(S.tab) ? 30000 : 0);
    S.timer = setTimeout(tick, ms);
  }

  function visibleQuotes() {
    const all = S.syms.map(s => S.quotes.get(s)).filter(Boolean);
    const toks = filterText.toUpperCase().split(/[\s,;|]+/).filter(Boolean);
    return toks.length ? all.filter(q => toks.some(t => q.sym.startsWith(t))) : all;
  }

  function draw(force = false) {
    if (MarketTabs.is(S.tab)) { const qs = S.syms.map(s => S.quotes.get(s)).filter(Boolean); MarketTabs.render(S.tab, qs); Controls.count(qs.length, S.syms.length); renderDetail(); return; }
    const list = visibleQuotes();
    Notes.decorate(list);
    if (list.length) BoardView.render(list, opts, force);
    else if (!S.loading && S.tab === "watch" && !S.syms.length) BoardView.message(T("Danh mục trống — gõ mã vào ô “Lọc / thêm mã” rồi bấm ★ Thêm."));
    else if (!S.loading && S.quotes.size) BoardView.message(T("Không có mã khớp bộ lọc “{q}”.", { q: filterText }));
    else if (!S.loading && !S.error) BoardView.message(T("Không có mã nào."));
    Controls.count(list.length, S.syms.length);
    renderDetail();
  }

  function renderDetail() {
    const q = S.quotes.get(S.sel) || S.selQuote;
    if (q) S.selQuote = q;
    const t = S.trades && S.trades.sym === S.sel ? S.trades : null;
    DetailView.render({ q, name: q ? Universe.name(q.sym, I18n.lang) : "", watched: !!q && Watch.has(q.sym), unit: opts.unit,
      trades: t && t.list, tradeState: t ? t.state : "loading" });
  }

  function select(sym, fromUser) {
    if (sym !== S.sel || !S.trades) { S.sel = sym; S.selQuote = S.quotes.get(sym) || null; loadTrades(sym); }
    BoardView.select(sym);
    renderDetail();
    ChartCtl.setSymbol(sym);
    DetailTabs.setSymbol(sym);
    DetailTabs.onQuote(S.quotes.get(sym));
    if (fromUser) PhoneLayout.show(1);
  }

  async function loadTrades(sym) {
    const keep = S.trades && S.trades.sym === sym && S.trades.list;
    S.trades = { sym, list: keep || null, state: keep ? "ok" : "loading", at: Date.now(), totVol: S.quotes.get(sym)?.totVol || 0 };
    renderDetail();
    try {
      const list = await Feed.trades(sym);
      if (S.trades?.sym !== sym) return;
      Object.assign(S.trades, { list, state: "ok" });
    } catch (e) {
      console.warn("loadTrades - get match history fail", sym, e);
      if (S.trades?.sym !== sym) return;
      S.trades.state = S.trades.list ? "ok" : "error";
    }
    renderDetail();
  }

  // Match history is large → reload only when the matched volume moved and the last load is ≥ 60 s old (≈3.5 MB for a liquid ticker).
  function refreshTrades() {
    const q = S.quotes.get(S.sel), t = S.trades;
    if (q && t && t.sym === S.sel && t.state !== "loading" && q.totVol !== t.totVol && Date.now() - t.at > 60000) loadTrades(S.sel);
  }

  function onWatchChange() {
    BoardView.refreshStars();
    if (S.tab === "watch") {
      S.syms = Watch.all();
      if (S.syms.some(s => !S.quotes.has(s))) { BoardView.message(T("Đang tải danh sách mã…")); tick(); } else { S.missing = []; draw(); }
    } else renderDetail();
    Controls.status();
  }

  // Demo / share link / ?data=: { tab?, watch?, opts?, sort?, sym?, bad?, error? }.
  function applyIncoming(res) {
    if (!res) return false;
    if (res.error) { Controls.say("bad", "Link chia sẻ hoặc mẫu không hợp lệ — giữ nguyên danh mục hiện tại."); return false; }
    if (res.opts) setOpts(Controls.writeOpts(res.opts), false);
    if (res.sort) BoardView.setSort(res.sort);
    if (res.chart) ChartCtl.set(res.chart);
    if (res.fin) { FinView.set(res.fin); DetailTabs.reload("finance"); }
    if (res.dtab) DetailTabs.show(res.dtab);
    if (res.watch) Watch.replace(res.watch);
    S.bad = res.bad || [];
    if (res.sym) { S.sel = res.sym; S.selQuote = null; S.trades = null; }
    setTab(res.tab || (res.watch ? "watch" : S.tab));
    if (res.sym) PhoneLayout.show(1);
    return true;
  }

  function setOpts(o, redraw = true) {
    opts = o;
    Prefs.set("opts", o);
    if (redraw) { draw(true); schedule(); }
  }

  const setFilter = Dom.debounce(v => { filterText = v; draw(); }, 150);
  const payload = () => ({ tab: S.tab, watch: Watch.all(), opts, sort: BoardView.getSort(), sym: S.sel, chart: ChartCtl.get(), dtab: DetailTabs.get(), fin: FinView.get() });

  Watch.onChange(onWatchChange);
  document.addEventListener("visibilitychange", () => { if (!document.hidden && opts.rate !== "off" && !(S.loading && !S.syms.length)) tick(); else schedule(); });

  return { TABS, MORE, TAB_IDS, validTab, state: () => S, getOpts: () => opts, setTab, tick, draw, select, loadTrades, renderDetail, applyIncoming, setOpts, setFilter, payload, setBad: b => { S.bad = b; } };
})();
// DOM wiring: tabs, toolbar options, add / filter box, share / undo, CSV, keyboard, status footer, language switch, start-up.
const Controls = (() => {
  let msg = null, msgTimer = 0;
  const PHASE = { pre: "Chưa mở cửa", ato: "Phiên ATO", open: "Khớp lệnh liên tục", break: "Nghỉ trưa", atc: "Phiên ATC", plo: "Sau giờ (PLO)", closed: "Đóng cửa" };
  const tabLabel = id => { if (id.startsWith("icb:")) return Market.sectorName(id.slice(4), I18n.lang); const t = Board.TABS.find(x => x.id === id); return t && t.label ? T(t.label) : id; };

  function say(cls, key, params) {
    msg = { cls, key, params };
    clearTimeout(msgTimer);
    msgTimer = setTimeout(() => { msg = null; status(); }, 8000);
    status();
  }

  function status() {
    const S = Board.state(), o = Board.getOpts(), out = [];
    const ph = QuoteModel.phase();
    $("phase").textContent = T(PHASE[ph]);
    $("phase").className = "badge " + (QuoteModel.isLive(ph) ? "live" : "");
    if (S.error) out.push(`<span class="bad">${Dom.esc(T("Mất kết nối tới VPS — đang thử lại…"))}</span>`);
    else if (S.at) out.push(`<span>${Dom.esc(T("Cập nhật lúc {t}", { t: S.at.toLocaleTimeString("vi-VN", { hour12: false }) }))}</span>`);
    out.push(`<span class="muted">${Dom.esc(o.rate === "off" ? T("Đã tạm dừng cập nhật") : QuoteModel.isLive(ph) ? T("Làm mới mỗi {n}s", { n: o.rate }) : T("Ngoài giờ giao dịch: làm mới mỗi 60s"))}</span>`);
    if (S.bad.length) out.push(`<span class="warn">${Dom.esc(T("Bỏ qua (không phải mã CK): {list}", { list: S.bad.join(", ") }))}</span>`);
    if (S.missing.length) out.push(`<span class="warn">${Dom.esc(T("Không có dữ liệu cho {n} mã: {list}", { n: S.missing.length, list: S.missing.join(", ") }))}</span>`
      + ` <button id="dropMissing">${Dom.esc(T("Bỏ các mã này khỏi danh mục"))}</button>`);
    if (msg) out.push(`<span class="${msg.cls}">${Dom.esc(T(msg.key, msg.params))}</span>`);
    $("status").innerHTML = out.join(" · ");
    $("undo").hidden = !Watch.hasBackup();
  }

  const sectorOptions = () => { const s = Market.sectors(); return s ? s.levels[2].map(x => [x.code, I18n.lang === "en" && x.en ? x.en : x.vi]).sort((a, b) => a[1].localeCompare(b[1]))
    .map(([c, n]) => `<option value="icb:${Dom.esc(c)}">${Dom.esc(n)}</option>`).join("") : ""; };
  function buildTabs() {
    $("tabs").innerHTML = Board.TABS.map(t => `<button data-tab="${t.id}">${Dom.esc(tabLabel(t.id))}</button>`).join("")
      + `<select id="moreTabs" title="${Dom.esc(T("Rổ chỉ số khác"))}"><option value="">${Dom.esc(T("Rổ khác…"))}</option>${Board.MORE.map(k => `<option>${k}</option>`).join("")}</select>`
      + `<select id="sectorTabs" title="${Dom.esc(T("Bảng giá theo ngành ICB"))}"><option value="">${Dom.esc(T("Ngành…"))}</option>${sectorOptions()}</select>`;
    tabChanged(Board.state().tab);
  }
  function tabChanged(tab) {
    $("tabs").querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
    const more = $("moreTabs");
    more.value = Board.MORE.includes(tab) ? tab : "";
    more.classList.toggle("on", !!more.value);
    const sec = $("sectorTabs");
    sec.value = tab.startsWith("icb:") ? tab : "";
    sec.classList.toggle("on", !!sec.value);
    $("boardTitle").textContent = tabLabel(tab);
  }
  const count = (n, total) => { $("count").textContent = n === total ? T("{n} mã", { n }) : T("{n} / {total} mã", { n, total }); };

  const optEls = () => [...document.querySelectorAll("[data-opt]")];
  const readOpts = () => Object.fromEntries(optEls().map(el => [el.id, el.type === "checkbox" ? el.checked : el.value]));
  // Values from share links / storage are untrusted: known controls only, booleans for checkboxes, existing <option>s.
  function writeOpts(o = {}) {
    for (const el of optEls()) {
      if (!Object.hasOwn(o, el.id)) continue;
      const v = o[el.id];
      if (el.type === "checkbox") el.checked = v === true;
      else if (typeof v === "string" && [...el.options].some(x => x.value === v)) el.value = v;
    }
    return readOpts();
  }

  function addFromBox() {
    const r = WatchParse.parse($("q").value);
    Board.setBad(r.bad);
    if (!r.symbols.length) { say(r.bad.length ? "warn" : "muted", "Gõ mã chứng khoán, cách nhau bằng dấu phẩy hoặc khoảng trắng (vd: VNM, FPT)."); return; }
    const fresh = Watch.add(r.symbols);
    $("q").value = ""; Board.setFilter("");
    if (fresh.length) say("good", "✔ Đã thêm {n} mã vào danh mục.", { n: fresh.length });
    else say("muted", "Các mã này đã có trong danh mục.");
  }

  function exportCsv() {
    const S = Board.state(), o = Board.getOpts(), cols = BoardCols.visible(o);
    const cell = v => /[",\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v;
    const head = cols.map(c => (c.g ? T(c.g) + " " : "") + T(c.h, { n: c.n }));
    const lines = BoardView.order().map(s => S.quotes.get(s)).filter(Boolean).map(q => BoardCols.rowCells(q, o).map(c => cell(c.t)).join(","));
    if (!lines.length) { say("warn", "Bảng đang trống."); return; }
    Dom.download(String.fromCharCode(0xfeff) + [head.map(cell).join(","), ...lines].join("\r\n"), `${T("bang-gia")}-${S.tab}-${QuoteModel.vnDate()}.csv`, "text/csv;charset=utf-8");
  }

  function moveSelection(step) {
    const order = BoardView.order(), i = order.indexOf(Board.state().sel);
    const next = order[Math.max(0, Math.min(order.length - 1, i + step))];
    if (next) Board.select(next, false);
  }

  function wire() {
    $("tabs").addEventListener("click", e => { const b = e.target.closest("button[data-tab]"); if (b) { Board.setBad([]); Board.setTab(b.dataset.tab); } });
    $("tabs").addEventListener("change", e => { if ((e.target.id === "moreTabs" || e.target.id === "sectorTabs") && e.target.value) { Board.setBad([]); Board.setTab(e.target.value); } });
    $("q").oninput = e => Board.setFilter(e.target.value);
    $("q").onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); addFromBox(); } };
    $("add").onclick = addFromBox;
    $("share").onclick = () => ShareDemo.copyLink(Board.payload(), say);
    $("undo").onclick = () => { Watch.undo(); Board.setBad([]); Board.setTab("watch"); };
    $("csv").onclick = exportCsv;
    document.addEventListener("change", e => { if (e.target.matches("[data-opt]")) Board.setOpts(readOpts()); });
    $("board").addEventListener("dblclick", e => { const tr = e.target.closest("tr[data-sym]"); if (tr && !e.target.closest("button")) { Board.select(tr.dataset.sym, false); ChartCtl.openDialog(); } });
    $("status").addEventListener("click", e => { if (e.target.id === "dropMissing") Watch.remove(Board.state().missing); });
    $("detail").addEventListener("click", e => {
      const S = Board.state();
      if (e.target.id === "dStar" && S.sel) Watch.toggle(S.sel);
      if (e.target.id === "dReload" && S.sel) Board.loadTrades(S.sel);
      if (e.target.id === "dChart") ChartCtl.openDialog();
      if (e.target.id === "dAlert" && S.sel) PersonalUI.openAlerts(S.sel);
    });
    document.addEventListener("keydown", e => {
      if (e.target.closest("input, select, textarea") || e.ctrlKey || e.metaKey || e.altKey) return;
      if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); moveSelection(e.key === "ArrowDown" ? 1 : -1); }
    });
    addEventListener("hashchange", async () => { if (location.hash) Board.applyIncoming(await ShareDemo.readIncoming(Board.TAB_IDS)); });
    I18n.onChange(() => { buildTabs(); IndexStrip.render(); Board.draw(true); status(); });
  }

  async function start() {
    I18n.init();
    // Price boards are read on dark backgrounds → dark unless the viewer already picked a theme.
    ThemePicker.bind($("theme"), { get: (k, d) => Prefs.get(k, k === "theme" ? "dark" : d), set: Prefs.set });
    BoardView.init($("board"), { name: s => Universe.name(s, I18n.lang), onSelect: Board.select, onStar: s => Watch.toggle(s), onSort: () => Board.draw(true) });
    IndexStrip.init($("indices"));
    DetailView.init($("dHead"), $("dOverview"), $("dBottom"));
    ChartCtl.init();
    DetailTabs.init();
    Board.setOpts(writeOpts(Prefs.get("opts", {})), false);
    const savedTab = Prefs.get("tab", "watch");
    Board.state().tab = typeof savedTab === "string" && Board.validTab(savedTab) ? savedTab : "watch";
    buildTabs();
    wire();
    MarketTabs.init();
    PersonalUI.init();
    WatchIO.init();
    Market.sectorsLoad().then(buildTabs, e => console.warn("start - load ICB sectors fail", e));
    Universe.load().then(() => Board.draw(true), e => console.warn("start - load symbol directory fail", e));
    const incoming = await ShareDemo.readIncoming(Board.TAB_IDS);
    if (!Board.applyIncoming(incoming)) Board.setTab(Board.state().tab);
  }

  return { start, say, status, tabChanged, count, writeOpts };
})();
Controls.start();
</script>
</body>
