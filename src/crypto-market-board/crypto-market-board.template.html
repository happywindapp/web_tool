<!-- GoatCounter: chỉ gửi path (không query/hash); chạy local đếm thành /local/<tên file> để không lộ thư mục máy -->
<script>
{ const local = !location.protocol.startsWith("http") || ["localhost", "127.0.0.1"].includes(location.hostname);
  const p = local ? "/local/" + location.pathname.split("/").pop() : location.pathname.replace(/index[.]html$/, "");
  const gc = "https://quan111.goatcounter.com/count";
  navigator.sendBeacon?.(gc + "?" + new URLSearchParams({ p, r: document.referrer.split("?")[0], t: document.title, s: screen.width }));
  addEventListener("DOMContentLoaded", () => {
    const el = document.querySelector(".gc-views");
    // GoatCounter cache mỗi URL (kể cả 404) tới 4 giờ ⇒ đổi start mỗi 10 phút; mọi ngày trước khi ra mắt cho cùng tổng
    const start = "2026-10-" + String(Math.floor(Date.now() / 6e5) % 28 + 1).padStart(2, "0");
    if (el) fetch(gc + "er/" + encodeURIComponent(p) + ".json?start=" + start).then(r => r.status === 404 ? { count: "0" } : r.json())
      .then(j => { el.textContent = "👁 " + j.count; el.hidden = false; }).catch(() => {});
  }); }
</script>

<header class="top">
  <a class="btn" href="../index.html">← Trang chủ</a>
  <h1>Bảng giá Crypto &amp; On-chain</h1>
  <button class="more-toggle" title="Thêm thao tác" aria-expanded="false">⋯</button>
  <button id="share" title="Chép link chứa tab + danh mục + tuỳ chọn (nằm sau dấu #, không gửi lên máy chủ; không kèm vị thế của bạn)">🔗 Chia sẻ link</button>
  <button id="alertsBtn" title="Cảnh báo giá cho các coin (lưu trong trình duyệt này)">🔔 Cảnh báo</button>
  <button id="calcBtn" title="DCA backtest, quy đổi coin ↔ USD ↔ VND, tính giá thanh lý Futures, khối lượng theo rủi ro">🧮 Công cụ</button>
  <button id="undo" title="Lấy lại danh mục trước khi nạp mẫu / link chia sẻ" hidden>↶ Khôi phục danh mục trước</button>
  <label class="chk" title="Giao diện sáng / tối">Giao diện
    <select id="theme"><option value="auto">Tự động</option><option value="light">Sáng</option><option value="dark">Tối</option></select></label>
  <span class="seg lang-switch" title="Ngôn ngữ"><span class="gc-views" title="Lượt truy cập (GoatCounter, cập nhật mỗi ~10 phút)" hidden></span><button data-lang="vi">VI</button><button data-lang="en">EN</button></span>
  <nav class="seg wb-nav" id="tabs"></nav>
</header>
<div class="toolbar">
  <button id="saveList" title="Lưu danh mục ★ hiện tại thành bản có tên (trong trình duyệt này, tối đa 30 bản)">💾 Lưu danh mục</button>
  <select id="savedLists" title="Mở lại một danh mục đã lưu"></select>
  <button id="delList" title="Xoá danh mục đang mở khỏi trình duyệt" hidden>🗑</button>
  <label class="btn" title="Nhập danh mục từ file JSON do tool xuất, hoặc TXT / CSV chứa mã coin (CSV lấy cột đầu)">⬆ Nhập<input type="file" id="importList" accept=".json,.txt,.csv,.tsv,text/plain,application/json"></label>
  <button id="exportList" title="Tải danh mục ★ kèm vị thế, ghi chú và cảnh báo thành file JSON">⬇ Xuất danh mục</button>
  <span class="sep"></span>
  <input type="text" id="q" placeholder="Lọc / thêm coin: BTC, ETH…" title="Gõ để lọc bảng; Enter hoặc ★ Thêm để đưa vào danh mục" autocomplete="off" spellcheck="false">
  <button id="add" class="main" title="Thêm các coin đang gõ vào danh mục ★ (lưu trong trình duyệt này)">★ Thêm</button>
  <span class="sep"></span>
  <label class="chk" title="Realtime qua WebSocket Binance, hoặc lấy định kỳ; tab ẩn quá 30 giây thì giãn 60 giây">Cập nhật
    <select id="rate" data-opt><option value="live">Realtime</option><option value="5">5s</option><option value="15">15s</option><option value="60">60s</option><option value="off">Tạm dừng</option></select></label>
  <label class="chk" title="Đơn vị tiền hiển thị; VND quy đổi theo giá USDT/VND của CoinGecko">Tiền
    <select id="cur" data-opt><option value="USD">USD</option><option value="VND">VND</option></select></label>
  <label class="chk" title="Hiện cột vị thế của bạn trong ★ Danh mục: số lượng, giá vốn, giá trị, lãi/lỗ"><input type="checkbox" id="pos" data-opt checked>Vị thế</label>
  <label class="chk" title="Hiện biểu đồ nhỏ 7 ngày trong bảng"><input type="checkbox" id="spark" data-opt checked>7 ngày</label>
  <span class="sep"></span>
  <button id="csv" title="Tải bảng đang xem thành CSV (mở bằng Excel)">⬇ CSV</button>
</div>
<section id="strip" class="indices" data-i18n-skip></section>
<div class="seg pane-switch"><button>Bảng giá</button><button>Chi tiết coin</button></div>
<main class="work pane-scroller" id="work">
  <section class="pane board-pane">
    <div class="bar"><b id="boardTitle">★ Danh mục</b><span id="count" class="muted"></span><span id="liveBadge" class="badge"></span></div>
    <div class="scroll" id="boardBox"><div id="subBar" class="subbar" hidden data-i18n-skip></div><div id="pfBar" data-i18n-skip hidden></div><table id="board" class="board"></table></div>
    <div class="scroll market" id="marketView" hidden data-i18n-skip></div>
  </section>
  <section class="pane detail-pane">
    <div class="bar"><b>Chi tiết coin</b></div>
    <div class="scroll" id="detail" data-i18n-skip>
      <div id="dHead"></div>
      <nav class="dtabs" id="dTabs"></nav>
      <section class="dpanel" data-tab="overview"><div id="dOverview"></div></section>
      <section class="dpanel" data-tab="chart" hidden>
        <section id="miniChart" class="mini-chart">
          <div class="cbar" id="miniBar"></div>
          <div class="cbox"><div class="clegend" id="miniLegend"></div><div class="chost" id="miniHost"></div><p class="cmsg" id="miniMsg" hidden></p></div>
        </section>
        <div id="dOutlook"></div>
      </section>
      <section class="dpanel" data-tab="book" hidden><div id="dBook"></div></section>
      <section class="dpanel" data-tab="deriv" hidden><div id="dDeriv"></div></section>
      <section class="dpanel" data-tab="profile" hidden><div id="dProfile"></div></section>
    </div>
  </section>
</main>
<footer class="status" id="status" data-i18n-skip></footer>
<dialog id="toolDlg" class="tool-dlg" data-i18n-skip></dialog>
<dialog id="chartDlg" class="chart-dlg" data-i18n-skip>
  <div class="dlg-head"><span id="dlgTitle"></span><button id="dlgClose">✕</button></div>
  <div class="cbar" id="fullBar"></div>
  <div class="ichips" id="fullChips"></div>
  <div class="cbox"><div class="clegend" id="fullLegend"></div><div class="chost" id="fullHost"></div><div class="ctip" id="fullTip" hidden></div><p class="cmsg" id="fullMsg" hidden></p></div>
  <div class="dlg-foot muted" id="fullStatus"></div>
</dialog>
<dialog id="guideDlg" class="tool-dlg guide-dlg" data-i18n-skip></dialog>
<div class="toasts" id="toasts" data-i18n-skip></div>
