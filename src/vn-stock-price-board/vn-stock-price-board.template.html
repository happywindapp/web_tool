<!-- GoatCounter: chỉ gửi path (không query/hash); chạy local đếm thành /local/<tên file> để không lộ thư mục máy -->
<script>
{ const local = !location.protocol.startsWith("http") || ["localhost", "127.0.0.1"].includes(location.hostname);
  const p = local ? "/local/" + location.pathname.split("/").pop() : location.pathname.replace(/index[.]html$/, "");
  const gc = "https://quan111.goatcounter.com/count";
  navigator.sendBeacon?.(gc + "?" + new URLSearchParams({ p, r: document.referrer.split("?")[0], t: document.title, s: screen.width }));
  addEventListener("DOMContentLoaded", () => {
    const el = document.querySelector(".gc-views");
    // GoatCounter cache mỗi URL (kể cả 404) tới 4 giờ ⇒ đổi start mỗi 10 phút; mọi ngày trước khi ra mắt cho cùng tổng
    const start = "2026-10-" + String(Math.floor(Date.now() / 6e5) % 28 + 1).padStart(2, "0");
    if (el) fetch(gc + "er/" + encodeURIComponent(p) + ".json?start=" + start).then(r => r.status === 404 ? { count: "0" } : r.json())
      .then(j => { el.textContent = "👁 " + j.count; el.hidden = false; }).catch(() => {});
  }); }
</script>
</head>
<body>
<header class="top">
  <a class="btn" href="../index.html">← Trang chủ</a>
  <h1>Bảng giá chứng khoán</h1>
  <button class="more-toggle" title="Thêm thao tác" aria-expanded="false">⋯</button>
  <button id="share" title="Chép link chứa tab + danh mục + tuỳ chọn (nằm sau dấu #, không gửi lên máy chủ)">🔗 Chia sẻ link</button>
  <button id="alertsBtn" title="Cảnh báo giá cho các mã (lưu trong trình duyệt này)">🔔 Cảnh báo</button>
  <button id="calBtn" title="Cổ tức, ĐHCĐ, phát hành sắp tới của các mã trong ★ Danh mục">📅 Lịch sự kiện</button>
<button id="corrBtn" title="Tương quan giá giữa các mã trong ★ Danh mục và VNINDEX">🔗 Tương quan</button>
  <button id="undo" title="Lấy lại danh mục trước khi nạp mẫu / link chia sẻ" hidden>↶ Khôi phục danh mục trước</button>
  <label class="chk" title="Giao diện sáng / tối">Giao diện
    <select id="theme"><option value="auto">Tự động</option><option value="light">Sáng</option><option value="dark">Tối</option></select></label>
  <span class="seg lang-switch" title="Ngôn ngữ"><span class="gc-views" title="Lượt truy cập (GoatCounter, cập nhật mỗi ~10 phút)" hidden></span><button data-lang="vi">VI</button><button data-lang="en">EN</button></span>
  <nav class="seg wb-nav" id="tabs"></nav>
</header>
<div class="toolbar">
  <button id="saveList" title="Lưu danh mục ★ hiện tại thành bản có tên (trong trình duyệt này, tối đa 30 bản)">💾 Lưu danh mục</button>
  <select id="savedLists" title="Mở lại một danh mục đã lưu"></select>
  <button id="delList" title="Xoá danh mục đang mở khỏi trình duyệt" hidden>🗑</button>
  <label class="btn" title="Nhập danh mục từ file JSON do tool xuất, hoặc TXT / CSV chứa mã (CSV lấy cột đầu)">⬆ Nhập<input type="file" id="importList" accept=".json,.txt,.csv,.tsv,text/plain,application/json"></label>
  <button id="exportList" title="Tải danh mục ★ kèm ghi chú, giá mục tiêu và cảnh báo của các mã thành file JSON">⬇ Xuất danh mục</button>
  <span class="sep"></span>
  <input type="text" id="q" placeholder="Lọc / thêm mã: VNM, FPT…" title="Gõ để lọc bảng; Enter hoặc ★ Thêm để đưa vào danh mục" autocomplete="off" spellcheck="false">
  <button id="add" class="main" title="Thêm các mã đang gõ vào danh mục ★ (lưu trong trình duyệt này)">★ Thêm</button>
  <label class="chk" title="Chu kỳ lấy dữ liệu mới; ngoài giờ giao dịch tự giãn ra 60 giây, tab ẩn thì dừng">Cập nhật
    <select id="rate" data-opt><option value="3">3s</option><option value="5" selected>5s</option><option value="10">10s</option><option value="30">30s</option><option value="off">Tạm dừng</option></select></label>
  <label class="chk" title="Đơn vị khối lượng: lô 10 cổ phiếu như bảng giá các công ty CK, hoặc số cổ phiếu thật">KL
    <select id="unit" data-opt><option value="x10">×10 CP</option><option value="share">Cổ phiếu</option></select></label>
  <label class="chk" title="Hiện cột giá Cao / Thấp / Trung bình"><input type="checkbox" id="hl" data-opt checked>Cao/Thấp</label>
  <label class="chk" title="Hiện cột nhà đầu tư nước ngoài: mua, bán, room"><input type="checkbox" id="fr" data-opt checked>ĐTNN</label>
  <label class="chk" title="Ẩn bước giá 2–3 và cột Trần/Sàn cho bảng gọn"><input type="checkbox" id="compact" data-opt>Gọn</label>
  <label class="chk" title="Hiện cột giá mục tiêu bạn tự đặt (tab Định giá) và % còn lại tới mục tiêu"><input type="checkbox" id="tg" data-opt>Mục tiêu</label>
  <span class="sep"></span>
  <button id="csv" title="Tải bảng đang xem thành CSV (mở bằng Excel)">⬇ CSV</button>
</div>
<section id="indices" class="indices" data-i18n-skip></section>
<div class="seg pane-switch"><button>Bảng giá</button><button>Chi tiết mã</button></div>
<main class="work pane-scroller">
  <section class="pane board-pane">
    <div class="bar"><b id="boardTitle">★ Danh mục</b><span id="count" class="muted"></span><span id="phase" class="badge"></span></div>
    <div class="scroll" id="boardBox"><table id="board" class="board"></table></div>
    <div class="scroll market" id="marketView" hidden data-i18n-skip></div>
  </section>
  <section class="pane detail-pane">
    <div class="bar"><b>Chi tiết mã</b></div>
    <div class="scroll" id="detail" data-i18n-skip>
      <div id="dHead"></div>
      <nav class="dtabs" id="dTabs"></nav>
      <section class="dpanel" data-tab="overview"><div id="dOverview"></div><div id="dRatios"></div></section>
      <section class="dpanel" data-tab="valuation" hidden><div id="dValuation"></div></section>
      <section class="dpanel" data-tab="chart" hidden>
      <section id="miniChart" class="mini-chart" hidden>
        <div class="cbar" id="miniBar"></div>
        <div class="cbox"><div class="clegend" id="miniLegend"></div><div class="chost" id="miniHost"></div><p class="cmsg" id="miniMsg" hidden></p></div>
      </section>
      <div id="dOutlook"></div>
      </section>
      <section class="dpanel" data-tab="trades" hidden><div id="dBottom"></div></section>
      <section class="dpanel" data-tab="news" hidden><div id="dNews"></div></section>
      <section class="dpanel" data-tab="finance" hidden><div id="dFinance"></div></section>
      <section class="dpanel" data-tab="events" hidden><div id="dEvents"></div></section>
      <section class="dpanel" data-tab="profile" hidden><div id="dProfile"></div></section>
      <section class="dpanel" data-tab="recs" hidden><div id="dRecs"></div></section>
    </div>
  </section>
</main>
<footer class="status" id="status" data-i18n-skip></footer>
<dialog id="toolDlg" class="tool-dlg" data-i18n-skip></dialog>
<dialog id="indHelpDlg" class="tool-dlg ind-guide" data-i18n-skip></dialog>
<dialog id="chartDlg" class="chart-dlg" data-i18n-skip>
  <div class="dlg-head"><span id="dlgTitle"></span><button id="dlgClose">✕</button></div>
  <div class="cbar" id="fullBar"></div>
  <div class="ichips" id="fullChips"></div>
  <div class="cgrid" id="fullGrid" data-n="1"><div class="cbox"><div class="clegend" id="fullLegend"></div><div class="chost" id="fullHost"></div><div class="ctip" id="fullTip" hidden></div><p class="cmsg" id="fullMsg" hidden></p></div></div>
  <div class="dlg-foot muted" id="fullStatus"></div>
</dialog>
